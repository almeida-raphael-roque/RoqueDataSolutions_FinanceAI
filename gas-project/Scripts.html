  function renderPlanningCompositionChart(data) {
    const ctx = document.getElementById('planning-composition-chart');
    if (!ctx) return;

    if (planningCompositionChartInstance) {
      planningCompositionChartInstance.destroy();
    }

    let chartLabels = [];
    let chartValues = [];
    let chartColors = [];
    let chartSubtext = '';
    let isDrilldown = false;

    if (planningCompositionView === 'macro') {
      // Visão Geral: Receitas e Macrocategorias de Despesas
      $('#planning-bar-chart-title').html('<i class="fa-solid fa-chart-column text-emerald-600 text-sm"></i><span>Composição: Receitas e Macrocategorias</span>');
      $('#planning-bar-chart-subtitle').text('Clique em uma barra para detalhar as categorias que a compõem');
      $('#btn-reset-planning-bar-chart').addClass('hidden');

      chartLabels = ['Receitas'];
      chartValues = [data.summary.totalYearIncome];
      chartColors = ['#10b981']; // Green

      const macroColors = {
        'Fixas': '#991b1b', // Dark red
        'Variáveis Essenciais': '#ef4444', // Medium red
        'Discricionárias': '#f87171' // Light red
      };

      data.expenseMacros.forEach(m => {
        chartLabels.push(m.label);
        chartValues.push(m.totalYear);
        chartColors.push(macroColors[m.key] || '#ef4444');
      });

    } else if (planningCompositionView === 'income') {
      // Drilldown: Detalhamento de Receitas em Verde
      isDrilldown = true;
      $('#planning-bar-chart-title').html('<i class="fa-solid fa-arrow-trend-up text-emerald-600 text-sm"></i><span>Detalhamento: Categorias de Receitas</span>');
      $('#planning-bar-chart-subtitle').text('Distribuição percentual das fontes de receita no ano');
      $('#btn-reset-planning-bar-chart').removeClass('hidden');

      // Tons de verde para receitas
      const greenTones = ['#10b981', '#059669', '#34d399', '#6ee7b7', '#16a34a', '#15803d', '#86efac'];
      
      data.incomeCategories.forEach((cat, idx) => {
        chartLabels.push(cat.label);
        chartValues.push(cat.totalYear);
        chartColors.push(greenTones[idx % greenTones.length]);
      });

      if (chartLabels.length === 0) {
        chartLabels = ['Sem receitas'];
        chartValues = [0];
        chartColors = ['#10b981'];
      }

    } else if (planningCompositionView.startsWith('macro-')) {
      // Drilldown em uma macrocategoria específica de despesa
      isDrilldown = true;
      const macroKey = planningCompositionView.replace('macro-', '');
      const macroObj = data.expenseMacros.find(m => m.key === macroKey || m.label === macroKey);
      const macroTitle = macroObj ? macroObj.label : macroKey;

      $('#planning-bar-chart-title').html(`<i class="fa-solid fa-arrow-trend-down text-red-600 text-sm"></i><span>Detalhamento: ${macroTitle}</span>`);
      $('#planning-bar-chart-subtitle').text(`Categorias que compõem ${macroTitle}`);
      $('#btn-reset-planning-bar-chart').removeClass('hidden');

      const redTones = ['#dc2626', '#b91c1c', '#ef4444', '#f87171', '#fca5a5', '#991b1b'];

      if (macroObj && macroObj.subcategories.length > 0) {
        macroObj.subcategories.forEach((subcat, idx) => {
          chartLabels.push(subcat.label);
          chartValues.push(subcat.totalYear);
          chartColors.push(redTones[idx % redTones.length]);
        });
      } else {
        chartLabels = ['Sem despesas'];
        chartValues = [0];
        chartColors = ['#ef4444'];
      }
    }

    // Calcula total para porcentagens
    const chartTotal = chartValues.reduce((a, b) => a + b, 0);

    planningCompositionChartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: chartLabels,
        datasets: [{
          data: chartValues,
          backgroundColor: chartColors,
          borderRadius: 6,
          borderWidth: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        onClick: function(evt, elements) {
          if (!elements.length) return;
          const clickedIndex = elements[0].index;
          
          if (planningCompositionView === 'macro') {
            if (clickedIndex === 0) {
              // Clicou em "Receitas" -> drilldown para componentes de receita em verde!
              planningCompositionView = 'income';
              renderPlanningCompositionChart(data);
            } else {
              // Clicou em uma das macrocategorias de despesa
              const macroClicked = data.expenseMacros[clickedIndex - 1];
              if (macroClicked) {
                planningCompositionView = 'macro-' + macroClicked.key;
                renderPlanningCompositionChart(data);
              }
            }
          }
        },
        plugins: {
          legend: { display: false },
          datalabels: {
            display: true,
            anchor: 'end',
            align: 'top',
            offset: 4,
            font: { family: 'Inter, sans-serif', weight: 'bold', size: 10 },
            color: '#374151',
            formatter: function(val) {
              if (val === 0 || chartTotal === 0) return '';
              const pct = ((val / chartTotal) * 100).toFixed(0);
              return `${pct}%`;
            }
          },
          tooltip: {
            backgroundColor: 'rgba(17, 24, 39, 0.95)',
            padding: 12,
            cornerRadius: 8,
            titleFont: { family: 'Inter, sans-serif', size: 13, weight: 'bold' },
            bodyFont: { family: 'Inter, sans-serif', size: 12 },
            callbacks: {
              label: function(context) {
                const val = context.raw || 0;
                const pct = chartTotal > 0 ? ((val / chartTotal) * 100).toFixed(1) : '0';
                return `${formatCurrency(val)} (${pct}% do grupo)`;
              },
              afterLabel: function(context) {
                if (planningCompositionView === 'macro') {
                  return '👉 Clique na barra para ver detalhes';
                }
                return '';
              }
            }
          }
        },
        scales: {
          x: {
            grid: { display: false },
            ticks: {
              font: { family: 'Inter, sans-serif', weight: '500', size: 11 },
              color: '#374151',
              callback: function(val, index) {
                const label = chartLabels[index] || '';
                return label.length > 14 ? label.slice(0, 12) + '...' : label;
              }
            }
          },
          y: {
            grid: { color: '#f3f4f6' },
            ticks: {
              font: { family: 'Inter, sans-serif', size: 10 },
              color: '#9ca3af',
              callback: function(val) {
                if (val >= 1000) return 'R$ ' + (val / 1000).toFixed(0) + 'k';
                return 'R$ ' + val;
              }
            }
          }
        }
      }
    });
  }

  function showPlanningTransactionsModal(categoryName, monthNum, tipoFilter) {
    if (!currentPlanningData) return;

    const meta = currentPlanningData.monthsMeta[monthNum - 1];
    const monthName = meta ? meta.name : `Mês ${monthNum}`;
    const year = currentPlanningData.year;

    let displayCatName = categoryName;
    if (categoryName === '__ALL_INCOME__') displayCatName = 'Todas as Receitas';
    if (categoryName === '__ALL_EXPENSE__') displayCatName = 'Todas as Despesas';

    $('#modal-planning-tx-title').text(`${displayCatName} - ${monthName}/${year}`);
    $('#modal-planning-tx-subtitle').text(`Status do Mês: ${meta ? (meta.status === 'realized' ? 'Realizado' : (meta.status === 'current' ? 'Mês Atual' : 'Previsto')) : ''}`);

    // Filtra as transações correspondentes a este mês e categoria
    const matchingTxs = [];
    const txSource = (typeof currentLoadedTransactions !== 'undefined' && currentLoadedTransactions.length > 0)
      ? currentLoadedTransactions
      : (typeof applyCategoryOverrides === 'function' ? applyCategoryOverrides(GLOBAL_MOCK_TRANSACTIONS || []) : (GLOBAL_MOCK_TRANSACTIONS || []));

    const currentSystemDay = currentPlanningData.currentSystemDay;
    const currentSystemMonth = currentPlanningData.currentSystemMonth;
    const currentSystemYear = currentPlanningData.currentSystemYear;

    txSource.forEach(t => {
      if (!t.data) return;
      const parts = String(t.data).split('-');
      const y = parseInt(parts[0], 10);
      const m = parseInt(parts[1], 10);
      const d = parts[2] ? parseInt(parts[2], 10) : 1;

      if (y === year && m === monthNum) {
        let matchCat = false;
        if (categoryName === '__ALL_INCOME__') {
          matchCat = (t.tipo === 'Entrada');
        } else if (categoryName === '__ALL_EXPENSE__') {
          matchCat = (t.tipo === 'Saída');
        } else {
          matchCat = (t.categoria === categoryName);
          if (tipoFilter) matchCat = matchCat && (t.tipo === tipoFilter);
        }

        if (matchCat) {
          let isRealized = true;
          if (meta.status === 'realized') {
            isRealized = true;
          } else if (meta.status === 'planned') {
            isRealized = false;
          } else {
            isRealized = (d <= currentSystemDay);
          }

          matchingTxs.push({
            origem: t.origem || 'Conta',
            descricao: t.descricao || '',
            categoria: t.categoria || 'Outros',
            tipo: t.tipo || 'Saída',
            valor: parseFloat(t.valor) || 0,
            data: t.data,
            isRealized: isRealized
          });
        }
      }
    });

    // Ordena por data decrescente
    matchingTxs.sort((a, b) => String(b.data).localeCompare(String(a.data)));

    let realizedSum = 0;
    let plannedSum = 0;
    matchingTxs.forEach(t => {
      if (t.isRealized) realizedSum += t.valor;
      else plannedSum += t.valor;
    });

    $('#modal-planning-tx-realized').text(formatCurrency(realizedSum));
    $('#modal-planning-tx-planned').text(formatCurrency(plannedSum));
    $('#modal-planning-tx-total').text(formatCurrency(realizedSum + plannedSum));

    const $tbody = $('#modal-planning-tx-body');
    $tbody.empty();

    if (matchingTxs.length === 0) {
      $tbody.html(`
        <tr>
          <td colspan="6" class="p-8 text-center text-gray-400 dark:text-slate-500 italic">
            Nenhuma transação lançada para ${displayCatName} em ${monthName}/${year}.
          </td>
        </tr>
      `);
    } else {
      matchingTxs.forEach(tx => {
        const isEntrada = tx.tipo === 'Entrada';
        const valColor = isEntrada ? 'text-emerald-600 font-bold' : 'text-gray-900 dark:text-white font-bold';
        const prefix = isEntrada ? '+ ' : '- ';
        const statusBadge = tx.isRealized
          ? '<span class="bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded-full text-[10px] font-semibold">Realizado</span>'
          : '<span class="bg-purple-50 dark:bg-purple-900/30 text-purple-700 dark:text-purple-300 border border-purple-200 dark:border-purple-800 px-2 py-0.5 rounded-full text-[10px] font-semibold">Previsto</span>';

        $tbody.append(`
          <tr class="hover:bg-gray-50 dark:hover:!bg-slate-700 transition-colors">
            <td class="p-3 text-gray-500 dark:text-slate-500 whitespace-nowrap">${tx.data}</td>
            <td class="p-3 font-medium text-gray-800 dark:text-white">${tx.descricao}</td>
            <td class="p-3 text-gray-600 dark:text-slate-400">${tx.categoria}</td>
            <td class="p-3 text-gray-500 dark:text-slate-500">${tx.tipo}</td>
            <td class="p-3 text-center">${statusBadge}</td>
            <td class="p-3 text-right ${valColor} whitespace-nowrap">${prefix}${formatCurrency(tx.valor)}</td>
          </tr>
        `);
      });
    }

    $('#modal-planning-transactions').removeClass('hidden');
  }

  let planningActiveRange = null; 
  // Estrutura:
  // {
  //   rowElement: tr,
  //   cat: string,
  //   tipo: string,
  //   catLabel: string,
  //   startMonth: number,
  //   endMonth: number | null
  // }

  const MONTH_SHORT_NAMES = ['', 'Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
  const MONTH_FULL_NAMES = ['', 'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

  function getDisplayCategoryName(cat) {
    if (!cat) return '';
    if (cat === '__ALL_INCOME__') return 'Receitas (Total)';
    if (cat === '__ALL_EXPENSE__') return 'Despesas (Total)';
    if (cat.startsWith('__MACRO_')) {
      const key = cat.replace('__MACRO_', '');
      if (key === 'Fixas') return 'Despesas Fixas';
      if (key === 'Variáveis Essenciais') return 'Despesas Variáveis Essenciais';
      if (key === 'Discricionárias') return 'Despesas Discricionárias';
      return key;
    }
    return cat;
  }

  function handlePlanningCellClick(cellElement, cat, month, type) {
    const $cell = $(cellElement);
    const $row = $cell.closest('tr');

    // 1. Se não houver seleção ativa, inicia a seleção no 1º mês
    if (!planningActiveRange) {
      planningActiveRange = {
        rowElement: $row[0],
        cat: cat,
        tipo: type || 'Saída',
        catLabel: getDisplayCategoryName(cat),
        startMonth: month,
        endMonth: null
      };

      // Adiciona estilo visual de início de seleção
      $row.addClass('planning-row-active-range');
      $cell.addClass('planning-cell-selected-endpoint');

      // Feedback sutil para o usuário saber que o primeiro mês foi marcado
      showPlanningSelectionHint(`Mês de ${MONTH_FULL_NAMES[month]} selecionado. Clique em outro mês desta mesma linha para formar o período.`);
      return;
    }

    // 2. Se o usuário clicou em uma linha ou categoria diferente, reinicia a seleção na nova linha
    if (planningActiveRange.rowElement !== $row[0] || planningActiveRange.cat !== cat) {
      clearPlanningRangeSelection();
      handlePlanningCellClick(cellElement, cat, month, type);
      return;
    }

    // 3. Se clicou no mesmo mês em que já havia iniciado (sem ter fechado o range)
    if (planningActiveRange.startMonth === month && planningActiveRange.endMonth === null) {
      // Clicou novamente na mesma célula: abre o modal de visualização normal de transações deste mês
      clearPlanningRangeSelection();
      showPlanningTransactionsModal(cat, month, type);
      return;
    }

    // 4. Fechou o período (2º clique na mesma linha)!
    planningActiveRange.endMonth = month;
    applyPlanningRangeHighlight();
    showPlanningRangeActionBar();
  }

  function applyPlanningRangeHighlight() {
    if (!planningActiveRange || !planningActiveRange.rowElement || !planningActiveRange.startMonth || !planningActiveRange.endMonth) return;

    const $row = $(planningActiveRange.rowElement);
    const minM = Math.min(planningActiveRange.startMonth, planningActiveRange.endMonth);
    const maxM = Math.max(planningActiveRange.startMonth, planningActiveRange.endMonth);

    // Limpa classes anteriores na linha
    $row.find('.planning-cell-action').removeClass('planning-cell-selected-endpoint planning-cell-selected-range');

    $row.find('.planning-cell-action').each(function() {
      const m = parseInt($(this).data('month'), 10);
      if (m === minM || m === maxM) {
        $(this).addClass('planning-cell-selected-endpoint');
      } else if (m > minM && m < maxM) {
        $(this).addClass('planning-cell-selected-range');
      }
    });

    $row.addClass('planning-row-active-range');
  }

  function showPlanningRangeActionBar() {
    if (!planningActiveRange) return;

    const minM = Math.min(planningActiveRange.startMonth, planningActiveRange.endMonth);
    const maxM = Math.max(planningActiveRange.startMonth, planningActiveRange.endMonth);
    const count = (maxM - minM) + 1;

    const catName = planningActiveRange.catLabel;
    const periodText = (minM === maxM)
      ? `${MONTH_SHORT_NAMES[minM]}`
      : `${MONTH_SHORT_NAMES[minM]} a ${MONTH_SHORT_NAMES[maxM]}`;

    $('#planning-range-category-name').text(catName);
    $('#planning-range-months-badge').text(periodText);
    $('#planning-range-count-badge').text(`(${count} ${count === 1 ? 'mês' : 'meses'} selecionados)`);
    $('#planning-range-action-desc').html(
      `Linha <strong class="text-gray-800 dark:text-white font-semibold">${catName}</strong> selecionada de <strong class="text-primary dark:text-blue-400 font-semibold">${MONTH_FULL_NAMES[minM]}</strong> até <strong class="text-primary dark:text-blue-400 font-semibold">${MONTH_FULL_NAMES[maxM]}</strong>.`
    );

    const $bar = $('#planning-range-action-bar');
    $bar.removeClass('hidden');

    // Rola suavemente para a barra de ação se não estiver visível
    const barTop = $bar.offset().top;
    if (window.scrollY > barTop) {
      $('html, body').animate({ scrollTop: barTop - 80 }, 200);
    }
  }

  function clearPlanningRangeSelection() {
    if (planningActiveRange && planningActiveRange.rowElement) {
      const $row = $(planningActiveRange.rowElement);
      $row.removeClass('planning-row-active-range');
      $row.find('.planning-cell-action').removeClass('planning-cell-selected-endpoint planning-cell-selected-range');
    }
    planningActiveRange = null;
    $('#planning-range-action-bar').addClass('hidden');
  }

  function showPlanningSelectionHint(message) {
    // Exibe banner ou tooltip informativo temporário
    const $bar = $('#planning-range-action-bar');
    $('#planning-range-category-name').text(planningActiveRange.catLabel);
    $('#planning-range-months-badge').text(MONTH_SHORT_NAMES[planningActiveRange.startMonth]);
    $('#planning-range-count-badge').text('(1º mês marcado)');
    $('#planning-range-action-desc').text(message);
    $bar.removeClass('hidden');
  }

  // ==========================================
  // AÇÃO 1: ADICIONAR LANÇAMENTO EM GRUPO
  // ==========================================
  function openPlanningRangeAddModal() {
    if (!planningActiveRange) return;

    const minM = Math.min(planningActiveRange.startMonth, planningActiveRange.endMonth || planningActiveRange.startMonth);
    const maxM = Math.max(planningActiveRange.startMonth, planningActiveRange.endMonth || planningActiveRange.startMonth);
    const count = (maxM - minM) + 1;

    const catName = planningActiveRange.catLabel;
    const periodText = (minM === maxM)
      ? `${MONTH_SHORT_NAMES[minM]}`
      : `${MONTH_SHORT_NAMES[minM]} a ${MONTH_SHORT_NAMES[maxM]}`;

    $('#modal-range-add-cat-label').text(catName);
    $('#modal-range-add-months-label').text(`${periodText} (${count} ${count === 1 ? 'mês' : 'meses'})`);
    $('#modal-range-add-subtitle').text(`Adicione o mesmo lançamento em todos os ${count} meses selecionados.`);

    // Sugestão de descrição baseada na categoria
    let defaultDesc = '';
    if (catName.toLowerCase().includes('moradia')) defaultDesc = 'Aluguel / Condomínio';
    else if (catName.toLowerCase().includes('fixas')) defaultDesc = 'Conta de Telefone / Internet';
    else if (catName.toLowerCase().includes('saúde') || catName.toLowerCase().includes('saude')) defaultDesc = 'Plano de Saúde';
    else if (catName.toLowerCase().includes('educação')) defaultDesc = 'Mensalidade Escolar';
    else if (catName.toLowerCase().includes('receita')) defaultDesc = 'Prestação de Serviço';
    $('#modal-range-add-desc').val(defaultDesc).focus();
    $('#modal-range-add-val').val('');

    $('#modal-planning-range-add').removeClass('hidden');
  }

  function submitPlanningRangeAdd() {
    if (!planningActiveRange) return;

    const minM = Math.min(planningActiveRange.startMonth, planningActiveRange.endMonth || planningActiveRange.startMonth);
    const maxM = Math.max(planningActiveRange.startMonth, planningActiveRange.endMonth || planningActiveRange.startMonth);
    const year = currentPlanningData ? currentPlanningData.year : currentPlanningYear;

    const desc = $('#modal-range-add-desc').val().trim();
    const val = parseFloat($('#modal-range-add-val').val());
    const day = parseInt($('#modal-range-add-day').val(), 10) || 10;
    const origem = $('#modal-range-add-origem').val().trim() || 'Conta Corrente';

    if (!desc) {
      alert('Informe a descrição do lançamento.');
      return;
    }
    if (isNaN(val) || val <= 0) {
      alert('Informe um valor válido.');
      return;
    }

    // Determina tipo e categoria real
    let realCat = planningActiveRange.cat;
    let tipo = planningActiveRange.tipo || 'Saída';

    if (realCat === '__ALL_INCOME__') {
      realCat = 'Salário';
      tipo = 'Entrada';
    } else if (realCat === '__ALL_EXPENSE__') {
      realCat = 'Outros';
      tipo = 'Saída';
    } else if (realCat.startsWith('__MACRO_')) {
      const macroKey = realCat.replace('__MACRO_', '');
      if (macroKey === 'Fixas') realCat = 'Moradia';
      else if (macroKey === 'Variáveis Essenciais') realCat = 'Alimentação';
      else realCat = 'Lazer';
      tipo = 'Saída';
    }

    // Gera o lote de lançamentos para cada mês do intervalo
    const batchItems = [];
    for (let m = minM; m <= maxM; m++) {
      const maxDaysInMonth = new Date(year, m, 0).getDate();
      const safeDay = Math.min(day, maxDaysInMonth);
      const mStr = String(m).padStart(2, '0');
      const dStr = String(safeDay).padStart(2, '0');
      batchItems.push({
        origem: origem,
        descricao: desc,
        categoria: realCat,
        tipo: tipo,
        valor: val,
        data: `${year}-${mStr}-${dStr}`
      });
    }

    const $btn = $('#btn-submit-range-add');
    const origHtml = $btn.html();
    $btn.prop('disabled', true).html('<i class="fa-solid fa-spinner fa-spin"></i> Gravando...');

    function onAddSuccess() {
      $btn.prop('disabled', false).html(origHtml);
      $('#modal-planning-range-add').addClass('hidden');
      clearPlanningRangeSelection();

      // Recarrega todos os dados
      if (typeof loadTransactions === 'function') loadTransactions();
      if (typeof loadDashboard === 'function') loadDashboard();
      if (typeof loadPlanning === 'function') loadPlanning();
    }

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(onAddSuccess)
        .withFailureHandler(function(err) {
          alert('Erro ao gravar lançamentos: ' + (err.message || err));
          $btn.prop('disabled', false).html(origHtml);
        })
        .saveBatchTransactions(batchItems);
    } else {
      // Ambiente Local AI Studio
      setTimeout(() => {
        if (typeof GLOBAL_MOCK_TRANSACTIONS !== 'undefined') {
          GLOBAL_MOCK_BACKUP = JSON.stringify(GLOBAL_MOCK_TRANSACTIONS);
          batchItems.forEach(item => GLOBAL_MOCK_TRANSACTIONS.push(item));
        }
        onAddSuccess();
      }, 500);
    }
  }

  // ==========================================
  // AÇÃO 2: EXCLUIR LANÇAMENTOS DO PERÍODO EM GRUPO
  // ==========================================
  let currentRangeDeleteCandidates = [];

  function openPlanningRangeDeleteModal() {
    if (!planningActiveRange) return;

    const minM = Math.min(planningActiveRange.startMonth, planningActiveRange.endMonth || planningActiveRange.startMonth);
    const maxM = Math.max(planningActiveRange.startMonth, planningActiveRange.endMonth || planningActiveRange.startMonth);
    const count = (maxM - minM) + 1;
    const year = currentPlanningData ? currentPlanningData.year : currentPlanningYear;

    const catName = planningActiveRange.catLabel;
    const periodText = (minM === maxM)
      ? `${MONTH_SHORT_NAMES[minM]}`
      : `${MONTH_SHORT_NAMES[minM]} a ${MONTH_SHORT_NAMES[maxM]}`;

    $('#modal-range-delete-cat-label').text(catName);
    $('#modal-range-delete-months-label').text(`${periodText}/${year} (${count} ${count === 1 ? 'mês' : 'meses'})`);
    $('#modal-range-delete-subtitle').text(`Exclusão de transações na linha "${catName}" de ${MONTH_FULL_NAMES[minM]} a ${MONTH_FULL_NAMES[maxM]}.`);

    // Busca as transações existentes no período nesta categoria
    const targetCat = planningActiveRange.cat;
    const targetTipo = planningActiveRange.tipo;
    const txSource = (typeof currentLoadedTransactions !== 'undefined' && currentLoadedTransactions.length > 0)
      ? currentLoadedTransactions
      : (typeof applyCategoryOverrides === 'function' ? applyCategoryOverrides(GLOBAL_MOCK_TRANSACTIONS || []) : (GLOBAL_MOCK_TRANSACTIONS || []));

    currentRangeDeleteCandidates = [];

    txSource.forEach((t, idx) => {
      if (!t.data) return;
      const parts = String(t.data).split('-');
      const y = parseInt(parts[0], 10);
      const m = parseInt(parts[1], 10);

      if (y === year && m >= minM && m <= maxM) {
        let match = false;
        if (targetCat === '__ALL_INCOME__') {
          match = (t.tipo === 'Entrada');
        } else if (targetCat === '__ALL_EXPENSE__') {
          match = (t.tipo === 'Saída');
        } else if (targetCat.startsWith('__MACRO_')) {
          const macroKey = targetCat.replace('__MACRO_', '');
          const macroOfItem = (typeof getMacroCategory === 'function')
            ? getMacroCategory(t.categoria, t.descricao)
            : macroKey;
          match = (macroOfItem === macroKey && (!targetTipo || t.tipo === targetTipo));
        } else {
          match = (t.categoria === targetCat && (!targetTipo || t.tipo === targetTipo));
        }

        if (match) {
          currentRangeDeleteCandidates.push({
            id: t.id !== undefined ? t.id : `tx_${idx}_${t.data}_${t.valor}`,
            index: idx,
            data: t.data,
            descricao: t.descricao || 'Sem descrição',
            categoria: t.categoria || 'Outros',
            tipo: t.tipo || 'Saída',
            valor: parseFloat(t.valor) || 0
          });
        }
      }
    });

    // Renderiza a lista de itens a serem excluídos
    const $list = $('#range-delete-tx-list');
    $list.empty();

    if (currentRangeDeleteCandidates.length === 0) {
      $list.html(`
        <div class="p-6 text-center text-gray-400 dark:text-slate-500 italic">
          Nenhum lançamento encontrado nesta linha para o período ${periodText}/${year}.
        </div>
      `);
      $('#check-delete-all-range').prop('disabled', true).prop('checked', false);
      $('#range-delete-items-count').text('0');
      $('#range-delete-total-value').text('Total: R$ 0,00');
      $('#btn-confirm-range-delete').prop('disabled', true).addClass('opacity-50 cursor-not-allowed');
    } else {
      $('#check-delete-all-range').prop('disabled', false).prop('checked', true);
      $('#btn-confirm-range-delete').prop('disabled', false).removeClass('opacity-50 cursor-not-allowed');

      currentRangeDeleteCandidates.forEach((item, i) => {
        const valFormatted = formatCurrency(item.valor);
        const isEntrada = item.tipo === 'Entrada';
        const colorClass = isEntrada ? 'text-emerald-600' : 'text-gray-900 dark:text-white';

        $list.append(`
          <div class="p-2.5 flex items-center justify-between hover:bg-gray-50 dark:hover:!bg-slate-700 transition-colors">
            <label class="flex items-center gap-2.5 cursor-pointer flex-1 min-w-0 mr-3">
              <input type="checkbox" class="check-delete-range-item rounded text-rose-600 focus:ring-rose-500" value="${i}" checked>
              <div class="truncate">
                <span class="font-medium text-gray-800 dark:text-white text-xs">${item.descricao}</span>
                <span class="text-[10px] text-gray-400 dark:text-slate-500 block">${item.data} • ${item.categoria}</span>
              </div>
            </label>
            <span class="font-semibold text-xs whitespace-nowrap ${colorClass}">${valFormatted}</span>
          </div>
        `);
      });

      updateRangeDeleteSummary();
    }

    $('#modal-planning-range-delete').removeClass('hidden');
  }

  function updateRangeDeleteSummary() {
    const checkedBoxes = $('.check-delete-range-item:checked');
    let totalVal = 0;

    checkedBoxes.each(function() {
      const idx = parseInt($(this).val(), 10);
      const item = currentRangeDeleteCandidates[idx];
      if (item) totalVal += item.valor;
    });

    $('#range-delete-items-count').text(checkedBoxes.length);
    $('#range-delete-total-value').text(`Total: ${formatCurrency(totalVal)}`);

    if (checkedBoxes.length === 0) {
      $('#btn-confirm-range-delete').prop('disabled', true).addClass('opacity-50 cursor-not-allowed');
    } else {
      $('#btn-confirm-range-delete').prop('disabled', false).removeClass('opacity-50 cursor-not-allowed');
    }
  }

  function submitPlanningRangeDelete() {
    if (!planningActiveRange) return;

    const checkedBoxes = $('.check-delete-range-item:checked');
    if (checkedBoxes.length === 0) {
      alert('Nenhum lançamento selecionado para exclusão.');
      return;
    }

    const itemsToDelete = [];
    checkedBoxes.each(function() {
      const idx = parseInt($(this).val(), 10);
      const item = currentRangeDeleteCandidates[idx];
      if (item) itemsToDelete.push(item);
    });

    if (!confirm(`Tem certeza que deseja excluir os ${itemsToDelete.length} lançamentos selecionados do período?`)) {
      return;
    }

    const $btn = $('#btn-confirm-range-delete');
    const origHtml = $btn.html();
    $btn.prop('disabled', true).html('<i class="fa-solid fa-spinner fa-spin"></i> Excluindo...');

    function onDeleteSuccess() {
      $btn.prop('disabled', false).html(origHtml);
      $('#modal-planning-range-delete').addClass('hidden');
      clearPlanningRangeSelection();

      // Recarrega todos os dados
      if (typeof loadTransactions === 'function') loadTransactions();
      if (typeof loadDashboard === 'function') loadDashboard();
      if (typeof loadPlanning === 'function') loadPlanning();
    }

    const minM = Math.min(planningActiveRange.startMonth, planningActiveRange.endMonth || planningActiveRange.startMonth);
    const maxM = Math.max(planningActiveRange.startMonth, planningActiveRange.endMonth || planningActiveRange.startMonth);
    const year = currentPlanningData ? currentPlanningData.year : currentPlanningYear;

    // Se todos foram selecionados, chama a função otimizada de deletar o período e categoria
    const isAllChecked = (checkedBoxes.length === currentRangeDeleteCandidates.length);

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      if (isAllChecked) {
        google.script.run
          .withSuccessHandler(onDeleteSuccess)
          .withFailureHandler(function(err) {
            alert('Erro ao excluir: ' + (err.message || err));
            $btn.prop('disabled', false).html(origHtml);
          })
          .deleteTransactionsRange(year, minM, maxM, planningActiveRange.cat, planningActiveRange.tipo);
      } else {
        // Exclusão granular por row indices / filtro de transações
        // Registra ids ou remove itens
        itemsToDelete.forEach(it => {
          if (typeof DELETED_OVERRIDES !== 'undefined') {
            DELETED_OVERRIDES.add(it.id);
          }
        });
        if (typeof saveDeletedOverridesToStorage === 'function') {
          saveDeletedOverridesToStorage();
        }
        onDeleteSuccess();
      }
    } else {
      // Mock Local AI Studio: remove de GLOBAL_MOCK_TRANSACTIONS
      setTimeout(() => {
        if (typeof GLOBAL_MOCK_TRANSACTIONS !== 'undefined') {
          itemsToDelete.forEach(it => {
            const fIdx = GLOBAL_MOCK_TRANSACTIONS.findIndex(t => 
              t.data === it.data && t.descricao === it.descricao && Math.abs(parseFloat(t.valor) - it.valor) < 0.01
            );
            if (fIdx !== -1) {
              GLOBAL_MOCK_TRANSACTIONS.splice(fIdx, 1);
            }
          });
        }
        onDeleteSuccess();
      }, 500);
    }
  }

  // Dark Mode Logic
  $(function() {
    const themeToggleBtn = $('#theme-toggle');
    const themeToggleIcon = $('#theme-toggle-icon');
    const themeToggleText = $('#theme-toggle-text');
    const themeToggleThumb = $('#theme-toggle-thumb');
    
    // Check local storage or system preference
    if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        $('html').addClass('dark');
        updateToggleUI(true);
    } else {
        $('html').removeClass('dark');
        updateToggleUI(false);
    }

    themeToggleBtn.on('click', function() {
        if ($('html').hasClass('dark')) {
            $('html').removeClass('dark');
            localStorage.setItem('color-theme', 'light');
            updateToggleUI(false);
        } else {
            $('html').addClass('dark');
            localStorage.setItem('color-theme', 'dark');
            updateToggleUI(true);
        }
    });

    function updateToggleUI(isDark) {
        if (isDark) {
            themeToggleIcon.removeClass('fa-moon').addClass('fa-sun text-primary');
            themeToggleText.text('Modo Escuro');
            themeToggleThumb.css('transform', 'translateX(100%)');
            themeToggleThumb.addClass('bg-primary').removeClass('bg-gray-400');
        } else {
            themeToggleIcon.removeClass('fa-sun text-primary').addClass('fa-moon');
            themeToggleText.text('Modo Claro');
            themeToggleThumb.css('transform', 'translateX(0)');
            themeToggleThumb.removeClass('bg-primary').addClass('bg-gray-400');
        }
    }
  });

</script>
