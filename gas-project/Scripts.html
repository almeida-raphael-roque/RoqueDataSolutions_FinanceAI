  // Global Macro Category function
  function getMacroCategory(cat, desc) {
    cat = (cat || '').toLowerCase();
    desc = (desc || '').toLowerCase();
    
    if (cat.includes('moradia') || desc.includes('aluguel') || desc.includes('internet') || desc.includes('condomínio') || cat.includes('educação') || cat.includes('telefone') || cat.includes('celular') || desc.includes('vivo') || desc.includes('claro') || desc.includes('tim')) return 'Fixas';
    
    if (desc.includes('energia') || desc.includes('água') || desc.includes('gás') || desc.includes('luz') || cat.includes('saúde') || desc.includes('mercado') || desc.includes('supermercado') || desc.includes('farmácia') || cat.includes('transporte')) return 'Variáveis Essenciais';
    
    if (cat.includes('lazer') || desc.includes('restaurante') || desc.includes('delivery') || desc.includes('compras') || desc.includes('passeio') || desc.includes('cinema') || desc.includes('netflix') || desc.includes('uber') || cat.includes('alimentação')) {
      if (desc.includes('mercado') || desc.includes('supermercado')) return 'Variáveis Essenciais';
      return 'Discricionárias';
    }
    
    return 'Fixas'; // Default for unrecognized categories dynamically added like in planning
  }

  // Intelligent Normalization and Matching Functions
  function normalizeDescription(desc) {
    if (!desc) return "";
    let d = String(desc).toUpperCase();
    // Remove dates and times
    d = d.replace(/\b\d{1,2}[A-Z]{3}\b/g, ''); // 20Abr
    d = d.replace(/\b\d{2}H\d{2}MIN\b/g, ''); // 16h24min
    d = d.replace(/\b\d{2}\/\d{2}\/\d{4}\b/g, ''); // 10/10/2026
    // Remove common transaction prefixes
    d = d.replace(/^PAG\*\s*/, '');
    d = d.replace(/^COMPRA\s*/, '');
    d = d.replace(/^PIX\s*(ENVIADO|RECEBIDO)?\s*/, '');
    d = d.replace(/^DOC\s*/, '');
    d = d.replace(/^TED\s*/, '');
    // Remove common noise
    d = d.replace(/ PIX /g, ' ');
    d = d.replace(/ ENVIADO PARA /g, ' ');
    d = d.replace(/ RECEBIDO DE /g, ' ');
    d = d.replace(/ COMPRA APROVADA /g, ' ');
    d = d.replace(/\bLTDA\b/g, '');
    d = d.replace(/\bS\.A\.\b/g, '');
    d = d.replace(/\bS\/A\b/g, '');
    d = d.replace(/\bSAO PAULO\b/g, '');
    d = d.replace(/\bSP\b/g, ' ');
    d = d.replace(/\bGOIANIA\b/g, '');
    d = d.replace(/\bBRASILIA\b/g, '');
    d = d.replace(/\bBRA\b/g, '');
    // Remove special characters and collapse whitespaces
    d = d.replace(/[^A-Z0-9 ]/g, ' ');
    d = d.replace(/\s+/g, ' ').trim();
    return d;
  }

  function applyCategoryOverrides(rows) {
    if (!rows || !Array.isArray(rows)) return [];
    return rows.filter(r => {
      const rawDesc = String(r.descricao || '').trim().toUpperCase();
      const txKey = `${r.data}_${r.valor}_${rawDesc}`;
      if (DELETED_OVERRIDES.has(txKey) || (r.rowIndex && DELETED_OVERRIDES.has(`row_${r.rowIndex}`))) {
        return false;
      }
      return true;
    }).map(r => {
      const rawDesc = String(r.descricao || '').trim().toUpperCase();
      const normDesc = normalizeDescription(r.descricao).toUpperCase();
      
      // Check user category overrides first (exact raw description or normalized description)
      if (CATEGORY_OVERRIDES[rawDesc]) {
        r.categoria = CATEGORY_OVERRIDES[rawDesc];
      } else if (CATEGORY_OVERRIDES[normDesc]) {
        r.categoria = CATEGORY_OVERRIDES[normDesc];
      } else if (GLOBAL_RULES && Array.isArray(GLOBAL_RULES)) {
        const matchedRule = GLOBAL_RULES.find(rule => {
          const p = (rule.pattern || '').trim().toUpperCase();
          return p && (rawDesc.includes(p) || normDesc.includes(p));
        });
        if (matchedRule) {
          const catObj = GLOBAL_CATEGORIES.find(c => c.id == matchedRule.categoryId);
          if (catObj) r.categoria = catObj.name;
        }
      }
      return r;
    });
  }

  function getIntelligentSystemMatch(rawDesc, normDesc) {
    const text = (String(rawDesc || '') + ' ' + String(normDesc || '')).toUpperCase();
    
    const systemRules = [
      // Delivery e Restaurantes
      { patterns: ['IFD', 'IFOOD', 'I-FOOD', 'IFOOD.COM', 'RAPPI', 'AIQFOME', 'ZE DELIVERY', 'ZÉ DELIVERY'], clean: 'iFood / Delivery', cat: 'Alimentação' },
      { patterns: ['MCDONALD', 'MC DONALD', 'ARCOS DOURADOS', 'BURGER KING', 'BK BRASIL', 'OUTBACK', 'SUBWAY', 'GIRAFFAS', 'HABIB', 'MADERO', 'RESTAURANTE', 'PIZZARIA', 'HAMBURGUER', 'LANCHONETE', 'CHURRASCARIA'], clean: 'Restaurante', cat: 'Alimentação' },
      { patterns: ['PADARIA', 'PANIFICADORA', 'CONFEITARIA', 'CAFETERIA', 'STARBUCKS', 'CAFE '], clean: 'Padaria / Café', cat: 'Alimentação' },
      
      // Supermercados e Alimentos
      { patterns: ['ASSAI', 'ASSAI ATACADISTA', 'ATACADAO', 'ATACADÃO', 'BIG BOX', 'CARREFOUR', 'PÃO DE AÇÚCAR', 'PAO DE ACUCAR', 'EXTRA', 'SUPERMERCADO', 'HIPERMERCADO', 'MERCADO', 'HORTIFRUTI', 'VERDURAO', 'SACOLAO', 'DONA DE CASA', 'DONA '], clean: 'Supermercado', cat: 'Supermercado' },
      
      // Transporte
      { patterns: ['UBER', 'UBERBR', 'UBERTRIP'], clean: 'Uber', cat: 'Transporte' },
      { patterns: ['99 POP', '99APP', '99TAXI', '99 PAY', 'DL 99', '99 '], clean: '99 App', cat: 'Transporte' },
      { patterns: ['POSTO', 'AUTO POSTO', 'IPIRANGA', 'SHELL', 'PETROBRAS', 'BR MANIA', 'ALE COMBUSTIVEIS', 'GASOLINA', 'COMBUSTIVEL'], clean: 'Posto de Gasolina', cat: 'Transporte' },
      { patterns: ['AUTOPASS', 'TOP', 'BILHETE UNICO', 'METRO', 'CPTM', 'PEDAGIO', 'SEM PARAR', 'VELOE', 'CONECTCAR'], clean: 'Transporte Público / Pedágio', cat: 'Transporte' },
      
      // Farmácia e Saúde
      { patterns: ['DROGASIL', 'RAIA', 'DROGARIA', 'FARMACIA', 'FARMÁCIA', 'PACHECO', 'PAGUE MENOS', 'PANVEL', 'DROGAVEN', 'DROGAFARMA'], clean: 'Farmácia', cat: 'Saúde' },
      { patterns: ['SMART FIT', 'SMARTFIT', 'ACADEMIA', 'BLUEFIT', 'BIO RITMO', 'CROSSFIT', 'LABORATORIO', 'HOSPITAL', 'CLINICA', 'CONSULTORIO', 'ODONTO'], clean: 'Saúde / Academia', cat: 'Saúde' },
      
      // Lazer & Assinaturas
      { patterns: ['NETFLIX'], clean: 'Netflix', cat: 'Lazer' },
      { patterns: ['SPOTIFY'], clean: 'Spotify', cat: 'Lazer' },
      { patterns: ['CINEMARK', 'KINOPLEX', 'CINEMA', 'INGRESSO.COM'], clean: 'Cinema', cat: 'Lazer' },
      { patterns: ['DISNEY', 'HBO', 'MAX', 'PRIME VIDEO', 'STEAM', 'PLAYSTATION', 'NINTENDO', 'XBOX'], clean: 'Streaming / Jogos', cat: 'Lazer' },
      
      // Contas & Moradia
      { patterns: ['SABESP', 'COPASA', 'COMPANHIA DE AGUA', 'SANEPAR', 'CAESB', 'AGUA'], clean: 'Conta de Água', cat: 'Moradia' },
      { patterns: ['ENEL', 'CEMIG', 'LIGHT', 'ENERGISA', 'CPFL', 'COELBA', 'CEB', 'ENERGIA', 'LUZ'], clean: 'Conta de Luz', cat: 'Moradia' },
      { patterns: ['VIVO', 'TIM', 'CLARO', 'OI FIBRA', 'TELEFONIA', 'INTERNET'], clean: 'Telefone/Internet', cat: 'Moradia' },
      { patterns: ['CONDOMINIO', 'ALUGUEL', 'GAS', 'COMGAS'], clean: 'Moradia / Condomínio', cat: 'Moradia' },
      
      // Compras & Vestuário
      { patterns: ['PAG*MERCADOPAGO', 'MERCADO LIVRE', 'MELI', 'MERCADOLIVRE'], clean: 'Mercado Livre', cat: 'Outros' },
      { patterns: ['AMZN', 'AMAZON', 'AMAZON.COM'], clean: 'Amazon', cat: 'Outros' },
      { patterns: ['SHOPEE', 'EBANX SHOPEE'], clean: 'Shopee', cat: 'Outros' },
      { patterns: ['ALIEXPRESS', 'EBANX ALIEXPRESS'], clean: 'AliExpress', cat: 'Outros' },
      { patterns: ['MAGAZINE LUIZA', 'MAGALU', 'CASAS BAHIA', 'FAST SHOP'], clean: 'Eletrônicos/Compras', cat: 'Outros' },
      { patterns: ['ZARA', 'RENNER', 'RIACHUELO', 'C&A', 'CENTAURO', 'DECATHLON'], clean: 'Vestuário', cat: 'Outros' },
      
      // Viagem
      { patterns: ['IBIS', 'DECOLAR', '123MILHAS', 'HOTEL', 'BOOKING', 'AIRBNB', 'GOL LINHAS', 'LATAM', 'AZUL LINHAS'], clean: 'Viagem / Passagens', cat: 'Viagem' },
      
      // Renda / Salário
      { patterns: ['SALARIO', 'RECEBIMENTO', 'PAGAMENTO SALARIO', 'HOLERITE', 'FOLHA PAGAMENTO', 'PRO-LABORE', 'DIVIDENDOS', 'RENDIMENTO'], clean: 'Salário / Renda', cat: 'Salário' }
    ];

    for (const rule of systemRules) {
      for (const pattern of rule.patterns) {
        if (text.includes(pattern)) {
          return { cleanDesc: rule.clean, category: rule.cat };
        }
      }
    }
    return null;
  }

  // Navigation Logic
  function navigateTo(pageId, title) {
    $('.page-view').addClass('hidden-page');
    $('#' + pageId).removeClass('hidden-page');
    $('#page-title').text(title);
    
    // Update active state in sidebar
    $('.nav-item').removeClass('bg-gray-800 border-l-4 border-primary text-white').addClass('text-gray-400 dark:text-slate-500 border-transparent hover:bg-gray-800/50');
    $(`[data-target="${pageId}"]`).removeClass('text-gray-400 dark:text-slate-500 border-transparent hover:bg-gray-800/50').addClass('bg-gray-800 border-l-4 border-primary text-white');
    
    // Trigger specific page loads
    if(pageId === 'page-dashboard') loadDashboard();
    if(pageId === 'page-planning') loadPlanning();
    if(pageId === 'page-transactions') loadTransactions();
    if(pageId === 'page-categories') loadCategoriesPage();

    // Toggle global filters
    if (pageId === 'page-categories' || pageId === 'page-planning') {
      $('#global-filters').removeClass('md:flex').addClass('!hidden');
    } else {
      $('#global-filters').removeClass('!hidden').addClass('md:flex');
    }
  }

      } else {

      navigateTo(target, title);

    loadDashboard();

    // Helper para preencher dinamicamente as categorias no modal de Nova Transação
    function populateTransactionCategorySelect(selectedCategory) {
      const select = $('#t-categoria');
      if (!select.length) return;
      const currentVal = selectedCategory || select.val() || 'Moradia';

      let html = '<option value="__add_new__" class="font-bold text-primary bg-blue-50">+ Acrescentar nova categoria...</option>';

      if (typeof getGroupedCategories === 'function') {
        const { grouped, sortedProfiles } = getGroupedCategories();
        sortedProfiles.forEach(profile => {
          html += `<optgroup label="${profile}">`;
          grouped[profile].forEach(c => {
            html += `<option value="${c.name}">${c.name}</option>`;
          });
          html += `</optgroup>`;
        });
      } else {
        // Fallback para grupos padrão
        html += `
          <optgroup label="Despesas Fixas">
            <option value="Moradia">Moradia</option>
            <option value="Despesas Fixas">Despesas Fixas</option>
            <option value="Educação">Educação</option>
            <option value="Saúde">Saúde</option>
          </optgroup>
          <optgroup label="Variáveis / Essenciais">
            <option value="Alimentação">Alimentação</option>
            <option value="Transporte">Transporte</option>
          </optgroup>
          <optgroup label="Discricionárias">
            <option value="Lazer">Lazer</option>
            <option value="Viagem">Viagem</option>
            <option value="Compras">Compras</option>
            <option value="Outros">Outros</option>
          </optgroup>
          <optgroup label="Receitas">
            <option value="Salário">Salário</option>
            <option value="Renda">Renda</option>
            <option value="Investimentos">Investimentos</option>
          </optgroup>
          <optgroup label="Outros">
            <option value="Transferência">Transferência</option>
            <option value="DESCONHECIDO">DESCONHECIDO</option>
          </optgroup>
        `;
      }

      select.html(html);
      if (currentVal && currentVal !== '__add_new__') {
        // Se a categoria selecionada existir, define
        if (select.find(`option[value="${currentVal}"]`).length) {
          select.val(currentVal);
        }
      }
    }

    // Modal behavior & Triggers
    $('#btn-new-transaction').click(function() {
      populateTransactionCategorySelect();
      $('#quick-category-panel').addClass('hidden');
      $('#modal-tx-title').text('Nova Transação');
      $('#modal-tx-subtitle').text('Cadastre uma transação no seu controle financeiro.');

      $('#recurrence-badge').text('Opcional');
      $('input[name="tx-tipo-radio"][value="Saída"]').prop('checked', true).trigger('change');
      const today = new Date().toISOString().split('T')[0];
      $('#t-data').val(today);
      $('#modal-transaction').removeClass('hidden');
    });

    // Botão NOVA na Matriz de Planejamento Financeiro
    $(document).on('click', '#btn-planning-new-transaction', function() {
      $('#form-planning-new-row')[0].reset();
      
      // Populate datalist with unique categories
      const catList = $('#modal-new-row-cat-list');
      catList.empty();
      if (typeof currentLoadedTransactions !== 'undefined' && currentLoadedTransactions.length > 0) {
        const uniqueCats = [...new Set(currentLoadedTransactions.map(t => t.categoria))].filter(Boolean).sort();
        uniqueCats.forEach(cat => {
          catList.append(`<option value="${cat}">`);
        });
      }
      
      $('#modal-planning-new-row').removeClass('hidden');
    });

    $('#btn-cancel-planning-new-row, #btn-close-planning-new-row').click(function() {
      $('#modal-planning-new-row').addClass('hidden');
    });

    $('#form-planning-new-row').submit(function(e) {
      e.preventDefault();
      const btn = $('#btn-submit-planning-new-row');
      const origText = btn.html();
      btn.prop('disabled', true).html('<i class="fa-solid fa-spinner fa-spin mr-2"></i> Criando...');
      
      const macro = $('#modal-new-row-macro').val();
      const cat = $('#modal-new-row-cat').val().trim();
      const desc = $('#modal-new-row-desc').val().trim();
      const val = parseFloat($('#modal-new-row-val').val());
      
      if (!cat || !desc || isNaN(val) || val <= 0) {
        alert('Por favor, preencha todos os campos corretamente.');
        btn.prop('disabled', false).html(origText);
        return;
      }
      
      const tipo = macro === 'Receitas' ? 'Entrada' : 'Saída';
      
      const yr = (typeof currentPlanningYear !== 'undefined' && currentPlanningYear) ? currentPlanningYear : new Date().getFullYear();
      const currentMonth = new Date().getMonth() + 1;
      const startMonth = Math.max(1, currentMonth);
      
      const itemsToSave = [];
      for (let m = startMonth; m <= 12; m++) {
        const mStr = String(m).padStart(2, '0');
        itemsToSave.push({
          origem: 'Planejamento',
          descricao: desc,
          categoria: cat,
          tipo: tipo,
          valor: val,
          data: `${yr}-${mStr}-10` // Usa dia 10 como padrão para a projeção
        });
      }
      
      if (typeof google !== 'undefined' && google.script) {
        google.script.run
          .withSuccessHandler(function() {
            $('#modal-planning-new-row').addClass('hidden');
            $('#form-planning-new-row')[0].reset();
            btn.prop('disabled', false).html(origText);
            loadTransactions();
            loadDashboard();
            if (typeof loadPlanning === 'function') loadPlanning();
          })
          .withFailureHandler(function(err) {
            alert('Erro ao criar linha: ' + err.message);
            btn.prop('disabled', false).html(origText);
          })
          .saveBatchTransactions(itemsToSave);
      } else {
        // Fallback local
        setTimeout(() => {
          GLOBAL_MOCK_BACKUP = JSON.stringify(GLOBAL_MOCK_TRANSACTIONS);
          itemsToSave.forEach(it => GLOBAL_MOCK_TRANSACTIONS.push(it));
          $('#modal-planning-new-row').addClass('hidden');
          $('#form-planning-new-row')[0].reset();
          btn.prop('disabled', false).html(origText);

    // Helper to download base64
    function downloadBase64File(base64Data, mimeType, fileName) {
      const byteCharacters = atob(base64Data);
      const byteNumbers = new Array(byteCharacters.length);
      for (let i = 0; i < byteCharacters.length; i++) {
        byteNumbers[i] = byteCharacters.charCodeAt(i);
      }
      const byteArray = new Uint8Array(byteNumbers);
      const blob = new Blob([byteArray], {type: mimeType});
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.style.display = 'none';
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      window.URL.revokeObjectURL(url);
      document.body.removeChild(a);
    }

    function extractSpreadsheetIdClient(input) {
      if (!input) return null;
      const str = String(input).trim();
      const match = str.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/i);
      if (match && match[1]) {
        return match[1];
      }
      if (/^[a-zA-Z0-9-_]{20,}$/.test(str)) {
        return str;
      }
      return null;
    }

      }
    }

    function processImportFile(file) {
      $('#import-step-1').addClass('hidden');
      $('#import-step-2').removeClass('hidden');

      const reader = new FileReader();
      reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        let workbook;
        try {
          workbook = XLSX.read(data, {type: 'array'});
        } catch (err) {
          alert('Erro ao ler arquivo: ' + err.message);
          resetImportModal();
          return;
        }

        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        let json = XLSX.utils.sheet_to_json(worksheet, {header: 1, raw: false, dateNF: 'dd/mm/yyyy'});
        
        if(json.length < 2) {
          alert("O arquivo parece estar vazio ou sem dados.");
          resetImportModal();
          return;
        }

        analyzeAndCategorize(json);
      };
      reader.readAsArrayBuffer(file);
    }

    function analyzeAndCategorize(rows) {
      const headerRow = rows[0].map(h => String(h).toUpperCase().trim());
      
      // Detect column indices
      const idxData = headerRow.findIndex(h => h.includes('DATA'));
      const idxValor = headerRow.findIndex(h => h.includes('VALOR') || h.includes('R$'));
      const idxTipo = headerRow.findIndex(h => h.includes('TIPO') || h.includes('ENTRADA') || h.includes('SAÍDA'));
      const idxDesc = headerRow.findIndex(h => h.includes('DESCRI') || h.includes('HISTÓRICO'));
      const idxCat = headerRow.findIndex(h => h.includes('CATEGORIA'));

      if (idxData === -1 || idxValor === -1 || idxDesc === -1) {
        alert("Não foi possível identificar automaticamente as colunas (Data, Valor, Descrição). Certifique-se de que o arquivo contém cabeçalhos.");
        resetImportModal();
        return;
      }

      const parsedTransactions = [];
      
      for(let i=1; i<rows.length; i++) {
        const row = rows[i];
        if(!row || row.length === 0 || !row[idxData]) continue;
        
        let dataStr = String(row[idxData]).trim();
        // simple date normalizer assuming DD/MM/YYYY or DD/MM/YY
        let isoDate = dataStr;
        if(dataStr.includes('/')) {
          let p = dataStr.split('/');
          if(p.length === 3) {
            let year = p[2];
            if(year.length === 2) year = '20' + year; // handle YY
            isoDate = `${year}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;
          }
        } else if (dataStr.includes('-')) {
          let p = dataStr.split('-');
          if(p.length === 3 && p[0].length === 4) {
             isoDate = dataStr; // already YYYY-MM-DD
          } else if (p.length === 3 && p[2].length === 4) {
             isoDate = `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`; // DD-MM-YYYY
          }
        }

        let valStr = String(row[idxValor]).replace('R$', '').replace(/\s/g, '');
        // handle pt-br decimals 1.200,50 -> 1200.50
        if(valStr.includes(',') && valStr.includes('.')) {
          valStr = valStr.replace(/\./g, '').replace(',', '.');
        } else if (valStr.includes(',')) {
          valStr = valStr.replace(',', '.');
        }
        const valor = parseFloat(valStr) || 0;
        
        let rawDesc = row[idxDesc] || '';
        let normDesc = normalizeDescription(rawDesc);
        
        let tipo = idxTipo > -1 ? row[idxTipo] : '';
        tipo = String(tipo).toUpperCase();
        if(tipo.includes('ENTRADA') || tipo.includes('RECEITA') || tipo.includes('CREDITO')) tipo = 'Entrada';
        else if(tipo.includes('SAÍDA') || tipo.includes('DESPESA') || tipo.includes('DEBITO')) tipo = 'Saída';
        else tipo = valor > 0 ? 'Entrada' : 'Saída'; // Guess by positive/negative if no column
        
        let valorFinal = Math.abs(valor); // store positive
        
        let categoria = idxCat > -1 ? row[idxCat] : '';
        if (categoria) categoria = String(categoria).trim();

        let confianca = 'alta';
        let origem = 'Arquivo';
        
        if (!categoria) {
           // 1. Try Custom User Rules
           let ruleMatch = GLOBAL_RULES.find(r => normDesc.includes(r.pattern) || String(rawDesc).toUpperCase().includes(r.pattern));
           if(ruleMatch) {
             const matchedCat = GLOBAL_CATEGORIES.find(c => c.id == ruleMatch.categoryId);
             categoria = matchedCat ? matchedCat.name : 'Outros';
             normDesc = ruleMatch.clean; // update to clean description!
             origem = 'Usuário';
             confianca = 'alta';
           } else {
             // 2. Try System Rules
             let intelligentMatch = getIntelligentSystemMatch(rawDesc, normDesc);
             if (intelligentMatch) {
               categoria = intelligentMatch.category;
               normDesc = intelligentMatch.cleanDesc;
               origem = 'Sistema';
               confianca = 'alta';
               
               const catLower = categoria.toLowerCase();
               let existingCat = GLOBAL_CATEGORIES.find(c => c.name.toLowerCase() === catLower);
               if (!existingCat) {
                   const newProfile = tipo === 'Entrada' ? 'Receita Variável' : 'Despesa Discricionária';
                   existingCat = {
                       id: Date.now() + Math.random(),
                       name: categoria,
                       profile: newProfile
                   };
                   GLOBAL_CATEGORIES.push(existingCat);
                   if(typeof renderCategoriesList === 'function') renderCategoriesList();
                   if(typeof populateRuleCategorySelect === 'function') populateRuleCategorySelect();
               }
               categoria = existingCat.name;
             } else {
               // 3. Fallback / AI Mock
               categoria = 'Revisar';
               origem = 'IA Sugestão';
               confianca = 'baixa';
             }
           }
        } else {
           origem = 'Arquivo';
           const catLower = categoria.toLowerCase();
           let existingCat = GLOBAL_CATEGORIES.find(c => c.name.toLowerCase() === catLower);
           if (!existingCat) {
               const newProfile = tipo === 'Entrada' ? 'Receita Variável' : 'Despesa Discricionária';
               existingCat = {
                   id: Date.now() + Math.random(),
                   name: categoria,
                   profile: newProfile
               };
               GLOBAL_CATEGORIES.push(existingCat);
               
               // Update UI components that rely on the global category list
               if(typeof renderCategoriesList === 'function') renderCategoriesList();
               if(typeof populateRuleCategorySelect === 'function') populateRuleCategorySelect();
           }
           categoria = existingCat.name;
        }

        parsedTransactions.push({
          data: isoDate,
          valor: valorFinal,
          tipo: tipo,
          descricao: rawDesc,
          normDesc: normDesc,
          categoria: categoria,
          origem: origem,
          confianca: confianca
        });
      }

      pendingImport = parsedTransactions;
      renderImportReview();
    }

              </label>

               ${originHtml}

              </div>

      $('#import-review-body').html(html);

    // Handle Category change in review
    $(document).on('change', '.import-cat-select', function() {

  const formatCurrency = (val) => {

  // Loaders
  function getDashboardData() {
    $('#dashboard-loading').show();
    $('#dashboard-content').hide();
    
    const year = $('#filter-year').val();
    const month = $('#filter-month').val();
    
    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler(function(data) {
          $('#dashboard-loading').hide();
          $('#dashboard-content').show();
          renderDashboard(data);
        })
        .withFailureHandler(function(error) {
          $('#dashboard-loading').hide();
        })
        .getDashboardData(year, month);
    } else {
      setTimeout(() => {
        $('#dashboard-loading').hide();
        $('#dashboard-content').show();
        // Mock for local testing
        let income = 0;
        let expense = 0;
        const temporalData = {};
        const categoryGrouped = {};
        const categoryBreakdown = {};
        const incomeCategoryGrouped = {};
        const macroGrouped = {
          'Fixas': 0,
          'Variáveis Essenciais': 0,
          'Discricionárias': 0
        };

        const MACRO_COLORS = {
          'Fixas': '#991b1b',
          'Variáveis Essenciais': '#ef4444',
          'Discricionárias': '#f87171'
        };

        GLOBAL_MOCK_TRANSACTIONS.forEach(t => {
          const parts = String(t.data).split('-');
          const tYear = parts[0];
          const tMonth = parseInt(parts[1], 10).toString();
          const mNum = tMonth.padStart(2, '0');
          
          const matchYear = year === 'all' || year === tYear;
          const matchMonth = month === 'all' || parseInt(month) === parseInt(tMonth);
          
          if (matchYear) {
             const key = `${tYear}-${mNum}`;
             const label = `${mNum}/${tYear}`;
             if (!temporalData[key]) temporalData[key] = { label, sortKey: key, income: 0, expense: 0 };
             if (t.tipo === 'Entrada') temporalData[key].income += t.valor;
             if (t.tipo === 'Saída') temporalData[key].expense += t.valor;
          }

          if (matchYear && matchMonth) {
             if (t.tipo === 'Entrada') {
               income += t.valor;
               if (!incomeCategoryGrouped[t.categoria]) incomeCategoryGrouped[t.categoria] = 0;
               incomeCategoryGrouped[t.categoria] += t.valor;
             }
             if (t.tipo === 'Saída') {
               expense += t.valor;
               const macro = getMacroCategory(t.categoria, t.descricao);
               macroGrouped[macro] += t.valor;
               
               if (!categoryGrouped[t.categoria]) categoryGrouped[t.categoria] = { value: 0, macros: { 'Fixas': 0, 'Variáveis Essenciais': 0, 'Discricionárias': 0 } };
               categoryGrouped[t.categoria].value += t.valor;
               categoryGrouped[t.categoria].macros[macro] += t.valor;
               
               if (!categoryBreakdown[t.categoria]) categoryBreakdown[t.categoria] = {};
               if (!categoryBreakdown[t.categoria][t.descricao]) categoryBreakdown[t.categoria][t.descricao] = { value: 0, macro: macro };
               categoryBreakdown[t.categoria][t.descricao].value += t.valor;
             }
          }
        });

        const mockChartData = Object.values(temporalData).sort((a,b) => a.sortKey.localeCompare(b.sortKey));
        
        const mockCategoryData = Object.keys(categoryGrouped).map(k => {
           const catData = categoryGrouped[k];
           const dominantMacro = Object.keys(catData.macros).reduce((a, b) => catData.macros[a] > catData.macros[b] ? a : b);
           const breakdownObj = categoryBreakdown[k];
           const breakdownArray = Object.keys(breakdownObj).map(desc => ({
             label: desc, value: breakdownObj[desc].value, color: MACRO_COLORS[breakdownObj[desc].macro]
           })).sort((a,b) => b.value - a.value);
           
           return { label: k, value: catData.value, color: MACRO_COLORS[dominantMacro], macro: dominantMacro, breakdown: breakdownArray };
        }).sort((a, b) => b.value - a.value);

        const mockIncomeCategoryData = Object.keys(incomeCategoryGrouped).map(k => ({
          label: k, value: incomeCategoryGrouped[k]
        })).sort((a,b) => b.value - a.value);

        const mockMacroData = Object.keys(macroGrouped).map(k => ({
          label: k, value: macroGrouped[k], color: MACRO_COLORS[k]
        })).filter(d => d.value > 0).sort((a,b) => b.value - a.value);

        let mockRawExpenses = GLOBAL_MOCK_TRANSACTIONS
          .filter(t => t.tipo === "Saída")
          .map(t => {
            const parts = t.data.split('-');
            return {
              date: new Date(parts[0], parseInt(parts[1])-1, parts[2]).getTime(),
              desc: t.descricao,
              value: t.valor
            }
          });

        renderDashboard({ 
          balance: income - expense, 
          income: income, 
          expense: expense, 
          chartData: mockChartData,
          categoryChartData: mockCategoryData,
          incomeCategoryChartData: mockIncomeCategoryData,
          macroChartData: mockMacroData,
          rawExpenses: mockRawExpenses
        });
      }, 500);
    }
  }

  function renderEvolutionChart(chartData) {
    const ctx = document.getElementById('evolutionChart');
    if (!ctx) return;
    
    if (evolutionChartInstance) {
      evolutionChartInstance.destroy();
    }
    
    if (!chartData || chartData.length === 0) {
      return;
    }
    
    evolutionChartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: chartData.map(d => d.label),
        datasets: [
          {

  function loadTransactions() {
    const tbody = $('#transactions-body');
    tbody.html('<tr><td colspan="6" class="p-8 text-center text-gray-500 dark:text-slate-500"><i class="fa-solid fa-circle-notch fa-spin text-primary"></i> Carregando transações...</td></tr>');
    
    const year = $('#filter-year').val();
    const month = $('#filter-month').val();
    
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(rows) {
          renderTransactions(rows);
        })
        .withFailureHandler(function() {
          tbody.html('<tr><td colspan="6" class="p-8 text-center text-red-500">Erro ao carregar transações.</td></tr>');
        })
        .getTransactions(year, month);
    } else {
      setTimeout(() => {
        // Filter mock transactions based on selected month and year
        const filteredTransactions = GLOBAL_MOCK_TRANSACTIONS.filter(t => {
          const parts = String(t.data).split('-');
          const tYear = parts[0];
          const tMonth = parseInt(parts[1], 10).toString();
          
          const matchYear = year === 'all' || year === tYear;
          const matchMonth = month === 'all' || parseInt(month) === parseInt(tMonth);
          
          return matchYear && matchMonth;
        });
        
        renderTransactions(filteredTransactions);
      }, 300);
    }
  }

  function renderTransactions(rows) {
    // Overwrite categories matching overrides across all months
    currentLoadedTransactions = applyCategoryOverrides(rows || []);
    
    // Update the dropdown menu in the category column header
    updateCategoryFilterDropdown();
    
    // Render sorted and filtered rows
    applySortAndFilterTransactions();
  }

  function updateCategoryFilterDropdown() {
    const counts = {};
    let uncategorizedCount = 0;
    currentLoadedTransactions.forEach(t => {
      const c = (t.categoria || '').trim();
      if (!c || c === 'Revisar') {
        uncategorizedCount++;
      } else {
        counts[c] = (counts[c] || 0) + 1;
      }
    });

    const total = currentLoadedTransactions.length;
    let html = `
      <button type="button" class="w-full text-left px-3 py-2 hover:bg-gray-50 dark:hover:!bg-slate-700 transition-colors flex items-center justify-between font-medium btn-set-cat-filter ${activeCategoryFilter === null ? 'text-primary font-bold bg-blue-50/60' : 'text-gray-700 dark:text-slate-300'}" data-cat="__ALL__">

        <span class="bg-gray-100 text-gray-600 dark:text-slate-400 px-2 py-0.5 rounded-full text-[10px] font-semibold">${total}</span>
      </button>
    `;

    const sortedCats = Object.keys(counts).sort((a, b) => a.localeCompare(b, 'pt-BR'));
    sortedCats.forEach(cat => {
      const isSelected = activeCategoryFilter && activeCategoryFilter.toLowerCase() === cat.toLowerCase();
      html += `
        <button type="button" class="w-full text-left px-3 py-2 hover:bg-gray-50 dark:hover:!bg-slate-700 transition-colors flex items-center justify-between btn-set-cat-filter ${isSelected ? 'text-primary font-bold bg-blue-50/60' : 'text-gray-700 dark:text-slate-300'}" data-cat="${cat}">
          <span class="flex items-center truncate mr-2">
            <span class="w-2 h-2 rounded-full mr-2 shrink-0 ${isSelected ? 'bg-primary ring-2 ring-blue-300' : 'bg-gray-300'}"></span>
            <span class="truncate">${cat}</span>
          </span>
          <span class="bg-gray-100 text-gray-600 dark:text-slate-400 px-2 py-0.5 rounded-full text-[10px] font-semibold shrink-0">${counts[cat]}</span>
        </button>

        <button type="button" class="w-full text-left px-3 py-2 hover:bg-red-50/60 dark:hover:!bg-slate-700 transition-colors flex items-center justify-between text-red-700 btn-set-cat-filter ${isSelected ? 'font-bold bg-red-50' : ''}" data-cat="__UNCATEGORIZED__">

        </button>

    $('#category-filter-items').html(html);

    if (activeCategoryFilter !== null) {
      $('#btn-cat-filter-toggle').addClass('text-primary bg-blue-50 border-blue-200 dark:border-blue-800');
      $('#icon-cat-dropdown').addClass('text-primary');
    } else {
      $('#btn-cat-filter-toggle').removeClass('text-primary bg-blue-50 border-blue-200 dark:border-blue-800');
      $('#icon-cat-dropdown').removeClass('text-primary');

  function applySortAndFilterTransactions() {
    const tbody = $('#transactions-body');
    tbody.empty();

    let displayRows = [...currentLoadedTransactions];

    // Description search filter
    const searchVal = ($('#tx-search-input').val() || txSearchQuery || '').trim().toLowerCase();
    if (searchVal) {
      displayRows = displayRows.filter(r => {
        const rawDesc = String(r.descricao || '').toLowerCase();
        const normDesc = normalizeDescription(r.descricao || '').toLowerCase();
        return rawDesc.includes(searchVal) || normDesc.includes(searchVal);
      });
    }

    // Category filter application
    if (activeCategoryFilter !== null) {
      if (activeCategoryFilter === '__UNCATEGORIZED__') {
        displayRows = displayRows.filter(r => !r.categoria || r.categoria === '' || r.categoria === 'Revisar');
        $('#active-category-name').text('Sem Categoria / Revisar');
      } else {
        displayRows = displayRows.filter(r => (r.categoria || '').trim().toLowerCase() === activeCategoryFilter.toLowerCase());
        $('#active-category-name').text(activeCategoryFilter);
      }
      $('#active-category-count').text(`${displayRows.length} transações`);
      $('#active-category-filter-bar').removeClass('hidden');
    } else {
      $('#active-category-filter-bar').addClass('hidden');
    }

    // Column sorting: 1st click desc, 2nd click asc
    if (currentSortCol) {
      displayRows.sort((a, b) => {
        let valA = a[currentSortCol];
        let valB = b[currentSortCol];

        let cmp = 0;
        if (currentSortCol === 'valor') {
          cmp = Number(valA || 0) - Number(valB || 0);
        } else if (currentSortCol === 'data') {
          const dA = new Date(valA).getTime() || 0;
          const dB = new Date(valB).getTime() || 0;
          cmp = dA - dB;
        } else {
          cmp = String(valA || '').localeCompare(String(valB || ''), 'pt-BR', { sensitivity: 'base' });
        }

        return currentSortDir === 'desc' ? -cmp : cmp;
      });
    }

    // Update sort icons across headers
    $('.sort-icon').each(function() {
      const col = $(this).data('col');
      if (col === currentSortCol) {
        if (currentSortDir === 'desc') {
          $(this).html('<i class="fa-solid fa-arrow-down-wide-short text-primary"></i>');
        } else {
          $(this).html('<i class="fa-solid fa-arrow-up-short-wide text-primary"></i>');
        }
      } else {
        $(this).html('<i class="fa-solid fa-sort text-gray-300"></i>');
      }
    });

    if (displayRows.length === 0) {
      tbody.html('<tr><td colspan="6" class="p-8 text-center text-gray-500 dark:text-slate-500">Nenhuma transação encontrada para este filtro.</td></tr>');
      return;
    }

    displayRows.forEach(row => {
      let dateStr = row.data;
      if (dateStr && dateStr.substring) {
         if(dateStr.indexOf('T') !== -1) dateStr = dateStr.split('T')[0];
         const parts = dateStr.split('-');
         if(parts.length === 3) dateStr = `${parts[2]}/${parts[1]}/${parts[0]}`;
      }
      
      const valClass = row.tipo === 'Entrada' ? 'text-success' : 'text-gray-900 dark:text-white';
      const valPrefix = row.tipo === 'Entrada' ? '+ ' : '- ';
      const categoryColor = getCategoryColor(row.categoria);

      tbody.append(`
        <tr class="hover:bg-gray-50 dark:hover:!bg-slate-700/50 transition-colors group">
          <td class="p-4 text-gray-500 dark:text-slate-500 align-middle whitespace-nowrap">${row.origem || '-'}</td>
          <td class="p-4 font-medium text-gray-900 dark:text-white align-middle max-w-xs break-words">${row.descricao}</td>
          <td class="p-4 align-middle max-w-[220px]">
            <span class="inline-block max-w-[170px] sm:max-w-[200px] px-2.5 py-1.5 ${categoryColor} rounded-md text-xs font-medium whitespace-normal break-words leading-snug text-left shadow-2xs">${row.categoria || 'Sem categoria'}</span>
          </td>
          <td class="p-4 text-gray-500 dark:text-slate-500 text-xs uppercase align-middle whitespace-nowrap">${row.tipo}</td>
          <td class="p-4 text-right ${valClass} font-medium align-middle whitespace-nowrap">${valPrefix}${formatCurrency(row.valor)}</td>
          <td class="p-4 text-right text-gray-500 dark:text-slate-500 align-middle whitespace-nowrap">${dateStr}</td>
        </tr>
      `);
    });
  }

  function getCategoryColor(cat) {
    switch(cat) {
      case 'Alimentação': return 'bg-orange-50 text-orange-700 border border-orange-100';
      case 'Transporte': return 'bg-blue-50 text-blue-700 border border-blue-100';
      case 'Moradia': return 'bg-purple-50 dark:bg-purple-900/30 text-purple-700 dark:text-purple-300 border border-purple-100 dark:border-purple-800';
      case 'Lazer': return 'bg-pink-50 text-pink-700 border border-pink-100';
      case 'Saúde': return 'bg-emerald-50 text-emerald-700 border border-emerald-100';
      case 'Renda': return 'bg-success/10 text-success border border-success/20';
      case 'Transferência': return 'bg-gray-100 text-gray-700 dark:text-slate-300 border border-gray-200 dark:border-slate-700';
      default: return 'bg-gray-100 text-gray-700 dark:text-slate-300 border border-gray-200 dark:border-slate-700';
    }
  }

  function openDeepDrilldown(descLabel) {
    $('#deep-drilldown-modal').removeClass('hidden');
    $('#deep-drilldown-title').text('Histórico: ' + descLabel);
    
    // Filter raw data for this sub-category
    const filtered = rawExpensesData.filter(d => d.desc === descLabel).sort((a, b) => a.date - b.date);
    
    // Group by Month/Year
    const temporalData = {};
    filtered.forEach(item => {
      const d = new Date(item.date);
      const mNum = (d.getMonth() + 1).toString().padStart(2, '0');
      const y = d.getFullYear();
      const key = `${y}-${mNum}`;
      const label = `${mNum}/${y}`;
      
      if (!temporalData[key]) temporalData[key] = { label: label, sortKey: key, value: 0 };
      temporalData[key].value += item.value;
    });
    
    const chartData = Object.values(temporalData).sort((a, b) => a.sortKey.localeCompare(b.sortKey));
    
    // Calculate metrics
    let avg = 0;
    let mom = 0;
    let trend = 'Sem dados';
    
    if (chartData.length > 0) {
      const total = chartData.reduce((acc, curr) => acc + curr.value, 0);
      avg = total / chartData.length;
      
      if (chartData.length > 1) {
        const last = chartData[chartData.length - 1].value;
        const prev = chartData[chartData.length - 2].value;
        if (prev > 0) {
          mom = ((last - prev) / prev) * 100;
        } else {
          mom = 100; // if previous was 0 and now has value
        }
      }
      
      if (mom > 0) trend = 'Subindo';
      else if (mom < 0) trend = 'Descendo';
      else trend = 'Estável';
    }
    
    $('#drilldown-avg').text(formatCurrency(avg));
    
    const momEl = $('#drilldown-mom');
    momEl.empty();
    if (chartData.length < 2) {
      momEl.text('-');
    } else {
      const momText = Math.abs(mom).toFixed(1) + '%';
      if (mom > 0) {
        momEl.html(`<i class="fa-solid fa-arrow-trend-up text-danger mr-2"></i><span class="text-danger">+${momText}</span>`);
      } else if (mom < 0) {
        momEl.html(`<i class="fa-solid fa-arrow-trend-down text-success mr-2"></i><span class="text-success">-${momText}</span>`);
      } else {
        momEl.html(`<span class="text-gray-500 dark:text-slate-500">0%</span>`);
      }
    }
    
    $('#drilldown-trend').text(trend);
    
    // Render chart
    const ctx = document.getElementById('deepDrilldownChart');
    if (!ctx) return;
    
    if (deepDrilldownChartInstance) {
      deepDrilldownChartInstance.destroy();
    }

  function getCategoryProfileBadge(profile) {
    if (profile.includes('Despesa Fixa')) return `<span class="bg-red-100 text-red-700 text-xs px-2 py-0.5 rounded-full font-medium">Fixa</span>`;
    if (profile.includes('Variável') && profile.includes('Despesa')) return `<span class="bg-yellow-100 text-yellow-700 text-xs px-2 py-0.5 rounded-full font-medium">Variável</span>`;
    if (profile.includes('Discricionária')) return `<span class="bg-orange-100 text-orange-700 text-xs px-2 py-0.5 rounded-full font-medium">Discricionária</span>`;
    if (profile.includes('Receita Fixa')) return `<span class="bg-emerald-100 text-emerald-700 text-xs px-2 py-0.5 rounded-full font-medium">Receita Fixa</span>`;
    if (profile.includes('Receita Variável')) return `<span class="bg-teal-100 text-teal-700 text-xs px-2 py-0.5 rounded-full font-medium">Receita Variável</span>`;
    return `<span class="bg-gray-100 text-gray-700 dark:text-slate-300 text-xs px-2 py-0.5 rounded-full font-medium">${profile}</span>`;
  }

  function getGroupedCategories() {
    const sortedCats = [...GLOBAL_CATEGORIES].sort((a, b) => a.name.localeCompare(b.name));
    
    const grouped = {};
    sortedCats.forEach(cat => {
      if(!grouped[cat.profile]) grouped[cat.profile] = [];
      grouped[cat.profile].push(cat);
    });
    
    const order = ['Despesa Fixa', 'Despesa Variável', 'Despesa Discricionária', 'Receita Fixa', 'Transferência'];
    const sortedProfiles = Object.keys(grouped).sort((a, b) => {
      let idxA = order.indexOf(a);
      let idxB = order.indexOf(b);
      if(idxA === -1) idxA = 99;
      if(idxB === -1) idxB = 99;
      return idxA - idxB;
    });
    return { grouped, sortedProfiles };
  }

  function getProfileHeaderDetails(profile) {
    if (profile.includes('Despesa Fixa')) return { icon: 'fa-solid fa-calendar-minus', color: 'text-red-600', bg: 'bg-red-50' };
    if (profile.includes('Variável') && profile.includes('Despesa')) return { icon: 'fa-solid fa-bolt', color: 'text-yellow-600', bg: 'bg-yellow-50' };
    if (profile.includes('Discricionária')) return { icon: 'fa-solid fa-basket-shopping', color: 'text-orange-600', bg: 'bg-orange-50' };
    if (profile.includes('Receita Fixa')) return { icon: 'fa-solid fa-hand-holding-dollar', color: 'text-emerald-600', bg: 'bg-emerald-50' };
    if (profile.includes('Receita Variável')) return { icon: 'fa-solid fa-chart-line', color: 'text-teal-600', bg: 'bg-teal-50' };
    if (profile.includes('Transferência')) return { icon: 'fa-solid fa-arrow-right-arrow-left', color: 'text-gray-600 dark:text-slate-400', bg: 'bg-gray-100' };
    return { icon: 'fa-solid fa-tag', color: 'text-gray-500 dark:text-slate-500', bg: 'bg-gray-50' };
  }

    // =========================================================================

    // =========================================================================
    let syncTransactions = [];
    let syncFilter = 'all';

    function openSyncCategorizationModal() {
      $('#sync-categorize-modal').removeClass('hidden');

      if (typeof google !== 'undefined' && google.script && google.script.run) {

    function processSyncTransactions(rows) {
      $('#sync-loading').addClass('hidden');

      if (!rows || rows.length === 0) {
        $('#sync-empty').removeClass('hidden');
        $('#sync-content').addClass('hidden');
        return;
      }

      // Step 1: Ensure any pre-existing category in transactions is in GLOBAL_CATEGORIES
      const knownCatNames = new Set(GLOBAL_CATEGORIES.map(c => c.name.toLowerCase()));
      rows.forEach(r => {
        const cat = (r.categoria || '').trim();
        if (cat && cat !== 'Revisar' && cat !== 'Outros' && !knownCatNames.has(cat.toLowerCase())) {
          knownCatNames.add(cat.toLowerCase());
          GLOBAL_CATEGORIES.push({
            id: Date.now() + Math.floor(Math.random() * 1000),
            name: cat,
            profile: r.tipo === 'Entrada' ? 'Receita Variável' : 'Despesa Discricionária'
          });
        }
      });

      // Step 2: Analyze and classify each transaction
      syncTransactions = rows.map((r, index) => {
        const rawDesc = String(r.descricao || '').trim();
        const normDesc = normalizeDescription(rawDesc);
        let cat = String(r.categoria || '').trim();
        let origem = 'Pendente';
        let confianca = 'baixa';
        let saveRule = false;

        // Check user category overrides first
        const rawUpper = rawDesc.toUpperCase();
        const normUpper = normDesc.toUpperCase();
        if (CATEGORY_OVERRIDES[rawUpper]) {
          cat = CATEGORY_OVERRIDES[rawUpper];
          origem = 'Usuário';
          confianca = 'alta';
        } else if (CATEGORY_OVERRIDES[normUpper]) {
          cat = CATEGORY_OVERRIDES[normUpper];
          origem = 'Usuário';
          confianca = 'alta';
        } else {
          // Check user custom rules
          const userRuleMatch = GLOBAL_RULES.find(rule => {
            const p = (rule.pattern || '').trim().toUpperCase();
            if (!p) return false;
            return normDesc.includes(p) || rawDesc.toUpperCase().includes(p);
          });

          if (userRuleMatch) {
            const matchedCatObj = GLOBAL_CATEGORIES.find(c => c.id == userRuleMatch.categoryId);
            cat = matchedCatObj ? matchedCatObj.name : (userRuleMatch.clean || 'Outros');
            origem = 'Usuário';
            confianca = 'alta';
          } else {
            // Check intelligent system patterns
            const sysMatch = getIntelligentSystemMatch(rawDesc, normDesc);
            if (sysMatch) {
              cat = sysMatch.category;
              origem = 'Sistema';
              confianca = 'alta';

              // Auto-create category in GLOBAL_CATEGORIES if not already present
              if (!knownCatNames.has(cat.toLowerCase())) {
                knownCatNames.add(cat.toLowerCase());
                GLOBAL_CATEGORIES.push({
                  id: Date.now() + Math.floor(Math.random() * 1000),
                  name: cat,
                  profile: (r.tipo === 'Entrada' || cat.toLowerCase().includes('salário') || cat.toLowerCase().includes('receita')) ? 'Receita Fixa' : 'Despesa Variável'
                });
              }
            } else if (cat && cat !== 'Revisar' && cat !== 'Outros' && cat !== '') {
              // Already categorized previously
              origem = 'Existente';
              confianca = 'alta';
            } else {
              // Truly uncategorized
              cat = '';
              origem = 'Pendente';
              confianca = 'baixa';
            }
          }
        }

        return {
          rowIndex: r.rowIndex || (index + 1),
          data: r.data || '',
          valor: Number(r.valor) || 0,
          tipo: r.tipo || 'Saída',
          descricao: rawDesc,
          normDesc: normDesc || rawDesc,
          categoria: cat,
          origem: origem,
          confianca: confianca,
          saveRule: saveRule
        };
      });

      renderCategoriesList();
      populateRuleCategorySelect();

      $('#sync-empty').addClass('hidden');
      $('#sync-content').removeClass('hidden');
      renderSyncTable();
    }

    function renderSyncTable() {
      const total = syncTransactions.length;
      const pendingCount = syncTransactions.filter(t => !t.categoria || t.categoria === '' || t.categoria === 'Revisar' || t.confianca === 'baixa').length;
      const autoCount = total - pendingCount;

      $('#sync-count-total').text(total);
      $('#sync-count-pending').text(pendingCount);
      $('#sync-count-auto').text(autoCount);

      $('#sync-summary-title').text('Resumo da Análise');
      $('#sync-summary-subtitle').text(`${total} transações analisadas (${autoCount} reconhecidas, ${pendingCount} para revisar)`);

      if (pendingCount > 0) {
        $('#sync-footer-status').html(`<span class="text-amber-600 font-semibold"><i class="fa-solid fa-circle-exclamation mr-1.5"></i>${pendingCount} transação(ões) aguardando definição de categoria</span>`);
      } else {
        $('#sync-footer-status').html(`<span class="text-emerald-600 font-semibold"><i class="fa-solid fa-circle-check mr-1.5"></i>Todas as ${total} transações estão categorizadas!</span>`);
      }

      // Filter rows
      let displayRows = syncTransactions.map((t, idx) => ({ ...t, originalIndex: idx }));
      if (syncFilter === 'pending') {
        displayRows = displayRows.filter(t => !t.categoria || t.categoria === '' || t.categoria === 'Revisar' || t.confianca === 'baixa');
      } else if (syncFilter === 'auto') {
        displayRows = displayRows.filter(t => t.categoria && t.categoria !== '' && t.categoria !== 'Revisar' && t.confianca === 'alta');
      }

      if (displayRows.length === 0) {
        $('#sync-review-body').html(`
          <tr>
            <td colspan="6" class="p-8 text-center text-gray-400 dark:text-slate-500">
              <i class="fa-solid fa-filter text-2xl mb-2 text-gray-300"></i>
              <p class="text-xs">Nenhuma transação encontrada para o filtro selecionado.</p>
            </td>
          </tr>
        `);
        return;
      }

      const { grouped, sortedProfiles } = getGroupedCategories();

      let html = '';
      displayRows.forEach(t => {
        const idx = t.originalIndex;
        let dateFormatted = t.data || '';
        if (dateFormatted && dateFormatted.includes('-')) {
          const parts = dateFormatted.split('-');
          if (parts.length === 3) dateFormatted = `${parts[2]}/${parts[1]}/${parts[0]}`;
        }

        // Build category options
        let catOptions = `<option value="" disabled ${!t.categoria ? 'selected' : ''}>-- Selecione a Categoria --</option>`;
        catOptions += `<option value="__NEW__" class="font-bold text-primary bg-blue-50">+ Criar Nova Categoria...</option>`;
        
        sortedProfiles.forEach(prof => {
          catOptions += `<optgroup label="${prof}">`;
          grouped[prof].forEach(c => {
            const isSel = (t.categoria && t.categoria.toLowerCase() === c.name.toLowerCase());
            catOptions += `<option value="${c.name}" ${isSel ? 'selected' : ''}>${c.name}</option>`;
          });
          catOptions += `</optgroup>`;
        });

        // If category is not in list yet, show it
        if (t.categoria && !GLOBAL_CATEGORIES.some(c => c.name.toLowerCase() === t.categoria.toLowerCase())) {
          catOptions += `<optgroup label="Nova"><option value="${t.categoria}" selected>${t.categoria}</option></optgroup>`;
        }

        // Origin badge

    // Handle user manual category change with AUTOMATIC PROPAGATION TO IDENTICAL DESCRIPTIONS
    $(document).on('change', '.sync-cat-select', function() {
      const index = $(this).data('index');
      let newCat = $(this).val();

      if (newCat === '__NEW__') {
        const promptName = prompt("Digite o nome da nova categoria (ex: Supermercado, Farmácia):");
        if (!promptName || !promptName.trim()) {
          $(this).val(syncTransactions[index].categoria || '');
          return;
        }
        newCat = promptName.trim();
        let exists = GLOBAL_CATEGORIES.find(c => c.name.toLowerCase() === newCat.toLowerCase());
        if (!exists) {
          const isEntrada = syncTransactions[index].tipo === 'Entrada';
          const newCatObj = {
            id: Date.now() + Math.floor(Math.random() * 1000),
            name: newCat,
            profile: isEntrada ? 'Receita Variável' : 'Despesa Variável'
          };
          GLOBAL_CATEGORIES.push(newCatObj);
          renderCategoriesList();
          populateRuleCategorySelect();
        } else {
          newCat = exists.name;
        }
      }

      if (!newCat) return;

      const currentItem = syncTransactions[index];
      const refNorm = normalizeDescription(currentItem.descricao);
      const refRaw = (currentItem.descricao || '').trim().toUpperCase();

      // AUTOMATIC PROPAGATION:
      // When the user categorizes an item like "DONA 216 NORTE", all other identical descriptions
      // are immediately filled with this same category!
      let affectedCount = 0;
      syncTransactions.forEach(t => {
        const tNorm = normalizeDescription(t.descricao);
        const tRaw = (t.descricao || '').trim().toUpperCase();
        if ((refRaw && tRaw === refRaw) || (refNorm && tNorm === refNorm)) {
          t.categoria = newCat;
          t.confianca = 'alta';
          t.origem = 'Usuário';
          t.saveRule = true; // Auto-mark rule to be remembered permanently
          affectedCount++;
        }
      });

      // Register rule in memory
      if (refNorm) {
        let catObj = GLOBAL_CATEGORIES.find(c => c.name.toLowerCase() === newCat.toLowerCase());
        let catId = catObj ? catObj.id : 9;
        let existingRule = GLOBAL_RULES.find(r => r.pattern.toUpperCase() === refNorm.toUpperCase());
        if (!existingRule) {
          GLOBAL_RULES.push({
            id: Date.now(),
            pattern: refNorm,
            clean: refNorm,
            categoryId: catId
          });
          renderRulesList();
        }
      }

    // Save and Apply Categorization to Transactions
    $('#btn-save-sync').click(function() {
      const pending = syncTransactions.filter(t => !t.categoria || t.categoria === '' || t.categoria === 'Revisar');
      if (pending.length > 0) {
        if (!confirm(`Atenção: ainda existem ${pending.length} transações sem categoria definida. Deseja classificá-las como "Outros" e continuar?`)) {
          return;
        }
        syncTransactions.forEach(t => {
          if (!t.categoria || t.categoria === '' || t.categoria === 'Revisar') {
            t.categoria = 'Outros';
          }
        });
      }

      const btn = $(this);
      const originalHtml = btn.html();
      btn.prop('disabled', true).html('<i class="fa-solid fa-spinner fa-spin mr-2"></i> Salvando...');

      // Save into CATEGORY_OVERRIDES for instant propagation across all tabs and months
      syncTransactions.forEach(t => {
        if (t.categoria) {
          const rawUpper = String(t.descricao || '').trim().toUpperCase();
          const normUpper = normalizeDescription(t.descricao || '').toUpperCase();
          if (rawUpper) CATEGORY_OVERRIDES[rawUpper] = t.categoria;
          if (normUpper) CATEGORY_OVERRIDES[normUpper] = t.categoria;
        }
      });
      try {
        localStorage.setItem('finance_category_overrides', JSON.stringify(CATEGORY_OVERRIDES));
      } catch(e) {}

      // Update GLOBAL_MOCK_TRANSACTIONS across all months
      GLOBAL_MOCK_TRANSACTIONS = GLOBAL_MOCK_TRANSACTIONS.filter(t => {
        const raw = String(t.descricao || '').trim().toUpperCase();
        return !DELETED_OVERRIDES.has(`${t.data}_${t.valor}_${raw}`);
      }).map(t => {
        const rawUpper = String(t.descricao || '').trim().toUpperCase();
        const normUpper = normalizeDescription(t.descricao || '').toUpperCase();
        if (CATEGORY_OVERRIDES[rawUpper]) {
          t.categoria = CATEGORY_OVERRIDES[rawUpper];
        } else if (CATEGORY_OVERRIDES[normUpper]) {
          t.categoria = CATEGORY_OVERRIDES[normUpper];
        }
        return t;
      });

      const updates = syncTransactions.map(t => ({
        rowIndex: t.rowIndex,
        categoria: t.categoria,
        descricao: t.descricao
      }));

      const rulesToSave = [];
      const savedPatterns = new Set();
      syncTransactions.forEach(t => {
        if (t.saveRule && t.categoria && t.normDesc) {
          const pat = t.normDesc.toUpperCase();
          if (!savedPatterns.has(pat)) {
            savedPatterns.add(pat);
            let catObj = GLOBAL_CATEGORIES.find(c => c.name === t.categoria);
            let catId = catObj ? catObj.id : 9;
            rulesToSave.push({
              pattern: pat,
              clean: t.normDesc,
              categoria: t.categoria,
              categoryId: catId
            });
          }
        }
      });

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function() {
            btn.prop('disabled', false).html(originalHtml);
            $('#sync-categorize-modal').addClass('hidden');
            alert(`Sucesso! Categorias atualizadas e regras aplicadas com sucesso.`);
            renderCategoriesList();
            renderRulesList();
            if (typeof loadTransactions === 'function') loadTransactions();
            if (typeof loadDashboard === 'function') loadDashboard();
          })
          .withFailureHandler(function(err) {
            btn.prop('disabled', false).html(originalHtml);
            alert("Erro ao salvar: " + (err.message || err));
          })
          .saveCategorizedTransactionsBatch(updates, rulesToSave, syncDeletedRowIndices);
      } else {
        // Standalone Preview Mode
        setTimeout(function() {
          rulesToSave.forEach(r => {
            if (!GLOBAL_RULES.find(rule => rule.pattern.toUpperCase() === r.pattern.toUpperCase())) {
              GLOBAL_RULES.push({
                id: Date.now() + Math.random(),
                pattern: r.pattern,
                clean: r.clean,
                categoryId: r.categoryId
              });
            }
          });

          btn.prop('disabled', false).html(originalHtml);
          $('#sync-categorize-modal').addClass('hidden');
          alert(`Sucesso! Categorias atualizadas e regras aplicadas com sucesso.`);
          renderCategoriesList();
          renderRulesList();
          if (typeof loadTransactions === 'function') loadTransactions();
          if (typeof loadDashboard === 'function') loadDashboard();
        }, 400);
      }

  // ==========================================
  // FUNÇÕES DE DADOS E RENDERIZAÇÃO DO PLANEJAMENTO
  // ==========================================
  let currentPlanningData = null;
  let planningEvolutionChartInstance = null;
  let planningCompositionChartInstance = null;
  let planningCompositionView = 'macro'; // 'macro' | 'income' | 'macro-Fixas' | 'macro-Variáveis Essenciais' | 'macro-Discricionárias'
  let currentPlanningYear = new Date().getFullYear();

  function loadPlanning(forcedYear) {
    $('#planning-loading').removeClass('hidden');
    $('#planning-content').addClass('hidden');

    const yearVal = forcedYear || $('#planning-year-select').val() || currentPlanningYear;
    const year = parseInt(yearVal, 10);
    currentPlanningYear = year;

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(data) {
          $('#planning-loading').addClass('hidden');
          $('#planning-content').removeClass('hidden');
          renderPlanning(data);
        })
        .withFailureHandler(function(err) {
          console.error("Erro ao carregar planejamento via Apps Script, executando fallback local:", err);
          const localData = calculateLocalPlanningData(year);
          $('#planning-loading').addClass('hidden');
          $('#planning-content').removeClass('hidden');
          renderPlanning(localData);
        })
        .getPlanningData(year);
    } else {
      setTimeout(() => {
        const localData = calculateLocalPlanningData(year);
        $('#planning-loading').addClass('hidden');
        $('#planning-content').removeClass('hidden');
        renderPlanning(localData);
      }, 200);
    }
  }

  function calculateLocalPlanningData(targetYear) {
    const now = new Date();
    const currentSystemYear = now.getFullYear();
    const currentSystemMonth = now.getMonth() + 1; // 1-12
    const currentSystemDay = now.getDate();

    const parsedYear = targetYear ? parseInt(targetYear, 10) : currentSystemYear;

    const txSource = (typeof currentLoadedTransactions !== 'undefined' && currentLoadedTransactions.length > 0)
      ? currentLoadedTransactions
      : (typeof applyCategoryOverrides === 'function' ? applyCategoryOverrides(GLOBAL_MOCK_TRANSACTIONS || []) : (GLOBAL_MOCK_TRANSACTIONS || []));

    const yearsSet = new Set();
    yearsSet.add(currentSystemYear);

    const validRows = [];
    txSource.forEach(t => {
      if (!t.data) return;
      const parts = String(t.data).split('-');
      const y = parseInt(parts[0], 10);
      const m = parseInt(parts[1], 10);
      const d = parts[2] ? parseInt(parts[2], 10) : 1;
      if (isNaN(y) || isNaN(m)) return;

      yearsSet.add(y);
      if (y === parsedYear) {
        validRows.push({
          origem: t.origem || '',
          descricao: String(t.descricao || '').trim(),
          categoria: String(t.categoria || '').trim() || 'Outros',
          tipo: String(t.tipo || '').trim(),
          valor: parseFloat(t.valor) || 0,
          data: t.data,
          month: m,
          day: d
        });
      }
    });

    const availableYears = Array.from(yearsSet).sort((a, b) => b - a);

    const monthNames = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
    const monthShort = ['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'];

    const monthsMeta = [];
    for (let m = 1; m <= 12; m++) {
      let status = 'realized';
      if (parsedYear < currentSystemYear) {
        status = 'realized';
      } else if (parsedYear > currentSystemYear) {
        status = 'planned';
      } else {
        if (m < currentSystemMonth) status = 'realized';
        else if (m === currentSystemMonth) status = 'current';
        else status = 'planned';
      }
      monthsMeta.push({
        month: m,
        name: monthNames[m - 1],
        shortName: monthShort[m - 1],
        status: status
      });
    }

    const incomeCategoryMap = {};
    const expenseMacroMap = {
      'Fixas': { label: 'Despesas Fixas', months: Array.from({length: 12}, () => ({realized: 0, planned: 0, total: 0})), totalYear: 0, subcategories: {} },
      'Variáveis Essenciais': { label: 'Variáveis Essenciais', months: Array.from({length: 12}, () => ({realized: 0, planned: 0, total: 0})), totalYear: 0, subcategories: {} },
      'Discricionárias': { label: 'Despesas Discricionárias', months: Array.from({length: 12}, () => ({realized: 0, planned: 0, total: 0})), totalYear: 0, subcategories: {} }
    };

    const monthlyTotals = Array.from({length: 12}, () => ({
      incomeRealized: 0,
      incomePlanned: 0,
      incomeTotal: 0,
      expenseRealized: 0,
      expensePlanned: 0,
      expenseTotal: 0,
      monthlyBalance: 0,
      accumulatedBalance: 0,
      status: 'realized'
    }));

    monthsMeta.forEach((mm, idx) => {
      monthlyTotals[idx].status = mm.status;
    });

    validRows.forEach(tx => {
      const mIdx = tx.month - 1;
      if (mIdx < 0 || mIdx > 11) return;

      const mStatus = monthsMeta[mIdx].status;
      let isTxRealized = true;

      if (mStatus === 'realized') {
        isTxRealized = true;
      } else if (mStatus === 'planned') {
        isTxRealized = false;
      } else {
        if (tx.day <= currentSystemDay) {
          isTxRealized = true;
        } else {
          isTxRealized = false;
        }
      }

      const txObj = {
        origem: tx.origem,
        descricao: tx.descricao,
        categoria: tx.categoria,
        tipo: tx.tipo,
        valor: tx.valor,
        data: tx.data,
        isRealized: isTxRealized,
        statusLabel: isTxRealized ? 'Realizado' : 'Previsto'
      };

      if (tx.tipo === 'Entrada') {
        const cat = tx.categoria;
        if (!incomeCategoryMap[cat]) {
          incomeCategoryMap[cat] = {
            label: cat,
            months: Array.from({length: 12}, () => ({realized: 0, planned: 0, total: 0, txs: []})),
            totalYear: 0,
            totalRealized: 0,
            totalPlanned: 0
          };
        }

        if (isTxRealized) {
          incomeCategoryMap[cat].months[mIdx].realized += tx.valor;
          incomeCategoryMap[cat].totalRealized += tx.valor;
          monthlyTotals[mIdx].incomeRealized += tx.valor;
        } else {
          incomeCategoryMap[cat].months[mIdx].planned += tx.valor;
          incomeCategoryMap[cat].totalPlanned += tx.valor;
          monthlyTotals[mIdx].incomePlanned += tx.valor;
        }

        incomeCategoryMap[cat].months[mIdx].total += tx.valor;
        incomeCategoryMap[cat].months[mIdx].txs.push(txObj);
        incomeCategoryMap[cat].totalYear += tx.valor;
        monthlyTotals[mIdx].incomeTotal += tx.valor;

      } else if (tx.tipo === 'Saída') {
        let macro = 'Discricionárias';
        if (typeof getMacroCategory === 'function') {
          macro = getMacroCategory(tx.categoria, tx.descricao);
        }
        if (!expenseMacroMap[macro]) {
          macro = 'Discricionárias';
        }

        const macroObj = expenseMacroMap[macro];
        if (isTxRealized) {
          macroObj.months[mIdx].realized += tx.valor;
          monthlyTotals[mIdx].expenseRealized += tx.valor;
        } else {
          macroObj.months[mIdx].planned += tx.valor;
          monthlyTotals[mIdx].expensePlanned += tx.valor;
        }
        macroObj.months[mIdx].total += tx.valor;
        macroObj.totalYear += tx.valor;
        monthlyTotals[mIdx].expenseTotal += tx.valor;

        const cat = tx.categoria;
        if (!macroObj.subcategories[cat]) {
          macroObj.subcategories[cat] = {
            label: cat,
            macro: macro,
            months: Array.from({length: 12}, () => ({realized: 0, planned: 0, total: 0, txs: []})),
            totalYear: 0,
            totalRealized: 0,
            totalPlanned: 0
          };
        }

        const subCat = macroObj.subcategories[cat];
        if (isTxRealized) {
          subCat.months[mIdx].realized += tx.valor;
          subCat.totalRealized += tx.valor;
        } else {
          subCat.months[mIdx].planned += tx.valor;
          subCat.totalPlanned += tx.valor;
        }
        subCat.months[mIdx].total += tx.valor;
        subCat.months[mIdx].txs.push(txObj);
        subCat.totalYear += tx.valor;
      }
    });

    let runningAccumulated = 0;
    let currentAccumulatedBalance = 0;
    let totalYearIncome = 0;
    let totalYearIncomeRealized = 0;
    let totalYearIncomePlanned = 0;
    let totalYearExpense = 0;
    let totalYearExpenseRealized = 0;
    let totalYearExpensePlanned = 0;

    for (let m = 0; m < 12; m++) {
      const item = monthlyTotals[m];
      totalYearIncome += item.incomeTotal;
      totalYearIncomeRealized += item.incomeRealized;
      totalYearIncomePlanned += item.incomePlanned;

      totalYearExpense += item.expenseTotal;
      totalYearExpenseRealized += item.expenseRealized;
      totalYearExpensePlanned += item.expensePlanned;

      if (item.status === 'realized') {
        item.monthlyBalance = item.incomeRealized - item.expenseRealized;
      } else if (item.status === 'current') {
        item.monthlyBalance = item.incomeTotal - item.expenseTotal;
      } else {
        item.monthlyBalance = (item.incomePlanned || item.incomeTotal) - (item.expensePlanned || item.expenseTotal);
      }

      runningAccumulated += item.monthlyBalance;
      item.accumulatedBalance = runningAccumulated;

      if (item.status === 'realized' || (item.status === 'current' && parsedYear === currentSystemYear)) {
        currentAccumulatedBalance = runningAccumulated;
      }
    }

    const projectedYearEndBalance = runningAccumulated;

    const incomeCategoriesList = Object.values(incomeCategoryMap).sort((a, b) => b.totalYear - a.totalYear);

    const expenseMacrosList = Object.keys(expenseMacroMap).map(macroKey => {
      const mData = expenseMacroMap[macroKey];
      const subcats = Object.values(mData.subcategories).sort((a, b) => b.totalYear - a.totalYear);
      return {
        key: macroKey,
        label: mData.label,
        months: mData.months,
        totalYear: mData.totalYear,
        subcategories: subcats
      };
    });

    return {
      year: parsedYear,
      currentSystemYear: currentSystemYear,
      currentSystemMonth: currentSystemMonth,
      currentSystemDay: currentSystemDay,
      availableYears: availableYears,
      monthsMeta: monthsMeta,
      monthlyTotals: monthlyTotals,
      incomeCategories: incomeCategoriesList,
      expenseMacros: expenseMacrosList,
      summary: {
        totalYearIncome: totalYearIncome,
        totalYearIncomeRealized: totalYearIncomeRealized,
        totalYearIncomePlanned: totalYearIncomePlanned,
        totalYearExpense: totalYearExpense,
        totalYearExpenseRealized: totalYearExpenseRealized,
        totalYearExpensePlanned: totalYearExpensePlanned,
        currentAccumulatedBalance: currentAccumulatedBalance,
        projectedYearEndBalance: projectedYearEndBalance
      }
    };
  }

  function renderPlanning(data) {
    currentPlanningData = data;

    // Atualiza opções do select de anos
    const $yearSelect = $('#planning-year-select');
    const existingYears = $yearSelect.find('option').map(function() { return parseInt($(this).val(), 10); }).get();
    const dataYears = data.availableYears || [data.year];
    
    // Se a lista de anos for diferente, remonta as options
    if (JSON.stringify(existingYears.sort()) !== JSON.stringify(dataYears.sort())) {
      $yearSelect.empty();
      dataYears.forEach(y => {
        $yearSelect.append(`<option value="${y}" ${y === data.year ? 'selected' : ''}>${y}</option>`);
      });
    }
    $yearSelect.val(data.year);
    $('#planning-table-year-label').text(data.year);

    // Atualiza badge com mês atual do sistema
    const currentMonthName = (data.monthsMeta && data.monthsMeta[data.currentSystemMonth - 1]) 
      ? data.monthsMeta[data.currentSystemMonth - 1].name 
      : 'Setembro';
    $('#planning-current-month-badge').html(`
      <span class="w-2 h-2 rounded-full bg-primary animate-pulse inline-block"></span>
      Hoje: ${currentMonthName}/${data.currentSystemYear}
    `);

    // Atualiza Cards de Resumo
    $('#card-planning-income-total').text(formatCurrency(data.summary.totalYearIncome));
    $('#card-planning-income-realized').text(formatCurrency(data.summary.totalYearIncomeRealized));
    $('#card-planning-income-planned').text(formatCurrency(data.summary.totalYearIncomePlanned));

    $('#card-planning-expense-total').text(formatCurrency(data.summary.totalYearExpense));
    $('#card-planning-expense-realized').text(formatCurrency(data.summary.totalYearExpenseRealized));
    $('#card-planning-expense-planned').text(formatCurrency(data.summary.totalYearExpensePlanned));

    $('#card-planning-current-balance').text(formatCurrency(data.summary.currentAccumulatedBalance))
      .removeClass('text-emerald-600 text-red-600 text-gray-900 dark:text-white')
      .addClass(data.summary.currentAccumulatedBalance >= 0 ? 'text-gray-900 dark:text-white' : 'text-red-600');

    $('#card-planning-projected-balance').text(formatCurrency(data.summary.projectedYearEndBalance))
      .removeClass('text-purple-900 text-red-600')
      .addClass(data.summary.projectedYearEndBalance >= 0 ? 'text-purple-900' : 'text-red-600');

    // Atualiza cabeçalho das colunas dos meses com base no ano e status
    $('.planning-th-month').each(function() {
      const m = parseInt($(this).data('month'), 10);
      const meta = data.monthsMeta[m - 1];
      const $badge = $(this).find('.month-badge');
      const $title = $(this).find('div:first-child');

      $(this).removeClass('bg-blue-50/80 dark:!bg-gray-200 ring-2 ring-primary/40 text-primary ring-1');

      if (meta.status === 'realized') {
        $title.removeClass('text-primary text-purple-700 dark:text-purple-300').addClass('text-gray-700 dark:text-slate-300');
        $badge.text('Realizado').removeClass('text-primary text-purple-600 font-bold font-semibold').addClass('text-gray-400 dark:text-slate-500 font-medium');
      } else if (meta.status === 'current') {
        $(this).addClass('bg-blue-50/80 dark:!bg-gray-200 ring-1 ring-primary/40');
        $title.removeClass('text-gray-700 dark:text-slate-300 text-purple-700 dark:text-purple-300 text-primary').addClass('text-black dark:!text-black font-bold');
        $badge.text('Atual').removeClass('text-gray-400 dark:text-slate-500 text-purple-600 text-primary font-medium').addClass('text-black dark:!text-black font-bold');
      } else {
        $title.removeClass('text-gray-700 dark:text-slate-300 text-primary').addClass('text-purple-700 dark:text-purple-300');
        $badge.text('Previsto').removeClass('text-gray-400 dark:text-slate-500 text-primary').addClass('text-purple-600 font-semibold');
      }
    });

    // Renderiza a Matriz da Tabela
    renderPlanningMatrixBody(data);

    // Renderiza Gráficos
    renderPlanningEvolutionChart(data);
    renderPlanningCompositionChart(data);
  }
