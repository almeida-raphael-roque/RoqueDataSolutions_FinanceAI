<script>

// Helper to parse dates safely without timezone shifts or 2-digit/omitted year bugs
  function parseLocalDateString(dateStr, fallbackYear) {
    if (!dateStr && dateStr !== 0) return new Date();
    const targetYr = (fallbackYear !== undefined && fallbackYear !== 'all' && parseInt(fallbackYear, 10))
      ? parseInt(fallbackYear, 10)
      : (typeof currentPlanningYear !== 'undefined' ? currentPlanningYear : new Date().getFullYear());
    
    if (dateStr instanceof Date) {
      if (isNaN(dateStr.getTime())) return new Date();
      let y = dateStr.getFullYear();
      if (y < 100) dateStr.setFullYear(y + 2000);
      if ((y === 2001 || y === 1926) && targetYr !== y) dateStr.setFullYear(targetYr);
      return dateStr;
    }

    let s = String(dateStr).trim();
    if (!s) return new Date();
    
    // Normalize dots to slashes if formatted as DD.MM.YYYY or DD.MM
    if (/^\d{1,2}\.\d{1,2}(\.\d{2,4})?$/.test(s)) {
      s = s.replace(/\./g, '/');
    }

    const datePart = s.indexOf('T') !== -1 ? s.split('T')[0] : s;
    if (datePart.includes('/')) {
      const ptParts = datePart.split('/');
      if (ptParts.length === 3) {
        let y = parseInt(ptParts[2], 10);
        if (y < 100) y += 2000;
        return new Date(y, parseInt(ptParts[1], 10) - 1, parseInt(ptParts[0], 10));
      } else if (ptParts.length === 2) {
        // "04/09" -> 4th of September
        return new Date(targetYr, parseInt(ptParts[1], 10) - 1, parseInt(ptParts[0], 10));
      }
    }

    const parts = datePart.split('-');
    if (parts.length === 3) {
      if (parts[0].length === 4) {
        return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
      } else {
        let y = parseInt(parts[2], 10);
        if (y < 100) y += 2000;
        return new Date(y, parseInt(parts[1], 10) - 1, parseInt(parts[0], 10));
      }
    } else if (parts.length === 2) {
      // "04-09"
      return new Date(targetYr, parseInt(parts[1], 10) - 1, parseInt(parts[0], 10));
    }

    const parsed = new Date(dateStr);
    if (!isNaN(parsed.getTime())) {
      let y = parsed.getFullYear();
      if (y < 100) parsed.setFullYear(y + 2000);
      if ((y === 2001 || y === 1926) && targetYr !== y) parsed.setFullYear(targetYr);
      return parsed;
    }
    return new Date();
  }

<script>
  window.deletePlanningCategory = function(nameOrElem, optYear) {
    let name = '';
    let year = optYear || (typeof currentPlanningYear !== 'undefined' ? currentPlanningYear : (typeof getActivePlanningYear === 'function' ? getActivePlanningYear() : new Date().getFullYear()));
    if (typeof nameOrElem === 'string') {
      name = decodeURIComponent(nameOrElem).trim();
    } else if (nameOrElem && nameOrElem.getAttribute) {
      name = decodeURIComponent(nameOrElem.getAttribute('data-cat') || '').trim();
      const yAttr = nameOrElem.getAttribute('data-year');
      if (yAttr) year = parseInt(yAttr, 10);
    } else if (nameOrElem && typeof $ !== 'undefined' && $(nameOrElem).length) {
      name = decodeURIComponent($(nameOrElem).attr('data-cat') || '').trim();
      const yAttr = $(nameOrElem).attr('data-year');
      if (yAttr) year = parseInt(yAttr, 10);
    }
    if (!name) return;
    const catName = name;
    
    if (!confirm("Tem certeza que deseja excluir a linha '" + catName + "' da matriz de planejamento de " + year + "?\n\n(A linha será removida exclusivamente para o ano " + year + ")")) return;
    
    // 1. Salva a exclusão para o ano selecionado
    const isSal = catName.toUpperCase().includes('SALARIO') || catName.toLowerCase().includes('salário');
    if (isSal) {
      savePlanningExcludedCategory(year, 'SALARIO');
      try { localStorage.removeItem('fin_ally_salario_restored_' + year); } catch(e) {}
    } else {
      savePlanningExcludedCategory(year, catName);
    }

    function normCat(s) {
      return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
    }
    const targetNorm = normCat(catName);
    const targetLower = catName.toLowerCase();

    // 2. Remove imediatamente do cache em memória para este ano
    const cleanCache = (d) => {
      if (!d) return;
      if (d.incomeCategories) {
        Object.keys(d.incomeCategories).forEach(k => {
          if (k.trim().toLowerCase() === targetLower || normCat(k) === targetNorm) {
            delete d.incomeCategories[k];
          }
        });
      }
      if (d.expenseMacros) {
        ['Fixas', 'Variáveis Essenciais', 'Discricionárias'].forEach(macro => {
          if (d.expenseMacros[macro]) {
            Object.keys(d.expenseMacros[macro]).forEach(k => {
              if (k.trim().toLowerCase() === targetLower || normCat(k) === targetNorm) {
                delete d.expenseMacros[macro][k];
              }
            });
          }
        });
      }
    };

    if (typeof planningDataCacheByYear !== 'undefined' && planningDataCacheByYear && planningDataCacheByYear[year]) {
      cleanCache(planningDataCacheByYear[year]);
    }
    if (typeof planningDataCache !== 'undefined' && planningDataCache && planningDataCache.year === year) {
      cleanCache(planningDataCache);
    }

    // 3. Remove a linha imediatamente da visualização no DOM
    $('.btn-delete-planning-cat').filter(function() {
      const c = decodeURIComponent($(this).attr('data-cat') || '');
      return c.trim().toLowerCase() === targetLower || normCat(c) === targetNorm;
    }).closest('tr').remove();

    if (typeof showRefreshToast === 'function') {
      showRefreshToast(`Linha "${catName}" excluída do planejamento de ${year}.`);
    }

    // 4. Re-aplica overrides e renderiza
    if (typeof planningDataCacheByYear !== 'undefined' && planningDataCacheByYear && planningDataCacheByYear[year]) {
      applyPlanningOverrides(planningDataCacheByYear[year]);
      renderPlanning(planningDataCacheByYear[year]);
    } else {
      loadPlanning(year);
    }
  };

  window.deleteCategory = function(nameOrElem) {
    if (nameOrElem && (
      (nameOrElem.classList && nameOrElem.classList.contains('btn-delete-planning-cat')) ||
      (typeof $ !== 'undefined' && $(nameOrElem).closest('#planning-matrix-container, .planning-table, .planning-child-cat').length)

      return window.deletePlanningCategory(nameOrElem);
    }
    let name = '';
    if (typeof nameOrElem === 'string') {
      name = decodeURIComponent(nameOrElem).trim();
    } else if (nameOrElem && nameOrElem.getAttribute) {
      name = decodeURIComponent(nameOrElem.getAttribute('data-cat') || '').trim();
    } else if (nameOrElem && typeof $ !== 'undefined' && $(nameOrElem).length) {
      name = decodeURIComponent($(nameOrElem).attr('data-cat') || '').trim();
    }
    if (!name) return;
    const catName = name;
    if (!confirm("Tem certeza que deseja excluir a categoria '" + catName + "'? A linha será excluída do planejamento, e suas regras e previsões associadas serão removidas.")) return;
    
    // 1. Remove localmente de GLOBAL_CATEGORIES
    if (typeof GLOBAL_CATEGORIES !== 'undefined') {
      GLOBAL_CATEGORIES = GLOBAL_CATEGORIES.filter(c => c.name.toLowerCase() !== catName.toLowerCase());
      if (typeof saveCategoriesToStorage === 'function') saveCategoriesToStorage();
    }

    // 2. Remove de GLOBAL_RULES
    if (typeof GLOBAL_RULES !== 'undefined') {
      GLOBAL_RULES = GLOBAL_RULES.filter(r => (r.category || '').toLowerCase() !== catName.toLowerCase());
      if (typeof saveRulesToStorage === 'function') saveRulesToStorage();
    }

    // 3. Reclassifica transações existentes em memória para 'Outros' para não ressuscitar a linha na matriz
    const reclassifyTxs = (arr) => {
      if (Array.isArray(arr)) {
        arr.forEach(t => {
          if (String(t.categoria || '').trim().toLowerCase() === catName.toLowerCase()) {
            t.categoria = 'Outros';
          }
        });
      }
    };
    if (typeof currentLoadedTransactions !== 'undefined') reclassifyTxs(currentLoadedTransactions);
    if (typeof GLOBAL_MOCK_TRANSACTIONS !== 'undefined') reclassifyTxs(GLOBAL_MOCK_TRANSACTIONS);

    // 4. Limpa overrides manuais de transação associados à categoria
    if (typeof MANUAL_TX_OVERRIDES !== 'undefined') {
      Object.keys(MANUAL_TX_OVERRIDES).forEach(k => {
        if (String(MANUAL_TX_OVERRIDES[k] || '').trim().toLowerCase() === catName.toLowerCase()) {
          delete MANUAL_TX_OVERRIDES[k];
        }
      });
      try { localStorage.setItem('fin_ally_manual_tx_overrides', JSON.stringify(MANUAL_TX_OVERRIDES)); } catch(e) {}
    }

    // 5. Remove de previsões salvas (fin_ally_planning_forecasts)
    try {
      const fcRaw = localStorage.getItem('fin_ally_planning_forecasts');
      if (fcRaw) {
        const fcObj = JSON.parse(fcRaw);
        Object.keys(fcObj).forEach(y => {
          if (fcObj[y]) {
            Object.keys(fcObj[y]).forEach(k => {
              if (k.trim().toLowerCase() === catName.toLowerCase()) {
                delete fcObj[y][k];
              }
            });
          }
        });
        localStorage.setItem('fin_ally_planning_forecasts', JSON.stringify(fcObj));
      }
    } catch(e) {}

    // 6. Remove de edições manuais (fin_ally_planning_overrides)
    try {
      const ovRaw = localStorage.getItem('fin_ally_planning_overrides');
      if (ovRaw) {
        const ovObj = JSON.parse(ovRaw);
        Object.keys(ovObj).forEach(y => {
          if (ovObj[y]) {
            Object.keys(ovObj[y]).forEach(k => {
              if (k.trim().toLowerCase() === catName.toLowerCase()) {
                delete ovObj[y][k];
              }
            });
          }
        });
        localStorage.setItem('fin_ally_planning_overrides', JSON.stringify(ovObj));
      }
    } catch(e) {}

    // 7. Remove imediatamente do cache da matriz de planejamento
    if (typeof planningDataCache !== 'undefined' && planningDataCache) {
      if (planningDataCache.incomeCategories) {
        Object.keys(planningDataCache.incomeCategories).forEach(k => {
          if (k.trim().toLowerCase() === catName.toLowerCase()) {
            delete planningDataCache.incomeCategories[k];
          }
        });
      }
      if (planningDataCache.expenseMacros) {
        ['Fixas', 'Variáveis Essenciais', 'Discricionárias'].forEach(macro => {
          if (planningDataCache.expenseMacros[macro]) {
            Object.keys(planningDataCache.expenseMacros[macro]).forEach(k => {
              if (k.trim().toLowerCase() === catName.toLowerCase()) {
                delete planningDataCache.expenseMacros[macro][k];
              }
            });
          }
        });
      }
    }

    // 8. Remove a linha imediatamente da tabela visual no DOM
    $('.btn-delete-planning-cat').filter(function() {
      const c = decodeURIComponent($(this).attr('data-cat') || $(this).data('cat') || '');
      return c.trim().toLowerCase() === catName.toLowerCase();
    }).closest('tr').remove();

    if (typeof showRefreshToast === 'function') {
      showRefreshToast(`Categoria "${catName}" excluída.`);
    }

    // 9. Sincroniza com backend e recarrega
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function() {
          invalidateCache();
          if (typeof renderCategoriesList === 'function') renderCategoriesList();
          loadPlanning();
        })
        .withFailureHandler(function(err) {
          console.warn("Aviso ao excluir categoria no backend: " + (err ? err.message : err));
          invalidateCache();
          if (typeof renderCategoriesList === 'function') renderCategoriesList();
          loadPlanning();
        })
        .deleteCategory(catName);
    } else {
      setTimeout(() => {
        invalidateCache();
        if (typeof renderCategoriesList === 'function') renderCategoriesList();
        loadPlanning();
      }, 200);
    }
  };

  window.editCategoryFromPlanning = function(target) {
    if(!target) return;
    let name = '';
    if (typeof target === 'string') {
      name = decodeURIComponent(target).trim();
    } else if (target.getAttribute) {
      name = decodeURIComponent(target.getAttribute('data-cat') || '').trim();

      name = decodeURIComponent($(target).attr('data-cat') || '').trim();
    }
    if (!name) return;

    // Ensure modal is attached to body so it cannot be hidden by any hidden-page container
    if ($('#category-modal').length && $('#category-modal').closest('.hidden-page').length > 0) {
      $('body').append($('#category-modal'));
    }

    let cat = (typeof GLOBAL_CATEGORIES !== 'undefined') ? GLOBAL_CATEGORIES.find(c => c.name.toLowerCase() === name.toLowerCase()) : null;
    
    if (!cat) {
      let inferredProfile = 'Despesa Discricionária';
      if (typeof planningDataCache !== 'undefined' && planningDataCache) {
        if (planningDataCache.incomeCategories && planningDataCache.incomeCategories[name]) {
          inferredProfile = 'Receita Fixa';
        } else if (planningDataCache.expenseMacros) {
          if (planningDataCache.expenseMacros['Fixas'] && planningDataCache.expenseMacros['Fixas'][name]) {
            inferredProfile = 'Despesa Fixa';
          } else if (planningDataCache.expenseMacros['Variáveis Essenciais'] && planningDataCache.expenseMacros['Variáveis Essenciais'][name]) {
            inferredProfile = 'Despesa Variável';
          } else if (planningDataCache.expenseMacros['Discricionárias'] && planningDataCache.expenseMacros['Discricionárias'][name]) {
            inferredProfile = 'Despesa Discricionária';
          }
        }
      }
      cat = {
        id: Date.now(),
        name: name,
        profile: inferredProfile
      };
      if (typeof GLOBAL_CATEGORIES !== 'undefined') {
        GLOBAL_CATEGORIES.push(cat);
        saveCategoriesToStorage();
      }
    }
    
    $('#category-modal-id').val(cat.id);
    $('#cat-name').val(cat.name);
    $('#cat-profile').val(cat.profile || 'Despesa Discricionária');
    $('#category-modal-title').html('<i class="fa-solid fa-pen-to-square text-primary text-base"></i><span>Editar Categoria</span>');
    $('#btn-delete-category-modal').removeClass('hidden');
    $('#category-modal').removeClass('hidden');
    setTimeout(() => $('#cat-name').focus(), 100);
  };


  function toggleAllMacros(expand) {
    $('.planning-toggle-row').each(function() {
      const targetClass = $(this).data('target');
      const icon = $(this).find('i.fa-chevron-down');
      
      // Select the child rows (we target by the class)
      const children = $('.' + targetClass);
      
      if (!children.length) return;
      
      const isHidden = children.first().hasClass('hidden');
      
      if (expand && isHidden) {
        children.removeClass('hidden');
        icon.css('transform', 'rotate(-180deg)');
      } else if (!expand && !isHidden) {
        children.addClass('hidden');
        icon.css('transform', 'rotate(0deg)');
      }
    });
  }

  // Intelligent Normalization and Matching Functions
  function normalizeDescription(desc) {
    if (!desc) return "";
    let d = String(desc).toUpperCase();
    // Remove dates and times
    d = d.replace(/\b\d{1,2}[A-Z]{3}\b/g, ''); // 20Abr
    d = d.replace(/\b\d{2}H\d{2}MIN\b/g, ''); // 16h24min
    d = d.replace(/\b\d{2}\/\d{2}\/\d{4}\b/g, ''); // 10/10/2026
    // Remove common transaction prefixes
    d = d.replace(/^PAG\*\s*/, '');
    d = d.replace(/^COMPRA\s*/, '');
    d = d.replace(/^PIX\s*(ENVIADO|RECEBIDO)?\s*/, '');
    d = d.replace(/^DOC\s*/, '');
    d = d.replace(/^TED\s*/, '');
    // Remove common noise
    d = d.replace(/ PIX /g, ' ');
    d = d.replace(/ ENVIADO PARA /g, ' ');
    d = d.replace(/ RECEBIDO DE /g, ' ');
    d = d.replace(/ COMPRA APROVADA /g, ' ');
    d = d.replace(/\bLTDA\b/g, '');
    d = d.replace(/\bS\.A\.\b/g, '');
    d = d.replace(/\bS\/A\b/g, '');
    d = d.replace(/\bSAO PAULO\b/g, '');
    d = d.replace(/\bSP\b/g, ' ');
    d = d.replace(/\bGOIANIA\b/g, '');
    d = d.replace(/\bBRASILIA\b/g, '');
    d = d.replace(/\bBRA\b/g, '');
    // Remove special characters and collapse whitespaces
    d = d.replace(/[^A-Z0-9 ]/g, ' ');
    d = d.replace(/\s+/g, ' ').trim();
    return d;
  }

  function navigateTo(pageId, title) {
    $('.page-view').addClass('hidden-page');
    $('#' + pageId).removeClass('hidden-page');
    $('#page-title').text(title);
    
    // Update active state in sidebar
    $('.nav-item').removeClass('bg-gray-800 border-l-4 border-primary text-white').addClass('text-gray-400 dark:text-slate-500 border-transparent hover:bg-gray-800/50');
    $(`[data-target="${pageId}"]`).removeClass('text-gray-400 dark:text-slate-500 border-transparent hover:bg-gray-800/50').addClass('bg-gray-800 border-l-4 border-primary text-white');
    
    // Toggle global filters
    if (pageId === 'page-categories') {
      $('#global-filters').removeClass('md:flex').addClass('!hidden');
    } else if (pageId === 'page-planning') {
      $('#global-filters').removeClass('!hidden').addClass('md:flex');
      $('#filter-month').addClass('!hidden');
      $('#filter-year').removeClass('!hidden');
      const curYr = parseInt($('#filter-year').val(), 10);
      if (isNaN(curYr) || curYr <= 2000) {
        $('#filter-year').val(new Date().getFullYear());
      }
    } else {
      $('#global-filters').removeClass('!hidden').addClass('md:flex');
      $('#filter-month').removeClass('!hidden');
      $('#filter-year').removeClass('!hidden');
    }

    // Only load if not loaded yet
    if (!pageLoadStates[pageId]) {
      if(pageId === 'page-dashboard') loadDashboard();
      if(pageId === 'page-transactions') loadTransactions();
      if(pageId === 'page-planning') loadPlanning(getActivePlanningYear());
      if(pageId === 'page-categories') loadCategoriesPage();
      if(pageId === 'page-spending-control' && typeof loadSpendingControl === 'function') loadSpendingControl();
      pageLoadStates[pageId] = true;
    }
  }

        for (let m = 1; m <= 12; m++) {

          itemsToSave.push({

            valor,
            data: `${year}-${mStr}-${dStr}`
          });

    // Helper to download base64
    function downloadBase64File(base64Data, mimeType, fileName) {
      const byteCharacters = atob(base64Data);
      const byteNumbers = new Array(byteCharacters.length);
      for (let i = 0; i < byteCharacters.length; i++) {
        byteNumbers[i] = byteCharacters.charCodeAt(i);
      }
      const byteArray = new Uint8Array(byteNumbers);
      const blob = new Blob([byteArray], {type: mimeType});
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.style.display = 'none';
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      window.URL.revokeObjectURL(url);
      document.body.removeChild(a);
    }

    function extractSpreadsheetIdClient(input) {
      if (!input) return null;
      const str = String(input).trim();
      const match = str.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/i);
      if (match && match[1]) {
        return match[1];
      }
      if (/^[a-zA-Z0-9-_]{20,}$/.test(str)) {
        return str;
      }
      return null;
    }

    function updateLinkedSheetUI(info) {
      if (!info) return;
      const id = info.id || DEFAULT_SHEET_ID;
      const isCustom = Boolean(info.isCustom && id !== DEFAULT_SHEET_ID);
      const title = info.title || (isCustom ? 'Planilha Personalizada' : 'Planilha Principal');

      if (!isCustom) {
        $('#btn-restore-default-sheet').addClass('hidden');

        $('#btn-restore-default-sheet').removeClass('hidden');
      }
    }

      const savedId = localStorage.getItem('user_spreadsheet_id') || DEFAULT_SHEET_ID;
      const savedUrl = localStorage.getItem('user_spreadsheet_url') || DEFAULT_SHEET_URL;
      const isCustom = (savedId !== DEFAULT_SHEET_ID);
      
      updateLinkedSheetUI({
        id: savedId,
        url: savedUrl,
        title: isCustom ? 'Planilha Conectada do Usuário' : 'Planilha Principal',
        isCustom: isCustom
      });

      if (typeof google !== 'undefined' && google.script && google.script.run) {

            if (serverInfo) {
              if (serverInfo.isCustom) {

    function processImportFile(file) {
      $('#import-step-1').addClass('hidden');
      $('#import-step-2').removeClass('hidden');

      const reader = new FileReader();
      reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        let workbook;
        try {
          workbook = XLSX.read(data, {type: 'array'});
        } catch (err) {
          alert('Erro ao ler arquivo: ' + err.message);
          resetImportModal();
          return;
        }

        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        let json = XLSX.utils.sheet_to_json(worksheet, {header: 1, raw: false, dateNF: 'dd/mm/yyyy'});
        
        if(json.length < 2) {
          alert("O arquivo parece estar vazio ou sem dados.");
          resetImportModal();
          return;
        }

        analyzeAndCategorize(json);
      };
      reader.readAsArrayBuffer(file);
    }

    function analyzeAndCategorize(rows) {
      const headerRow = rows[0].map(h => String(h).toUpperCase().trim());
      
      // Detect column indices
      const idxData = headerRow.findIndex(h => h.includes('DATA'));
      const idxValor = headerRow.findIndex(h => h.includes('VALOR') || h.includes('R$'));
      const idxTipo = headerRow.findIndex(h => h.includes('TIPO') || h.includes('ENTRADA') || h.includes('SAÍDA'));
      const idxDesc = headerRow.findIndex(h => h.includes('DESCRI') || h.includes('HISTÓRICO'));
      const idxCat = headerRow.findIndex(h => h.includes('CATEGORIA'));

      if (idxData === -1 || idxValor === -1 || idxDesc === -1) {
        alert("Não foi possível identificar automaticamente as colunas (Data, Valor, Descrição). Certifique-se de que o arquivo contém cabeçalhos.");
        resetImportModal();
        return;
      }

      const parsedTransactions = [];
      
      for(let i=1; i<rows.length; i++) {
        const row = rows[i];
        if(!row || row.length === 0 || !row[idxData]) continue;
        
        let dataStr = String(row[idxData]).trim();
        // simple date normalizer assuming DD/MM/YYYY or DD/MM/YY
        let isoDate = dataStr;
        if(dataStr.includes('/')) {
          let p = dataStr.split('/');
          if(p.length === 3) {
            let year = p[2];
            if(year.length === 2) year = '20' + year; // handle YY
            isoDate = `${year}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;
          }
        } else if (dataStr.includes('-')) {
          let p = dataStr.split('-');
          if(p.length === 3 && p[0].length === 4) {
             isoDate = dataStr; // already YYYY-MM-DD
          } else if (p.length === 3 && p[2].length === 4) {
             isoDate = `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`; // DD-MM-YYYY
          }
        }

        let valStr = String(row[idxValor]).replace('R$', '').replace(/\s/g, '');
        // handle pt-br decimals 1.200,50 -> 1200.50
        if(valStr.includes(',') && valStr.includes('.')) {
          valStr = valStr.replace(/\./g, '').replace(',', '.');
        } else if (valStr.includes(',')) {
          valStr = valStr.replace(',', '.');
        }
        const valor = parseFloat(valStr) || 0;
        
        let rawDesc = row[idxDesc] || '';
        let normDesc = normalizeDescription(rawDesc);
        
        let tipo = idxTipo > -1 ? row[idxTipo] : '';
        tipo = String(tipo).toUpperCase();
        if(tipo.includes('ENTRADA') || tipo.includes('RECEITA') || tipo.includes('CREDITO')) tipo = 'Entrada';
        else if(tipo.includes('SAÍDA') || tipo.includes('DESPESA') || tipo.includes('DEBITO')) tipo = 'Saída';
        else tipo = valor > 0 ? 'Entrada' : 'Saída'; // Guess by positive/negative if no column
        
        let valorFinal = Math.abs(valor); // store positive
        
        let categoria = idxCat > -1 ? row[idxCat] : '';
        if (categoria) categoria = String(categoria).trim();

        let confianca = 'alta';
        let origem = 'Arquivo';
        
        if (!categoria) {
           // 1. Try Custom User Rules
           let ruleMatch = GLOBAL_RULES.find(r => normDesc.includes(r.pattern) || String(rawDesc).toUpperCase().includes(r.pattern));
           if(ruleMatch) {
             const matchedCat = GLOBAL_CATEGORIES.find(c => c.id == ruleMatch.categoryId);
             categoria = matchedCat ? matchedCat.name : 'Outros';
             normDesc = ruleMatch.clean; // update to clean description!
             origem = 'Usuário';
             confianca = 'alta';
           } else {
             // 2. Try System Rules
             let intelligentMatch = getIntelligentSystemMatch(rawDesc, normDesc);
             if (intelligentMatch) {
               categoria = intelligentMatch.category;
               normDesc = intelligentMatch.cleanDesc;
               origem = 'Sistema';
               confianca = 'alta';
               
               const catLower = categoria.toLowerCase();
               let existingCat = GLOBAL_CATEGORIES.find(c => c.name.toLowerCase() === catLower);
               if (!existingCat) {
                   const newProfile = tipo === 'Entrada' ? 'Receita Variável' : 'Despesa Discricionária';
                   existingCat = {
                       id: Date.now() + Math.random(),
                       name: categoria,
                       profile: newProfile
                   };
                   GLOBAL_CATEGORIES.push(existingCat);
                   saveCategoriesToStorage();
                   if(typeof renderCategoriesList === 'function') renderCategoriesList();
                   if(typeof populateRuleCategorySelect === 'function') populateRuleCategorySelect();
               }
               categoria = existingCat.name;
             } else {
               // 3. Fallback / AI Mock
               categoria = 'Revisar';
               origem = 'IA Sugestão';
               confianca = 'baixa';
             }
           }
        } else {
           origem = 'Arquivo';
           const catLower = categoria.toLowerCase();
           let existingCat = GLOBAL_CATEGORIES.find(c => c.name.toLowerCase() === catLower);
           if (!existingCat) {
               const newProfile = tipo === 'Entrada' ? 'Receita Variável' : 'Despesa Discricionária';
               existingCat = {
                   id: Date.now() + Math.random(),
                   name: categoria,
                   profile: newProfile
               };
               GLOBAL_CATEGORIES.push(existingCat);
               
               // Update UI components that rely on the global category list
               if(typeof renderCategoriesList === 'function') renderCategoriesList();
               if(typeof populateRuleCategorySelect === 'function') populateRuleCategorySelect();
           }
           categoria = existingCat.name;
        }

        parsedTransactions.push({
          data: isoDate,
          valor: valorFinal,
          tipo: tipo,
          descricao: rawDesc,
          normDesc: normDesc,
          categoria: categoria,
          origem: origem,
          confianca: confianca
        });
      }

      pendingImport = parsedTransactions;
      renderImportReview();
    }

              </label>

               ${originHtml}

      $('#import-review-body').html(html);

  // Loaders
  function getDashboardData() {
    $('#dashboard-loading').show();
    $('#dashboard-content').hide();
    
    const year = $('#filter-year').val();
    const month = $('#filter-month').val();
    
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(data) {
          $('#dashboard-loading').hide();
          $('#dashboard-content').show();
          renderDashboard(data);
        })
        .withFailureHandler(function(error) {
          $('#dashboard-loading').hide();
        })
        .getDashboardData(year, month);
    } else {
      setTimeout(() => {
        $('#dashboard-loading').hide();
        $('#dashboard-content').show();
        // Mock for local testing
        let income = 0;
        let expense = 0;
        const temporalData = {};
        const categoryGrouped = {};
        const categoryBreakdown = {};
        const incomeCategoryGrouped = {};
        const macroGrouped = {
          'Fixas': 0,
          'Variáveis Essenciais': 0,
          'Discricionárias': 0
        };

        const MACRO_COLORS = {
          'Fixas': '#991b1b',
          'Variáveis Essenciais': '#ef4444',
          'Discricionárias': '#f87171'
        };

        GLOBAL_MOCK_TRANSACTIONS.forEach(t => {
          const parts = String(t.data).split('-');
          const tYear = parts[0];
          const tMonth = parseInt(parts[1], 10).toString();
          const mNum = tMonth.padStart(2, '0');
          
          const matchYear = year === 'all' || year === tYear;
          const matchMonth = month === 'all' || parseInt(month) === parseInt(tMonth);
          
          if (matchYear) {
             const key = `${tYear}-${mNum}`;
             const label = `${mNum}/${tYear}`;
             if (!temporalData[key]) temporalData[key] = { label, sortKey: key, income: 0, expense: 0 };
             if (t.tipo === 'Entrada') temporalData[key].income += t.valor;
             if (t.tipo === 'Saída') temporalData[key].expense += t.valor;
          }

          if (matchYear && matchMonth) {
             if (t.tipo === 'Entrada') {
               income += t.valor;
               if (!incomeCategoryGrouped[t.categoria]) incomeCategoryGrouped[t.categoria] = 0;
               incomeCategoryGrouped[t.categoria] += t.valor;
             }
             if (t.tipo === 'Saída') {
               expense += t.valor;
               const macro = getMacroCategory(t.categoria, t.descricao);
               macroGrouped[macro] += t.valor;
               
               if (!categoryGrouped[t.categoria]) categoryGrouped[t.categoria] = { value: 0, macros: { 'Fixas': 0, 'Variáveis Essenciais': 0, 'Discricionárias': 0 } };
               categoryGrouped[t.categoria].value += t.valor;
               categoryGrouped[t.categoria].macros[macro] += t.valor;
               
               if (!categoryBreakdown[t.categoria]) categoryBreakdown[t.categoria] = {};
               if (!categoryBreakdown[t.categoria][t.descricao]) categoryBreakdown[t.categoria][t.descricao] = { value: 0, macro: macro };
               categoryBreakdown[t.categoria][t.descricao].value += t.valor;
             }
          }
        });

        const mockChartData = Object.values(temporalData).sort((a,b) => a.sortKey.localeCompare(b.sortKey));
        
        const mockCategoryData = Object.keys(categoryGrouped).map(k => {
           const catData = categoryGrouped[k];
           const dominantMacro = Object.keys(catData.macros).reduce((a, b) => catData.macros[a] > catData.macros[b] ? a : b);
           const breakdownObj = categoryBreakdown[k];
           const breakdownArray = Object.keys(breakdownObj).map(desc => ({
             label: desc, value: breakdownObj[desc].value, color: MACRO_COLORS[breakdownObj[desc].macro]
           })).sort((a,b) => b.value - a.value);
           
           return { label: k, value: catData.value, color: MACRO_COLORS[dominantMacro], macro: dominantMacro, breakdown: breakdownArray };
        }).sort((a, b) => b.value - a.value);

        const mockIncomeCategoryData = Object.keys(incomeCategoryGrouped).map(k => ({
          label: k, value: incomeCategoryGrouped[k]
        })).sort((a,b) => b.value - a.value);

        const mockMacroData = Object.keys(macroGrouped).map(k => ({
          label: k, value: macroGrouped[k], color: MACRO_COLORS[k]
        })).filter(d => d.value > 0).sort((a,b) => b.value - a.value);

        let mockRawExpenses = GLOBAL_MOCK_TRANSACTIONS
          .filter(t => t.tipo === "Saída")
          .map(t => {
            const parts = t.data.split('-');
            return {
              date: new Date(parts[0], parseInt(parts[1])-1, parts[2]).getTime(),
              desc: t.descricao,
              value: t.valor
            }
          });

        renderDashboard({ 
          balance: income - expense, 
          income: income, 
          expense: expense, 
          chartData: mockChartData,
          categoryChartData: mockCategoryData,
          incomeCategoryChartData: mockIncomeCategoryData,
          macroChartData: mockMacroData,
          rawExpenses: mockRawExpenses
        });
      }, 500);
    }
  }

  let rawExpensesData = [];
  let activeMacroFilter = null;

  function renderDashboard(data) {
    $('#balance-amount').text(formatCurrency(data.balance));
    $('#income-amount').text(formatCurrency(data.income));
    $('#expense-amount').text(formatCurrency(data.expense));
    
    if (data.rawExpenses) {
      rawExpensesData = data.rawExpenses;
    }
    
    if (data.chartData) {
      renderEvolutionChart(data.chartData);
    }
    if (data.categoryChartData) {
      currentExpenseData = data.categoryChartData;
      activeMacroFilter = null; // reset filter on new data load
      renderCategoryChart(data.categoryChartData);
    }
    if (data.incomeCategoryChartData) {
      renderIncomeCategoryChart(data.incomeCategoryChartData);
    }
    if (data.macroChartData) {
      renderMacroChart(data.macroChartData);
    }
  }
  
  function isCurrentDarkMode() {
    return $('html').hasClass('dark');
  }

  function getBarDatalabelsConfig() {
    return {
      display: function(context) {
        const val = context.dataset.data[context.dataIndex];
        return typeof val === 'number' && val > 0;
      },
      anchor: 'end',
      align: function(context) {
        const chart = context.chart;
        const val = context.dataset.data[context.dataIndex] || 0;
        const xScale = chart.scales.x;
        if (xScale) {
          const pixelWidth = Math.abs(xScale.getPixelForValue(val) - xScale.getPixelForValue(0));
          return pixelWidth >= 90 ? 'start' : 'end';
        }
        const maxVal = Math.max(...context.dataset.data.map(v => Number(v) || 0));
        return (maxVal > 0 && (val / maxVal) >= 0.28) ? 'start' : 'end';
      },
      offset: 6,
      color: function(context) {
        const chart = context.chart;
        const val = context.dataset.data[context.dataIndex] || 0;
        const xScale = chart.scales.x;
        const isDark = isCurrentDarkMode();
        if (xScale) {
          const pixelWidth = Math.abs(xScale.getPixelForValue(val) - xScale.getPixelForValue(0));
          if (pixelWidth >= 90) {
            return '#ffffff';
          }
        } else {
          const maxVal = Math.max(...context.dataset.data.map(v => Number(v) || 0));
          if (maxVal > 0 && (val / maxVal) >= 0.28) {
            return '#ffffff';
          }
        }
        return isDark ? '#ffffff' : '#1e293b';
      },
      font: { family: 'Inter, sans-serif', weight: '600', size: 11 },
      formatter: function(value) {
        if (!value) return '';
        return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
      }
    };
  }

  function getBarTooltipConfig() {
    return {
      backgroundColor: 'rgba(17, 24, 39, 0.95)',
      titleFont: { family: 'Inter, sans-serif', size: 13, weight: '600' },
      bodyFont: { family: 'Inter, sans-serif', size: 13 },
      padding: 12,
      cornerRadius: 8,
      callbacks: {
        label: function(context) {
          const dataset = context.chart.data.datasets[0];
          const total = dataset.data.reduce((acc, curr) => acc + (Number(curr) || 0), 0);
          const value = context.parsed.x;
          const pct = total > 0 ? ((value / total) * 100).toFixed(1) + '%' : '0%';
          const formattedVal = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
          return ` ${formattedVal} (${pct} do total)`;
        }
      }
    };
  }

  function getBarScalesConfig() {
    const isDark = isCurrentDarkMode();
    return {
      x: {
        beginAtZero: true,
        grace: '20%',
        grid: {
          borderDash: [4, 4],
          color: isDark ? 'rgba(51, 65, 85, 0.4)' : '#f3f4f6'
        },
        ticks: {
          font: { family: 'Inter, sans-serif' },
          color: isDark ? '#cbd5e1' : '#6b7280',
          callback: function(value) {
            if (value >= 1000) return 'R$ ' + (value / 1000) + 'k';
            return 'R$ ' + value;
          }
        }
      },
      y: {
        grid: { display: false },
        ticks: {
          font: { family: 'Inter, sans-serif', weight: '500' },
          color: isDark ? '#ffffff' : '#374151',
          padding: 8
        }
      }
    };
  }

                return 'R$ ' + value;
              }
            }
          },

            grid: { display: false },
            ticks: { font: { family: 'Inter, sans-serif' }, color: isDark ? '#cbd5e1' : '#6b7280' }
          }
        }
      }

  function renderCategoryChart(categoryData, isDrilldown = false, parentLabel = '') {
    const ctx = document.getElementById('categoryChart');
    if (!ctx) return;
    
    if (categoryChartInstance) {
      categoryChartInstance.destroy();
    }
    
    if (isDrilldown) {
      $('#btn-back-expense').removeClass('hidden');
      $('#title-expense-chart').text(parentLabel);
    } else {
      $('#btn-back-expense').addClass('hidden');
      if (activeMacroFilter) {
        $('#title-expense-chart').text('Despesas por Categoria (' + activeMacroFilter + ')');
      } else {
        $('#title-expense-chart').text('Despesas por Categoria');
      }
    }
    
    if (!categoryData || categoryData.length === 0) {
      return;
    }
    
    // Adjust height dynamically for scrolling
    const containerHeight = Math.max(320, categoryData.length * 45);
    $('#categoryChartContainer').css('height', containerHeight + 'px');
    
    categoryChartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: categoryData.map(d => d.label),
        datasets: [{
          label: 'Despesas',
          data: categoryData.map(d => d.value),
          backgroundColor: categoryData.map(d => d.color || '#ef4444'), // fallback to intermediate red
          borderRadius: 4
        }]
      },
      options: {
        indexAxis: 'y', // Makes the bar chart horizontal
        responsive: true,
        maintainAspectRatio: false,
        onClick: (e, elements) => {
          if (elements.length > 0) {
            const index = elements[0].index;
            const clickedData = categoryData[index];
            if (!isDrilldown) {
              if (clickedData && clickedData.breakdown) {
                renderCategoryChart(clickedData.breakdown, true, clickedData.label);
              }
            } else {
              openDeepDrilldown(clickedData.label);
            }
          }
        },
        onHover: (event, chartElement) => {
          event.native.target.style.cursor = chartElement[0] ? 'pointer' : 'default';
        },
        plugins: {
          legend: { display: false },
          datalabels: getBarDatalabelsConfig(),
          tooltip: getBarTooltipConfig()
        },
        scales: getBarScalesConfig()
      }
    });
  }

    if (macroChartInstance) {
      macroChartInstance.destroy();
    }
    
    if (!macroData || macroData.length === 0) {

  function loadDashboard() {
    getDashboardData();
  }

  let currentLoadedTransactions = [];
  let currentSortCol = null;
  let currentSortDir = 'desc'; // Rule: 1st click descending, 2nd click ascending
  let activeCategoryFilter = null; // Filter by category name string or null
  let txSearchQuery = ''; // Filter by description string

  function loadTransactions() {
    const tbody = $('#transactions-body');
    tbody.html('<tr><td colspan="6" class="p-8 text-center text-gray-500 dark:text-slate-500"><i class="fa-solid fa-circle-notch fa-spin text-primary"></i> Carregando transações...</td></tr>');
    
    const year = $('#filter-year').val();
    const month = $('#filter-month').val();
    
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(rows) {
          renderTransactions(rows);
        })
        .withFailureHandler(function() {
          tbody.html('<tr><td colspan="6" class="p-8 text-center text-red-500">Erro ao carregar transações.</td></tr>');
        })
        .getTransactions(year, month);
    } else {
      setTimeout(() => {
        // Filter mock transactions based on selected month and year
        const filteredTransactions = GLOBAL_MOCK_TRANSACTIONS.filter(t => {
          const parts = String(t.data).split('-');
          const tYear = parts[0];
          const tMonth = parseInt(parts[1], 10).toString();
          
          const matchYear = year === 'all' || year === tYear;
          const matchMonth = month === 'all' || parseInt(month) === parseInt(tMonth);
          
          return matchYear && matchMonth;
        });
        
        renderTransactions(filteredTransactions);
      }, 300);
    }
  }

  function renderTransactions(rows) {
    const rawRows = (rows || []).map((r, idx) => {
      if (!r.id && !r._id) {
        r.id = 'tx_' + (r.rowIndex ? ('row_' + r.rowIndex) : (idx + '_' + Math.random().toString(36).substr(2, 6)));
      }
      r._id = r.id || r._id;
      return r;
    });
    // Overwrite categories matching overrides across all months
    currentLoadedTransactions = applyCategoryOverrides(rawRows);
    
    // Update the dropdown menu in the category column header
    updateCategoryFilterDropdown();
    
    // Render sorted and filtered rows
    applySortAndFilterTransactions();
  }

  function updateCategoryFilterDropdown() {
    const counts = {};
    let uncategorizedCount = 0;
    currentLoadedTransactions.forEach(t => {
      const c = (t.categoria || '').trim();
      if (!c || c === 'Revisar') {
        uncategorizedCount++;
      } else {
        counts[c] = (counts[c] || 0) + 1;
      }
    });

    const total = currentLoadedTransactions.length;
    let html = `
      <button type="button" class="w-full text-left px-3 py-2 hover:bg-gray-50 dark:hover:!bg-slate-700 transition-colors flex items-center justify-between font-medium btn-set-cat-filter ${activeCategoryFilter === null ? 'text-primary font-bold bg-blue-50/60' : 'text-gray-700 dark:text-slate-300'}" data-cat="__ALL__">
        <span class="flex items-center">
          <i class="fa-solid fa-list text-[11px] mr-2 text-gray-400 dark:text-slate-500"></i>
          Todas as Categorias
        </span>
        <span class="bg-gray-100 text-gray-600 dark:text-slate-400 px-2 py-0.5 rounded-full text-[10px] font-semibold">${total}</span>
      </button>
    `;

    const sortedCats = Object.keys(counts).sort((a, b) => a.localeCompare(b, 'pt-BR'));
    sortedCats.forEach(cat => {
      const isSelected = activeCategoryFilter && activeCategoryFilter.toLowerCase() === cat.toLowerCase();
      html += `
        <button type="button" class="w-full text-left px-3 py-2 hover:bg-gray-50 dark:hover:!bg-slate-700 transition-colors flex items-center justify-between btn-set-cat-filter ${isSelected ? 'text-primary font-bold bg-blue-50/60' : 'text-gray-700 dark:text-slate-300'}" data-cat="${cat}">
          <span class="flex items-center truncate mr-2">
            <span class="w-2 h-2 rounded-full mr-2 shrink-0 ${isSelected ? 'bg-primary ring-2 ring-blue-300' : 'bg-gray-300'}"></span>
            <span class="truncate">${cat}</span>
          </span>
          <span class="bg-gray-100 text-gray-600 dark:text-slate-400 px-2 py-0.5 rounded-full text-[10px] font-semibold shrink-0">${counts[cat]}</span>
        </button>
      `;
    });

    if (uncategorizedCount > 0) {
      const isSelected = activeCategoryFilter === '__UNCATEGORIZED__';
      html += `
        <button type="button" class="w-full text-left px-3 py-2 hover:bg-red-50/60 dark:hover:!bg-slate-700 transition-colors flex items-center justify-between text-red-700 btn-set-cat-filter ${isSelected ? 'font-bold bg-red-50' : ''}" data-cat="__UNCATEGORIZED__">
          <span class="flex items-center">
            <i class="fa-solid fa-triangle-exclamation text-[11px] mr-2 text-amber-500"></i>
            Sem Categoria / Revisar
          </span>
          <span class="bg-red-100 text-red-700 px-2 py-0.5 rounded-full text-[10px] font-semibold">${uncategorizedCount}</span>
        </button>
      `;
    }

    $('#category-filter-items').html(html);

    if (activeCategoryFilter !== null) {
      $('#btn-cat-filter-toggle').addClass('text-primary bg-blue-50 border-blue-200 dark:border-blue-800');
      $('#icon-cat-dropdown').addClass('text-primary');
    } else {
      $('#btn-cat-filter-toggle').removeClass('text-primary bg-blue-50 border-blue-200 dark:border-blue-800');
      $('#icon-cat-dropdown').removeClass('text-primary');
    }
  }

  function applySortAndFilterTransactions() {
    const tbody = $('#transactions-body');
    tbody.empty();

    let displayRows = [...currentLoadedTransactions];

    // Description search filter
    const searchVal = ($('#tx-search-input').val() || txSearchQuery || '').trim().toLowerCase();
    if (searchVal) {
      displayRows = displayRows.filter(r => {
        const rawDesc = String(r.descricao || '').toLowerCase();
        const normDesc = normalizeDescription(r.descricao || '').toLowerCase();
        return rawDesc.includes(searchVal) || normDesc.includes(searchVal);
      });
    }

    // Category filter application
    if (activeCategoryFilter !== null) {
      if (activeCategoryFilter === '__UNCATEGORIZED__') {
        displayRows = displayRows.filter(r => !r.categoria || r.categoria === '' || r.categoria === 'Revisar');
        $('#active-category-name').text('Sem Categoria / Revisar');
      } else {
        displayRows = displayRows.filter(r => (r.categoria || '').trim().toLowerCase() === activeCategoryFilter.toLowerCase());
        $('#active-category-name').text(activeCategoryFilter);
      }
      $('#active-category-count').text(`${displayRows.length} transações`);
      $('#active-category-filter-bar').removeClass('hidden');
    } else {
      $('#active-category-filter-bar').addClass('hidden');
    }

    // Column sorting: 1st click desc, 2nd click asc
    if (currentSortCol) {
      displayRows.sort((a, b) => {
        let valA = a[currentSortCol];
        let valB = b[currentSortCol];

        let cmp = 0;
        if (currentSortCol === 'valor') {
          cmp = Number(valA || 0) - Number(valB || 0);
        } else if (currentSortCol === 'data') {
          const dA = parseLocalDateString(valA).getTime() || 0;
          const dB = parseLocalDateString(valB).getTime() || 0;
          cmp = dA - dB;
        } else {
          cmp = String(valA || '').localeCompare(String(valB || ''), 'pt-BR', { sensitivity: 'base' });
        }

        return currentSortDir === 'desc' ? -cmp : cmp;
      });
    }

    // Update sort icons across headers
    $('.sort-icon').each(function() {
      const col = $(this).data('col');
      if (col === currentSortCol) {
        if (currentSortDir === 'desc') {
          $(this).html('<i class="fa-solid fa-arrow-down-wide-short text-primary"></i>');
        } else {
          $(this).html('<i class="fa-solid fa-arrow-up-short-wide text-primary"></i>');
        }
      } else {
        $(this).html('<i class="fa-solid fa-sort text-gray-300"></i>');
      }
    });

    if (displayRows.length === 0) {
      tbody.html('<tr><td colspan="6" class="p-8 text-center text-gray-500 dark:text-slate-500">Nenhuma transação encontrada para este filtro.</td></tr>');
      return;
    }

    displayRows.forEach(row => {
      let dateStr = row.data;
      if (dateStr && dateStr.substring) {
         if(dateStr.indexOf('T') !== -1) dateStr = dateStr.split('T')[0];
         const parts = dateStr.split('-');
         if(parts.length === 3) dateStr = `${parts[2]}/${parts[1]}/${parts[0]}`;
      }
      
      const valClass = row.tipo === 'Entrada' ? 'text-success' : 'text-gray-900 dark:text-white';
      const valPrefix = row.tipo === 'Entrada' ? '+ ' : '- ';
      const categoryColor = getCategoryColor(row.categoria);
      const rowId = row._id || row.id || ('tx_' + Math.random().toString(36).substr(2, 6));

      tbody.append(`
        <tr class="hover:bg-gray-50 dark:hover:!bg-slate-700/50 transition-colors group">
          <td class="p-4 text-gray-500 dark:text-slate-500 align-middle whitespace-nowrap">${row.origem || '-'}</td>
          <td class="p-4 font-medium text-gray-900 dark:text-white align-middle max-w-xs break-words">${row.descricao}</td>
          <td class="p-4 align-middle max-w-[220px] td-categoria-cell cursor-pointer">
            <button type="button" 
              class="btn-edit-tx-cat group/cat inline-flex items-center justify-between gap-1.5 max-w-[185px] sm:max-w-[210px] px-2.5 py-1.5 ${categoryColor} rounded-md text-xs font-medium whitespace-normal break-words leading-snug text-left shadow-2xs hover:shadow hover:ring-2 hover:ring-primary/40 active:scale-95 transition-all cursor-pointer select-none"
              data-tx-id="${rowId}"
              data-row-index="${row.rowIndex || ''}"
              data-categoria="${escapeHtml(row.categoria || '')}"
              data-descricao="${escapeHtml(row.descricao || '')}"
              data-origem="${escapeHtml(row.origem || '')}"
              data-tipo="${row.tipo || ''}"
              data-valor="${row.valor || 0}"
              data-data="${row.data || ''}"
              title="Clique para alterar a categoria desta transação">
              <span class="cat-label truncate">${row.categoria || 'Sem categoria'}</span>
              <i class="fa-solid fa-chevron-down text-[9px] opacity-40 group-hover/cat:opacity-100 group-hover/cat:text-primary transition-opacity shrink-0"></i>
            </button>
          </td>
          <td class="p-4 text-gray-500 dark:text-slate-500 text-xs uppercase align-middle whitespace-nowrap">${row.tipo}</td>
          <td class="p-4 text-right ${valClass} font-medium align-middle whitespace-nowrap">${valPrefix}${formatCurrency(row.valor)}</td>
          <td class="p-4 text-right text-gray-500 dark:text-slate-500 align-middle whitespace-nowrap">${dateStr}</td>
        </tr>
      `);
    });
  }

  function getCategoryColor(cat) {
    switch(cat) {
      case 'Alimentação': return 'bg-orange-50 dark:bg-orange-950/40 text-orange-700 dark:text-orange-300 border border-orange-200 dark:border-orange-800/60';
      case 'Transporte': return 'bg-blue-50 dark:bg-blue-950/40 text-blue-700 dark:text-blue-300 border border-blue-200 dark:border-blue-800/60';
      case 'Moradia': return 'bg-purple-50 dark:bg-purple-900/30 text-purple-700 dark:text-purple-300 border border-purple-200 dark:border-purple-800';
      case 'Lazer': return 'bg-pink-50 dark:bg-pink-950/40 text-pink-700 dark:text-pink-300 border border-pink-200 dark:border-pink-800/60';
      case 'Saúde': return 'bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/60';
      case 'Renda':
      case 'Salário': return 'bg-success/10 text-success border border-success/20';
      case 'Transferência': return 'bg-gray-100 dark:bg-slate-800 text-gray-700 dark:text-slate-300 border border-gray-200 dark:border-slate-700';
      case 'Viagem': return 'bg-teal-50 dark:bg-teal-950/40 text-teal-700 dark:text-teal-300 border border-teal-200 dark:border-teal-800/60';

  function refreshTransactionsAndRules(showFeedback = true) {
    const $btn = $('#btn-refresh-transactions');
    const $icon = $btn.find('i');
    $btn.prop('disabled', true).addClass('opacity-75');
    $icon.addClass('fa-spin');
    
    // Invalida todos os caches da aplicação para garantir dados frescos
    if (typeof invalidateCache === 'function') {
      invalidateCache();
    }
    
    // 1. Garante que as regras mais recentes do localStorage estão sincronizadas em GLOBAL_RULES
    try {
      const savedRules = localStorage.getItem('finance_user_rules');
      if (savedRules) {
        const parsed = JSON.parse(savedRules);
        if (Array.isArray(parsed) && parsed.length > 0) {
          GLOBAL_RULES = parsed;
        }
      }
    } catch(e) {
      console.warn("Erro ao ler regras:", e);
    }

    // 2. Aplica regras aos dados mockados em ambiente standalone/preview
    function applyMockRules() {
      if (typeof GLOBAL_MOCK_TRANSACTIONS !== 'undefined' && Array.isArray(GLOBAL_MOCK_TRANSACTIONS)) {
        GLOBAL_MOCK_TRANSACTIONS.forEach(t => {
          const rawDesc = String(t.descricao || '').trim().toUpperCase();
          const normDesc = normalizeDescription(t.descricao).toUpperCase();
          const matchedRule = GLOBAL_RULES.find(rule => {
            const p = (rule.pattern || '').trim().toUpperCase();
            return p && (rawDesc.includes(p) || normDesc.includes(p));
          });
          if (matchedRule) {
            let catName = null;
            if (matchedRule.categoryId) {
              const catObj = GLOBAL_CATEGORIES.find(c => c.id == matchedRule.categoryId);
              if (catObj) catName = catObj.name;
            }
            if (!catName && matchedRule.categoria) {
              catName = matchedRule.categoria;
            }
            if (catName) {
              t.categoria = catName;
            }
          }
        });
      }
    }

    function completeRefresh() {
      // Recarrega lista de transações com as regras atualizadas
      loadTransactions();
      
      // Atualiza dropdown de filtro de categoria se disponível
      if (typeof updateCategoryFilterDropdown === 'function') {
        updateCategoryFilterDropdown();
      }
      
      // Atualiza listas da aba "Categorias e Regras"
      renderRulesList();
      renderCategoriesList();
      
      // Atualiza matriz de planejamento anual e dashboard
      if (typeof loadPlanning === 'function') {
        loadPlanning();
      }
      if (typeof loadDashboard === 'function') {
        loadDashboard();
      }
      
      setTimeout(function() {
        $btn.prop('disabled', false).removeClass('opacity-75');
        $icon.removeClass('fa-spin');
        if (showFeedback) {
          showRefreshToast("Transações atualizadas e novas regras aplicadas com sucesso!");
        }
      }, 350);
    }

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      // 1. Busca regras do backend se disponíveis e atualiza na planilha
      google.script.run
        .withSuccessHandler(function(backendRules) {
          if (backendRules && Array.isArray(backendRules)) {
            backendRules.forEach(br => {
              const pat = String(br.pattern || '').trim().toUpperCase();
              if (!pat) return;
              let existing = GLOBAL_RULES.find(r => (r.pattern || '').toUpperCase() === pat);
              let cat = GLOBAL_CATEGORIES.find(c => c.name.toLowerCase() === String(br.categoria || '').toLowerCase());
              let catId = cat ? cat.id : (GLOBAL_CATEGORIES[0] ? GLOBAL_CATEGORIES[0].id : 1);
              if (existing) {
                if (cat) existing.categoryId = cat.id;
                if (br.clean) existing.clean = br.clean;
              } else {
                GLOBAL_RULES.push({
                  id: Date.now() + Math.random(),
                  pattern: pat,
                  clean: br.clean || br.estabelecimento || pat,
                  categoryId: catId
                });
              }
            });
            saveRulesToStorage();
          }

          // 2. Aplica as novas regras diretamente nas transações da planilha
          if (typeof google.script.run.applyUserRulesToTransactionsBackend === 'function') {
            google.script.run
              .withSuccessHandler(function() {
                completeRefresh();
              })
              .withFailureHandler(function() {
                completeRefresh();
              })
              .applyUserRulesToTransactionsBackend();
          } else {
            completeRefresh();
          }
        })
        .withFailureHandler(function() {
          completeRefresh();
        })
        .getUserRules();
    } else {
      // Standalone Preview Mode
      applyMockRules();
      setTimeout(function() {
        completeRefresh();
      }, 350);
    }
  }

  function handleSaveTransactionCategory(newCategory, isBulk) {
    if (!currentEditingTx) return;

    const tx = { ...currentEditingTx };
    const rowId = tx.txId;
    const rowIndex = tx.rowIndex;
    const desc = tx.descricao;
    const val = tx.valor;
    const dataStr = tx.data;
    const origem = tx.origem;
    const tipo = tx.tipo;

    // Show instant UI feedback in table
    const $targetBtn = $(`button.btn-edit-tx-cat[data-tx-id="${rowId}"]`);
    $targetBtn.prop('disabled', true).addClass('opacity-75');
    $targetBtn.html('<i class="fa-solid fa-circle-notch fa-spin text-primary text-[10px]"></i> <span class="text-[11px] ml-1">Salvando...</span>');

    // Close modal
    $('#modal-tx-change-category').addClass('hidden');

    function applySuccessLocally() {
      // 1. Update in currentLoadedTransactions
      currentLoadedTransactions.forEach(t => {
        if (t._id === rowId || t.id === rowId || (t.descricao === desc && t.valor == val && t.data === dataStr)) {
          t.categoria = newCategory;
        } else if (isBulk && String(t.descricao || '').trim().toLowerCase() === String(desc || '').trim().toLowerCase()) {
          t.categoria = newCategory;
        }
      });

      // 2. Update MANUAL_TX_OVERRIDES
      const txKey = `${dataStr}_${desc}_${val}_${origem || ''}`;
      const txKeyAlt = `${dataStr}_${val}_${String(desc || '').trim().toUpperCase()}`;
      MANUAL_TX_OVERRIDES[txKey] = newCategory;
      MANUAL_TX_OVERRIDES[txKeyAlt] = newCategory;
      saveManualTxOverrides();

      // 3. If bulk, update CATEGORY_OVERRIDES
      if (isBulk) {
        const rawDesc = String(desc || '').trim().toUpperCase();
        const normDesc = normalizeDescription(desc).toUpperCase();
        CATEGORY_OVERRIDES[rawDesc] = newCategory;
        CATEGORY_OVERRIDES[normDesc] = newCategory;
        saveCategoryOverrides();
      }

      // 4. Update in mock storage (persists permanently in preview/mock)
      if (typeof GLOBAL_MOCK_TRANSACTIONS !== 'undefined' && Array.isArray(GLOBAL_MOCK_TRANSACTIONS)) {
        GLOBAL_MOCK_TRANSACTIONS.forEach(t => {
          const matchSingle = (t.id && t.id === rowId) || 
                              (String(t.descricao || '').trim().toLowerCase() === String(desc || '').trim().toLowerCase() && 
                               Math.abs((parseFloat(t.valor) || 0) - (parseFloat(val) || 0)) < 0.01 && 
                               (!dataStr || String(t.data) === String(dataStr)));
          const matchBulk = isBulk && String(t.descricao || '').trim().toLowerCase() === String(desc || '').trim().toLowerCase();
          
          if (matchSingle || matchBulk) {
            t.categoria = newCategory;
          }
        });
        GLOBAL_MOCK_BACKUP = JSON.stringify(GLOBAL_MOCK_TRANSACTIONS);
        saveMockTransactionsToStorage();
      }

      // 5. Invalidate caches so planning and dashboard catch up
      if (typeof invalidateCache === 'function') {
        invalidateCache();
      }

      // 6. Update UI
      if (isBulk) {
        applySortAndFilterTransactions();
      } else {
        const colorClass = getCategoryColor(newCategory);
        $targetBtn
          .prop('disabled', false)
          .removeClass('opacity-75')
          .attr('class', `btn-edit-tx-cat group/cat inline-flex items-center justify-between gap-1.5 max-w-[185px] sm:max-w-[210px] px-2.5 py-1.5 ${colorClass} rounded-md text-xs font-medium whitespace-normal break-words leading-snug text-left shadow-2xs hover:shadow hover:ring-2 hover:ring-primary/40 active:scale-95 transition-all cursor-pointer select-none`)
          .attr('data-categoria', newCategory || '')
          .html(`
            <span class="cat-label truncate">${newCategory || 'Sem categoria'}</span>
            <i class="fa-solid fa-chevron-down text-[9px] opacity-40 group-hover/cat:opacity-100 group-hover/cat:text-primary transition-opacity shrink-0"></i>
          `);
      }

      // 7. Update dropdown filter counts
      updateCategoryFilterDropdown();

      // 8. Toast feedback
      const successMsg = isBulk
        ? `Categoria "${newCategory || 'Sem categoria'}" aplicada a todas as transações de "${desc}" na origem!`
        : `Categoria da transação alterada para "${newCategory || 'Sem categoria'}" na origem com sucesso!`;
      showRefreshToast(successMsg);
    }

    // Google Apps Script Backend Persistence
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      if (isBulk) {
        google.script.run
          .withSuccessHandler(function() {
            applySuccessLocally();
          })
          .withFailureHandler(function(err) {
            console.error("Erro ao atualizar categoria na planilha:", err);
            applySuccessLocally();
            showRefreshToast("Atualizado localmente. Verifique a conexão com a planilha.");
          })
          .updateAllMatchingTransactionsCategory(desc, newCategory);
      } else {
        google.script.run
          .withSuccessHandler(function() {
            applySuccessLocally();
          })
          .withFailureHandler(function(err) {
            console.error("Erro ao atualizar categoria na planilha:", err);
            applySuccessLocally();
            showRefreshToast("Atualizado localmente. Verifique a conexão com a planilha.");
          })
          .updateSingleTransactionCategory(rowIndex, newCategory, {
            descricao: desc,
            valor: val,
            data: dataStr,
            origem: origem,
            tipo: tipo
          });
      }
    } else {
      // Mock / Preview Mode
      setTimeout(() => {
        applySuccessLocally();
      }, 200);
    }
  }

  function openDeepDrilldown(descLabel) {
    $('#deep-drilldown-modal').removeClass('hidden');
    $('#deep-drilldown-title').text('Histórico: ' + descLabel);
    
    // Filter raw data for this sub-category
    const filtered = rawExpensesData.filter(d => d.desc === descLabel).sort((a, b) => a.date - b.date);
    
    // Group by Month/Year
    const temporalData = {};
    filtered.forEach(item => {
      const d = new Date(item.date);
      const mNum = (d.getMonth() + 1).toString().padStart(2, '0');
      const y = d.getFullYear();
      const key = `${y}-${mNum}`;
      const label = `${mNum}/${y}`;
      
      if (!temporalData[key]) temporalData[key] = { label: label, sortKey: key, value: 0 };
      temporalData[key].value += item.value;
    });
    
    const chartData = Object.values(temporalData).sort((a, b) => a.sortKey.localeCompare(b.sortKey));
    
    // Calculate metrics
    let avg = 0;
    let mom = 0;
    let trend = 'Sem dados';
    
    if (chartData.length > 0) {
      const total = chartData.reduce((acc, curr) => acc + curr.value, 0);
      avg = total / chartData.length;
      
      if (chartData.length > 1) {
        const last = chartData[chartData.length - 1].value;
        const prev = chartData[chartData.length - 2].value;
        if (prev > 0) {
          mom = ((last - prev) / prev) * 100;
        } else {
          mom = 100; // if previous was 0 and now has value
        }
      }
      
      if (mom > 0) trend = 'Subindo';
      else if (mom < 0) trend = 'Descendo';
      else trend = 'Estável';
    }
    
    $('#drilldown-avg').text(formatCurrency(avg));
    
    const momEl = $('#drilldown-mom');
    momEl.empty();
    if (chartData.length < 2) {
      momEl.text('-');
    } else {
      const momText = Math.abs(mom).toFixed(1) + '%';
      if (mom > 0) {
        momEl.html(`<i class="fa-solid fa-arrow-trend-up text-danger mr-2"></i><span class="text-danger">+${momText}</span>`);
      } else if (mom < 0) {
        momEl.html(`<i class="fa-solid fa-arrow-trend-down text-success mr-2"></i><span class="text-success">-${momText}</span>`);
      } else {
        momEl.html(`<span class="text-gray-500 dark:text-slate-500">0%</span>`);
      }
    }
    
    $('#drilldown-trend').text(trend);
    
    // Render chart
    const ctx = document.getElementById('deepDrilldownChart');
    if (!ctx) return;
    
    if (deepDrilldownChartInstance) {
      deepDrilldownChartInstance.destroy();
    }
    
    deepDrilldownChartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: chartData.map(d => d.label),
        datasets: [{
          label: 'Gastos',
          data: chartData.map(d => d.value),
          borderColor: '#ef4444',
          backgroundColor: 'rgba(239, 68, 68, 0.1)',
          fill: true,
          tension: 0.4,
          borderWidth: 2,
          pointBackgroundColor: '#ef4444',
          pointBorderColor: '#ffffff',
          pointBorderWidth: 2,
          pointRadius: 4,
          pointHoverRadius: 6
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          datalabels: { display: false },
          tooltip: {
            backgroundColor: 'rgba(17, 24, 39, 0.9)',
            titleFont: { family: 'Inter, sans-serif', size: 13 },
            bodyFont: { family: 'Inter, sans-serif', size: 13 },
            padding: 12,
            cornerRadius: 8,
            callbacks: {
              label: function(context) {

  function getCategoryProfileBadge(profile) {
    if (profile.includes('Despesa Fixa')) return `<span class="bg-red-100 text-red-700 text-xs px-2 py-0.5 rounded-full font-medium">Fixa</span>`;
    if (profile.includes('Variável') && profile.includes('Despesa')) return `<span class="bg-yellow-100 text-yellow-700 text-xs px-2 py-0.5 rounded-full font-medium">Variável</span>`;
    if (profile.includes('Discricionária')) return `<span class="bg-orange-100 text-orange-700 text-xs px-2 py-0.5 rounded-full font-medium">Discricionária</span>`;
    if (profile.includes('Receita Fixa')) return `<span class="bg-emerald-100 text-emerald-700 text-xs px-2 py-0.5 rounded-full font-medium">Receita Fixa</span>`;
    if (profile.includes('Receita Variável')) return `<span class="bg-teal-100 text-teal-700 text-xs px-2 py-0.5 rounded-full font-medium">Receita Variável</span>`;
    return `<span class="bg-gray-100 text-gray-700 dark:text-slate-300 text-xs px-2 py-0.5 rounded-full font-medium">${profile}</span>`;
  }

  function getGroupedCategories() {
    const sortedCats = [...GLOBAL_CATEGORIES].sort((a, b) => a.name.localeCompare(b.name));
    
    const grouped = {};
    sortedCats.forEach(cat => {
      if(!grouped[cat.profile]) grouped[cat.profile] = [];
      grouped[cat.profile].push(cat);
    });
    
    const order = ['Despesa Fixa', 'Despesa Variável', 'Despesa Discricionária', 'Receita Fixa', 'Transferência'];
    const sortedProfiles = Object.keys(grouped).sort((a, b) => {
      let idxA = order.indexOf(a);
      let idxB = order.indexOf(b);
      if(idxA === -1) idxA = 99;
      if(idxB === -1) idxB = 99;
      return idxA - idxB;
    });
    return { grouped, sortedProfiles };
  }

  function getProfileHeaderDetails(profile) {
    if (profile.includes('Despesa Fixa')) return { icon: 'fa-solid fa-calendar-minus', color: 'text-red-600', bg: 'bg-red-50' };
    if (profile.includes('Variável') && profile.includes('Despesa')) return { icon: 'fa-solid fa-bolt', color: 'text-yellow-600', bg: 'bg-yellow-50' };
    if (profile.includes('Discricionária')) return { icon: 'fa-solid fa-basket-shopping', color: 'text-orange-600', bg: 'bg-orange-50' };
    if (profile.includes('Receita Fixa')) return { icon: 'fa-solid fa-hand-holding-dollar', color: 'text-emerald-600', bg: 'bg-emerald-50' };
    if (profile.includes('Receita Variável')) return { icon: 'fa-solid fa-chart-line', color: 'text-teal-600', bg: 'bg-teal-50' };
    if (profile.includes('Transferência')) return { icon: 'fa-solid fa-arrow-right-arrow-left', color: 'text-gray-600 dark:text-slate-400', bg: 'bg-gray-100' };
    return { icon: 'fa-solid fa-tag', color: 'text-gray-500 dark:text-slate-500', bg: 'bg-gray-50' };
  }

    function processSyncTransactions(rows) {
      $('#sync-loading').addClass('hidden');

      if (!rows || rows.length === 0) {
        $('#sync-empty').removeClass('hidden');
        $('#sync-content').addClass('hidden');
        return;
      }

      // Step 1: Ensure any pre-existing category in transactions is in GLOBAL_CATEGORIES
      const knownCatNames = new Set(GLOBAL_CATEGORIES.map(c => c.name.toLowerCase()));
      rows.forEach(r => {
        const cat = (r.categoria || '').trim();
        if (cat && cat !== 'Revisar' && cat !== 'Outros' && !knownCatNames.has(cat.toLowerCase())) {
          knownCatNames.add(cat.toLowerCase());
          GLOBAL_CATEGORIES.push({
            id: Date.now() + Math.floor(Math.random() * 1000),
            name: cat,
            profile: r.tipo === 'Entrada' ? 'Receita Variável' : 'Despesa Discricionária'
          });
        }
      });

      // Step 2: Analyze and classify each transaction
      syncTransactions = rows.map((r, index) => {
        const rawDesc = String(r.descricao || '').trim();
        const normDesc = normalizeDescription(rawDesc);
        let cat = String(r.categoria || '').trim();
        let origem = 'Pendente';
        let confianca = 'baixa';
        let saveRule = false;

        // Check user category overrides first
        const rawUpper = rawDesc.toUpperCase();
        const normUpper = normDesc.toUpperCase();
        if (CATEGORY_OVERRIDES[rawUpper]) {
          cat = CATEGORY_OVERRIDES[rawUpper];
          origem = 'Usuário';
          confianca = 'alta';
        } else if (CATEGORY_OVERRIDES[normUpper]) {
          cat = CATEGORY_OVERRIDES[normUpper];
          origem = 'Usuário';
          confianca = 'alta';
        } else {
          // Check user custom rules
          const userRuleMatch = GLOBAL_RULES.find(rule => {
            const p = (rule.pattern || '').trim().toUpperCase();
            if (!p) return false;
            return normDesc.includes(p) || rawDesc.toUpperCase().includes(p);
          });

          if (userRuleMatch) {
            const matchedCatObj = GLOBAL_CATEGORIES.find(c => c.id == userRuleMatch.categoryId);
            cat = matchedCatObj ? matchedCatObj.name : (userRuleMatch.clean || 'Outros');
            origem = 'Usuário';
            confianca = 'alta';
          } else {
            // Check intelligent system patterns
            const sysMatch = getIntelligentSystemMatch(rawDesc, normDesc);
            if (sysMatch) {
              cat = sysMatch.category;
              origem = 'Sistema';
              confianca = 'alta';

              // Auto-create category in GLOBAL_CATEGORIES if not already present
              if (!knownCatNames.has(cat.toLowerCase())) {
                knownCatNames.add(cat.toLowerCase());
                GLOBAL_CATEGORIES.push({
                  id: Date.now() + Math.floor(Math.random() * 1000),
                  name: cat,
                  profile: (r.tipo === 'Entrada' || cat.toLowerCase().includes('salário') || cat.toLowerCase().includes('receita')) ? 'Receita Fixa' : 'Despesa Variável'
                });
              }
            } else if (cat && cat !== 'Revisar' && cat !== 'Outros' && cat !== '') {
              // Already categorized previously
              origem = 'Existente';
              confianca = 'alta';
            } else {
              // Truly uncategorized
              cat = '';
              origem = 'Pendente';
              confianca = 'baixa';
            }
          }
        }

        const origCat = String(r.categoria || '').trim();
        return {
          rowIndex: r.rowIndex || (index + 1),
          data: r.data || '',
          valor: Number(r.valor) || 0,
          tipo: r.tipo || 'Saída',
          descricao: rawDesc,
          normDesc: normDesc || rawDesc,
          categoria: cat,
          originalCategoria: origCat,
          isUpdated: (cat !== '' && cat !== 'Revisar' && cat !== origCat),
          origem: origem,
          confianca: confianca,
          saveRule: saveRule
        };
      });

      renderCategoriesList();
      populateRuleCategorySelect();

      $('#sync-empty').addClass('hidden');
      $('#sync-content').removeClass('hidden');
      renderSyncTable();
    }

    function renderSyncTable() {
      const total = syncTransactions.length;
      const pendingCount = syncTransactions.filter(t => !t.categoria || t.categoria === '' || t.categoria === 'Revisar' || t.confianca === 'baixa').length;
      const autoCount = total - pendingCount;

      $('#sync-count-total').text(total);
      $('#sync-count-pending').text(pendingCount);
      $('#sync-count-auto').text(autoCount);

      $('#sync-summary-title').text('Resumo da Análise');
      $('#sync-summary-subtitle').text(`${total} transações analisadas (${autoCount} reconhecidas, ${pendingCount} para revisar)`);

      if (pendingCount > 0) {
        $('#sync-footer-status').html(`<span class="text-amber-600 font-semibold"><i class="fa-solid fa-circle-exclamation mr-1.5"></i>${pendingCount} transação(ões) pendente(s) de categoria</span>`);
      } else {
        $('#sync-footer-status').html(`<span class="text-emerald-600 font-semibold"><i class="fa-solid fa-circle-check mr-1.5"></i>Todas as ${total} transações estão categorizadas!</span>`);
      }

      // AUTOMATIC PROPAGATION:

      let affectedCount = 0;
      syncTransactions.forEach(t => {
        const tNorm = normalizeDescription(t.descricao);

          t.saveRule = true; // Auto-mark rule to be remembered permanently

      const updated = syncTransactions.filter(t => {

      if (updated.length === 0 && syncDeletedRowIndices.length === 0) {
        alert("Nenhuma transação foi atualizada para salvar. Altere a categoria de pelo menos uma transação antes de salvar.");

      const btn = $(this);

      // Save into CATEGORY_OVERRIDES ONLY for actually updated transactions
      updated.forEach(t => {
        const rawUpper = String(t.descricao || '').trim().toUpperCase();
        const normUpper = normalizeDescription(t.descricao || '').toUpperCase();
        if (rawUpper) CATEGORY_OVERRIDES[rawUpper] = t.categoria;
        if (normUpper) CATEGORY_OVERRIDES[normUpper] = t.categoria;
      });
      try {
        localStorage.setItem('finance_category_overrides', JSON.stringify(CATEGORY_OVERRIDES));
      } catch(e) {}

      // Update GLOBAL_MOCK_TRANSACTIONS across all months for updated ones only
      GLOBAL_MOCK_TRANSACTIONS = GLOBAL_MOCK_TRANSACTIONS.filter(t => {
        const raw = String(t.descricao || '').trim().toUpperCase();
        return !DELETED_OVERRIDES.has(`${t.data}_${t.valor}_${raw}`);
      }).map(t => {
        const rawUpper = String(t.descricao || '').trim().toUpperCase();
        const normUpper = normalizeDescription(t.descricao || '').toUpperCase();
        if (CATEGORY_OVERRIDES[rawUpper]) {
          t.categoria = CATEGORY_OVERRIDES[rawUpper];
        } else if (CATEGORY_OVERRIDES[normUpper]) {
          t.categoria = CATEGORY_OVERRIDES[normUpper];
        }
        return t;
      });

      // Send only actually updated transactions in updates
      const updates = updated.map(t => ({
        rowIndex: t.rowIndex,
        categoria: t.categoria,
        descricao: t.descricao
      }));

      const rulesToSave = [];
      const savedPatterns = new Set();
      updated.forEach(t => {
        if (t.saveRule && t.categoria && t.normDesc) {
          const pat = t.normDesc.toUpperCase();
          if (!savedPatterns.has(pat)) {
            savedPatterns.add(pat);
            let catObj = GLOBAL_CATEGORIES.find(c => c.name === t.categoria);
            let catId = catObj ? catObj.id : 9;
            rulesToSave.push({
              pattern: pat,
              clean: t.normDesc,
              categoria: t.categoria,
              categoryId: catId
            });
          }
        }
      });

      const successFeedback = updated.length === 1
        ? `Sucesso! 1 transação foi atualizada e salva com sucesso.`
        : `Sucesso! ${updated.length} transações foram atualizadas e salvas com sucesso.`;

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function() {

            $('#sync-categorize-modal').addClass('hidden');

      const gridColor = isDark ? 'rgba(51, 65, 85, 0.4)' : '#f3f4f6';

            chart.options.scales.x.ticks.color = axisXColor;

        if (evolutionChartInstance.options.scales.y && evolutionChartInstance.options.scales.y.grid) {
          evolutionChartInstance.options.scales.y.grid.color = gridColor;
        }
        if (evolutionChartInstance.options.scales.x && evolutionChartInstance.options.scales.x.ticks) {

    });
  });
