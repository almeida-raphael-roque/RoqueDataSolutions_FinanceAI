  function handleForecastCellRangeClick(cat, month, cellYear, tipo, $td) {
    if (!activeForecastRange || activeForecastRange.cat !== cat || activeForecastRange.year !== cellYear) {
      // 1º clique: seleciona a célula e fixa âncora
      activeForecastRange = {
        cat: cat,
        tipo: tipo,
        year: cellYear,
        anchorMonth: month,
        startMonth: month,
        endMonth: month
      };
    } else {
      // 2º clique ou posterior na mesma linha: seleciona o range entre a âncora e o novo mês clicado
      const minM = Math.min(activeForecastRange.anchorMonth, month);
      const maxM = Math.max(activeForecastRange.anchorMonth, month);
      activeForecastRange.startMonth = minM;
      activeForecastRange.endMonth = maxM;
    }

    updateForecastRangeHighlight();
    showForecastRangeBox();
  }

  function showForecastRangeBox() {
    if (!activeForecastRange) return;

    let $box = $('#planning-range-forecast-box');
    if (!$box.length) return;

    // Garante que o box seja filho direto de <body> para que position: fixed seja em relação ao viewport real
    if ($box.parent()[0] !== document.body) {
      $('body').append($box);
      $box = $('#planning-range-forecast-box');
    }

    const $matchingTds = getTdsForRange();

    const monthNames = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
    const monthAbbr = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];

    $('#range-box-category-name').text(activeForecastRange.cat).attr('title', activeForecastRange.cat);

    const startM = activeForecastRange.startMonth;
    const endM = activeForecastRange.endMonth;
    let rangeLabel = '';
    if (startM === endM) {
      rangeLabel = `${monthNames[startM - 1]} / ${activeForecastRange.year}`;
    } else {
      const diff = (endM - startM) + 1;
      rangeLabel = `${monthAbbr[startM - 1]} a ${monthAbbr[endM - 1]} / ${activeForecastRange.year} (${diff} meses)`;
    }
    $('#range-box-months-text').text(rangeLabel);

    // Se estava fechado ou mudou de categoria, carrega o valor da primeira célula
    if ($box.is(':hidden') || $box.hasClass('hidden') || $box.attr('data-last-cat') !== activeForecastRange.cat) {
      $box.attr('data-last-cat', activeForecastRange.cat);
      const firstVal = $matchingTds.length ? (parseFloat($matchingTds.first().attr('data-raw-value')) || 0) : 0;
      if (firstVal > 0) {
        $('#range-box-input-val').val(firstVal.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
      } else {
        $('#range-box-input-val').val('');
      }
    }

    // Torna visível imediatamente com z-index de topo absoluto
    $box.removeClass('hidden').css({
      display: 'block',
      visibility: 'visible',
      opacity: '1',
      position: 'fixed',
      zIndex: 99999
    });

    // Dimensões dinâmicas da barra horizontal
    const boxWidth = $box.outerWidth() || 520;
    const boxHeight = $box.outerHeight() || 50;
    const winWidth = window.innerWidth;
    const winHeight = window.innerHeight;

    let top = Math.round(winHeight / 2 - (boxHeight / 2));
    let left = Math.round(winWidth / 2 - (boxWidth / 2));

    if ($matchingTds.length) {
      const firstRect = $matchingTds.first()[0].getBoundingClientRect();
      const lastRect = $matchingTds.last()[0].getBoundingClientRect();
      const rangeLeft = Math.min(firstRect.left, lastRect.left);
      const rangeRight = Math.max(firstRect.right, lastRect.right);
      const rangeCenterX = (rangeLeft + rangeRight) / 2;
      const rangeTop = firstRect.top;
      const cellHeight = firstRect.height;

      // Preferencialmente posiciona logo abaixo da linha com margem de 10px (não encobre a linha)
      top = rangeTop + cellHeight + 10;
      // Se passar da borda inferior da tela, posiciona acima da linha com margem de 10px
      if (top + boxHeight > winHeight - 16) {
        top = rangeTop - boxHeight - 10;
      }
      // Clamping seguro dentro da janela para nunca sumir
      if (top < 16) top = 16;
      if (top + boxHeight > winHeight - 16) top = winHeight - boxHeight - 16;

      // Centralizado horizontalmente no range selecionado
      left = rangeCenterX - (boxWidth / 2);
      if (left < 16) left = 16;
      if (left + boxWidth > winWidth - 16) left = winWidth - boxWidth - 16;
    }

    $box.css({
      top: `${Math.round(top)}px`,
      left: `${Math.round(left)}px`
    });

    setTimeout(() => {
      $('#range-box-input-val').focus().select();
    }, 40);
  }

  function applyForecastRangeValue(val) {
    if (!activeForecastRange) return;
    const cat = activeForecastRange.cat;
    const tipo = activeForecastRange.tipo;
    const year = activeForecastRange.year;
    const yStr = String(year);
    const startM = activeForecastRange.startMonth;
    const endM = activeForecastRange.endMonth;

    if (val === 0) {
      deleteForecastRange();
      return;
    }

    const overrides = getPlanningOverrides();
    if (!overrides[yStr]) overrides[yStr] = {};
    if (!overrides[yStr][cat]) overrides[yStr][cat] = {};

    const forecasts = getPlanningForecasts();
    if (!forecasts[yStr]) forecasts[yStr] = {};
    if (!forecasts[yStr][cat]) {
      forecasts[yStr][cat] = { forecastValue: val, months: {} };
    }
    forecasts[yStr][cat].forecastValue = val;
    forecasts[yStr][cat].isEligible = true;
    forecasts[yStr][cat].isExcluded = false;
    forecasts[yStr][cat].updatedAt = Date.now();

    for (let m = startM; m <= endM; m++) {
      overrides[yStr][cat][m] = {
        val: val,
        tipo: tipo,
        isManualOverride: true,
        isForecast: true,
        updatedAt: Date.now()
      };
      forecasts[yStr][cat].months[m] = val;
    }

    try {
      localStorage.setItem('fin_ally_planning_overrides', JSON.stringify(overrides));
      localStorage.setItem('fin_ally_planning_forecasts', JSON.stringify(forecasts));
    } catch(e) {}

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      if (google.script.run.savePlanningForecastsBackend) {
        google.script.run.savePlanningForecastsBackend(year, JSON.stringify(forecasts));
      }
      if (google.script.run.savePlanningOverrideBackend) {
        for (let m = startM; m <= endM; m++) {
          google.script.run.savePlanningOverrideBackend(year, cat, m, tipo, val);
        }
      }
    }

    const monthCount = (endM - startM) + 1;
    const label = monthCount === 1 ? `mês ${startM}` : `${monthCount} meses`;

    clearForecastRange();

    if (planningDataCacheByYear && planningDataCacheByYear[year]) {
      applyPlanningOverrides(planningDataCacheByYear[year]);
      renderPlanning(planningDataCacheByYear[year]);
    }
    loadPlanning(year);

    showRefreshToast(`Previsão de ${formatCurrency(val)} salva para "${cat}" (${label})!`);
  }

  function deleteForecastRange() {
    if (!activeForecastRange) return;
    const cat = activeForecastRange.cat;
    const tipo = activeForecastRange.tipo;
    const year = activeForecastRange.year;
    const yStr = String(year);
    const startM = activeForecastRange.startMonth;
    const endM = activeForecastRange.endMonth;

    const overrides = getPlanningOverrides();
    if (!overrides[yStr]) overrides[yStr] = {};
    if (!overrides[yStr][cat]) overrides[yStr][cat] = {};

    const forecasts = getPlanningForecasts();
    if (!forecasts[yStr]) forecasts[yStr] = {};

    for (let m = startM; m <= endM; m++) {
      overrides[yStr][cat][m] = {
        val: 0,
        tipo: tipo,
        isManualOverride: true,
        isForecast: true,
        isDeletedForecast: true,
        updatedAt: Date.now()
      };
      if (forecasts[yStr][cat] && forecasts[yStr][cat].months) {
        delete forecasts[yStr][cat].months[m];
      }
    }

    // Se todos os meses futuros da categoria forem zerados, marca como isExcluded
    const now = window.getPlanningCurrentDate ? window.getPlanningCurrentDate() : new Date();
    const currentYear = now.getFullYear();
    const currentMonthNum = (year < currentYear) ? 12 : ((year > currentYear) ? 1 : (now.getMonth() + 1));
    let hasAnyFutureActive = false;
    for (let m = currentMonthNum; m <= 12; m++) {
      if (overrides[yStr][cat][m] && overrides[yStr][cat][m].val > 0) {
        hasAnyFutureActive = true;
        break;
      }
    }
    if (!hasAnyFutureActive && forecasts[yStr][cat]) {
      forecasts[yStr][cat].isExcluded = true;
      forecasts[yStr][cat].forecastValue = 0;
    }

    try {
      localStorage.setItem('fin_ally_planning_overrides', JSON.stringify(overrides));
      localStorage.setItem('fin_ally_planning_forecasts', JSON.stringify(forecasts));
    } catch(e) {}

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      if (google.script.run.savePlanningForecastsBackend) {
        google.script.run.savePlanningForecastsBackend(year, JSON.stringify(forecasts));
      }
      if (google.script.run.savePlanningOverrideBackend) {
        for (let m = startM; m <= endM; m++) {
          google.script.run.savePlanningOverrideBackend(year, cat, m, tipo, 0);
        }
      }
    }

    const monthCount = (endM - startM) + 1;
    const label = monthCount === 1 ? `mês ${startM}` : `${monthCount} meses`;

    clearForecastRange();

    if (planningDataCacheByYear && planningDataCacheByYear[year]) {
      applyPlanningOverrides(planningDataCacheByYear[year]);
      renderPlanning(planningDataCacheByYear[year]);
    }
    loadPlanning(year);

    showRefreshToast(`Previsão de "${cat}" excluída (${label})!`);
  }

  // --- CONTROLE DE CLIQUE (CÉLULAS ATUAIS/FUTURAS vs MESES PASSADOS) ---
  let planningCellClickTimer = null;

  $(document).on('click', '.planning-cell-action', function(e) {
    if ($(e.target).is('input')) return;
    
    const $td = $(this);
    const cat = decodeURIComponent($td.attr('data-cat') || '');
    const month = parseInt($td.attr('data-month'), 10);
    const tipo = $td.attr('data-tipo');
    const cellYear = parseInt($td.attr('data-year'), 10) || currentPlanningYear;
    const hasRealized = $td.attr('data-has-realized') === '1';
    const isFutureOrCurrent = isPlanningMonthForecast(cellYear, month);
    const isFutureUnrecorded = isFutureOrCurrent && !hasRealized;
    const isForecastCell = $td.attr('data-is-forecast') === '1' || isFutureUnrecorded;

    // SELEÇÃO COM CTRL: Segurar "Ctrl" e clicar em célula de previsão seleciona a linha inteira da previsão
    // O box de seleção normal NÃO abrirá! O box de exclusão em grupo já abrirá desde a 1ª seleção.
    if (e.ctrlKey || e.metaKey) {
      if (isForecastCell) {
        e.preventDefault();
        e.stopPropagation();
        if (planningCellClickTimer) {
          clearTimeout(planningCellClickTimer);
          planningCellClickTimer = null;
        }
        clearForecastRange(); // Garante que o box de seleção normal NÃO abrirá
        toggleSelectForecastCategory(cat, month, cellYear, tipo, $td);
        return;
      }
    }

    // Se é mês futuro ou mês vigente sem registro: ativa a seleção em lote / range de previsão normal (SEM Ctrl)
    if (isFutureUnrecorded) {
      if (planningCellClickTimer) {
        clearTimeout(planningCellClickTimer);
        planningCellClickTimer = null;
      }
      handleForecastCellRangeClick(cat, month, cellYear, tipo, $td);
      return;
    }

    // Se o usuário clicar em uma célula de mês passado, cancela eventual seleção de range
    if (activeForecastRange) {
      clearForecastRange();
    }

    // Se o usuário deu duplo clique rápido (detail >= 2), cancela o timer de 1 clique
    if (e.detail && e.detail > 1) {
      if (planningCellClickTimer) {
        clearTimeout(planningCellClickTimer);
        planningCellClickTimer = null;
      }
      return;
    }
    
    if (planningCellClickTimer) {
      clearTimeout(planningCellClickTimer);
      planningCellClickTimer = null;
    }

    // Meses passados: 1 clique abre o detalhamento de transações (gaveta)
    planningCellClickTimer = setTimeout(function() {
      planningCellClickTimer = null;
      openPlanningDrawer(cat, month, cellYear, tipo);
    }, 240);
  });

  $(document).on('dblclick', '.planning-cell-action', function(e) {
    if (planningCellClickTimer) {

      planningCellClickTimer = null;

    if ($(e.target).is('input')) return;
    
    const $td = $(this);
    const cat = decodeURIComponent($td.attr('data-cat') || '');
    const month = parseInt($td.attr('data-month'), 10);
    const tipo = $td.attr('data-tipo');
    const cellYear = parseInt($td.attr('data-year'), 10) || currentPlanningYear;

    // Mês futuro sem registro é tratado pelo sistema de range no 1º clique

  function renderDrawerTransactions(rows, cat, month, year, tipo) {
    const list = $('#planning-drawer-tx-list');
    list.empty();
    
    let filtered = (rows || []).filter(r => r.categoria === cat && r.tipo === tipo);

    filtered = filtered.filter(r => {
      if (!r.data) return false;
      const d = parseLocalDateString(r.data);
      return d.getFullYear() === year && (d.getMonth() + 1) === month;
    });

    if (filtered.length === 0) {
      $('#planning-drawer-empty').removeClass('hidden');
    } else {
      $('#planning-drawer-empty').addClass('hidden');
      
      const totalSum = filtered.reduce((acc, curr) => acc + (parseFloat(curr.valor) || 0), 0);
      
      // Resumo no topo da lista
      list.append(`
        <li class="p-3.5 mb-3 bg-blue-50/80 dark:bg-slate-700/60 rounded-xl border border-blue-100 dark:border-slate-600 flex items-center justify-between shadow-2xs">
          <div>
            <span class="text-xs font-bold uppercase tracking-wider text-primary dark:text-blue-300">Total Consolidado</span>
            <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">${filtered.length} ${filtered.length === 1 ? 'lançamento' : 'lançamentos'}</p>
          </div>
          <span class="text-base font-bold ${tipo === 'Entrada' ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}">
            ${formatCurrency(totalSum)}
          </span>
        </li>
      `);

      filtered.forEach(t => {
        const d = parseLocalDateString(t.data);
        const day = d.getDate().toString().padStart(2, '0');
        const monthNum = (d.getMonth() + 1).toString().padStart(2, '0');
        const yearFull = d.getFullYear();
        const dateFormatted = `${day}/${monthNum}/${yearFull}`;
        const isEntrada = t.tipo === 'Entrada';
        const color = isEntrada ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400';
        const sign = isEntrada ? '+' : '-';
        
        list.append(`
          <li class="py-3 px-3.5 bg-white dark:bg-slate-800/90 hover:bg-gray-50 dark:hover:bg-slate-700/50 rounded-xl transition-all border border-gray-200 dark:border-slate-700 mb-2 shadow-2xs">
            <div class="flex items-start justify-between gap-3">
              <div class="flex-1 min-w-0">
                <!-- Descrição -->
                <p class="text-sm font-semibold text-gray-900 dark:text-white truncate" title="${t.descricao || 'Sem descrição'}">
                  ${t.descricao || 'Sem descrição'}
                </p>
                <!-- Categoria e Data -->
                <div class="flex flex-wrap items-center gap-2 mt-1.5 text-xs">
                  <span class="inline-flex items-center gap-1.5 bg-gray-100 dark:bg-slate-700 text-gray-700 dark:text-gray-200 px-2 py-0.5 rounded-md font-medium">
                    <i class="fa-solid fa-tag text-[10px] text-primary"></i>
                    <span>${t.categoria || cat}</span>
                  </span>
                  <span class="inline-flex items-center gap-1.5 text-gray-600 dark:text-gray-300">
                    <i class="fa-regular fa-calendar text-[10px] text-gray-400"></i>
                    <span class="font-medium">${dateFormatted}</span>
                  </span>
                  ${t.origem ? `<span class="text-gray-300 dark:text-gray-600">•</span><span class="text-gray-400 dark:text-gray-500">${t.origem}</span>` : ''}
                </div>
              </div>
              <!-- Valor -->
              <div class="text-right shrink-0">
                <span class="text-sm font-bold ${color}">
                  ${sign} ${formatCurrency(Math.abs(t.valor))}
                </span>
              </div>
            </div>
          </li>
        `);
      });
    }
  }

  function generateMockPlanningData(year) {
    const now = new Date();
    const currentYear = now.getFullYear();
    const currentMonthNum = now.getMonth() + 1;
    const monthsMeta = Array.from({length: 12}, (_, i) => {
      let status = 'planned';
      if (year < currentYear || (year === currentYear && (i + 1) < currentMonthNum)) {
        status = 'realized';
      } else if (year === currentYear && (i + 1) === currentMonthNum) {
        status = 'current';
      }
      return {
        month: i + 1,
        status: status,
        name: ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'][i]
      };
    });

    function normCat(s) {
      return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
    }
    const excludedList = typeof getPlanningExcludedCategories === 'function' ? getPlanningExcludedCategories(year) : [];
    const excludedSet = new Set();
    excludedList.forEach(c => {
      excludedSet.add(c.trim().toLowerCase());
      excludedSet.add(normCat(c));
    });
    try {
      const fc = getPlanningForecasts();
      if (fc && fc[String(year)]) {
        Object.keys(fc[String(year)]).forEach(c => {
          if (fc[String(year)][c] && fc[String(year)][c].isExcluded) {
            excludedSet.add(c.trim().toLowerCase());
            excludedSet.add(normCat(c));
          }
        });
      }
    } catch(e) {}

    const incomeCategories = {};
    const expenseMacros = {
      'Fixas': {},
      'Variáveis Essenciais': {},
      'Discricionárias': {}
    };

    // Pre-seed all categories from GLOBAL_CATEGORIES (unless excluded for this year)
    const cats = (typeof GLOBAL_CATEGORIES !== 'undefined') ? GLOBAL_CATEGORIES : [];
    cats.forEach(c => {
      if (!c.name) return;
      if (excludedSet.has(c.name.trim().toLowerCase()) || excludedSet.has(normCat(c.name))) return;
      const p = (c.profile || '').toLowerCase();
      if (p.includes('transferência') || p.includes('transferencia')) return;

      const emptyMonths = () => Array.from({length: 12}, () => ({ realized: 0, planned: 0, total: 0 }));

      if (p.includes('receita')) {
        incomeCategories[c.name] = emptyMonths();
      } else if (p.includes('fixa')) {
        expenseMacros['Fixas'][c.name] = emptyMonths();
      } else if (p.includes('variável') || p.includes('variavel') || p.includes('essencial')) {
        expenseMacros['Variáveis Essenciais'][c.name] = emptyMonths();
      } else {
        expenseMacros['Discricionárias'][c.name] = emptyMonths();
      }
    });

    // Populate with amounts from currentLoadedTransactions or GLOBAL_MOCK_TRANSACTIONS
    let txs = (typeof currentLoadedTransactions !== 'undefined' && currentLoadedTransactions.length > 0)
      ? currentLoadedTransactions
      : ((typeof GLOBAL_MOCK_TRANSACTIONS !== 'undefined') ? GLOBAL_MOCK_TRANSACTIONS : []);
    if (typeof applyCategoryOverrides === 'function') {
      txs = applyCategoryOverrides(txs);
    }
    txs.forEach(t => {
      if (!t.data) return;
      const d = parseLocalDateString(t.data, year);
      if (d.getFullYear() !== year) return;
      const mIdx = d.getMonth();
      const val = Math.abs(parseFloat(t.valor) || 0);
      if (val === 0) return;

      let cat = String(t.categoria || '').trim();
      let tipo = String(t.tipo || '').trim();
      const desc = String(t.descricao || '').trim().toLowerCase();

      if (!cat || cat.toLowerCase() === 'outros' || cat.toLowerCase() === 'revisar') {
        if (desc.includes('salario') || desc.includes('remuneracao') || desc.includes('folha de pag')) {
          cat = 'SALARIO';
          tipo = 'Entrada';
        }
      }
      if (!cat) cat = (tipo === 'Entrada') ? 'Outras Receitas' : 'Outros';
      if (cat.toLowerCase() === 'salario' || cat.toLowerCase() === 'salário') cat = 'SALARIO';

      // Skip if category is excluded for this year
      if (excludedSet.has(cat.toLowerCase()) || excludedSet.has(normCat(cat))) return;

      if (tipo === 'Entrada' || cat === 'SALARIO' || desc.includes('salario')) {
        if (!incomeCategories[cat]) {
          incomeCategories[cat] = Array.from({length: 12}, () => ({ realized: 0, planned: 0, total: 0 }));
        }
        incomeCategories[cat][mIdx].realized += val;
        incomeCategories[cat][mIdx].total += val;
      } else {
        let found = false;
        for (const macro of ['Fixas', 'Variáveis Essenciais', 'Discricionárias']) {
          if (expenseMacros[macro] && expenseMacros[macro][cat]) {
            expenseMacros[macro][cat][mIdx].realized += val;
            expenseMacros[macro][cat][mIdx].total += val;
            found = true;
            break;
          }
        }
        if (!found) {
          if (!expenseMacros['Discricionárias'][cat]) {
            expenseMacros['Discricionárias'][cat] = Array.from({length: 12}, () => ({ realized: 0, planned: 0, total: 0 }));
          }
          expenseMacros['Discricionárias'][cat][mIdx].realized += val;
          expenseMacros['Discricionárias'][cat][mIdx].total += val;
        }
      }
    });

    if (!excludedSet.has('salario') && !excludedSet.has('salário') && !excludedSet.has('SALARIO')) {
      if (!incomeCategories['SALARIO']) {
        incomeCategories['SALARIO'] = Array.from({length: 12}, () => ({ realized: 0, planned: 0, total: 0 }));
      }
      if (incomeCategories['SALARIO'][8].realized === 0 && incomeCategories['SALARIO'][8].total === 0) {
        incomeCategories['SALARIO'][8].realized = 5000;
        incomeCategories['SALARIO'][8].total = 5000;
      }
    }

    // Final clean of any excluded categories
    Object.keys(incomeCategories).forEach(cat => {
      if (excludedSet.has(cat.toLowerCase()) || excludedSet.has(normCat(cat))) {
        delete incomeCategories[cat];
      }
    });
    ['Fixas', 'Variáveis Essenciais', 'Discricionárias'].forEach(macro => {
      if (expenseMacros[macro]) {
        Object.keys(expenseMacros[macro]).forEach(cat => {
          if (excludedSet.has(cat.toLowerCase()) || excludedSet.has(normCat(cat))) {
            delete expenseMacros[macro][cat];
          }
        });
      }
    });

    const monthlyTotals = Array.from({length: 12}, (_, i) => {
      let inc = 0;
      let exp = 0;
      Object.keys(incomeCategories).forEach(cat => {
        inc += incomeCategories[cat][i].total;
      });
      ['Fixas', 'Variáveis Essenciais', 'Discricionárias'].forEach(macro => {
        Object.keys(expenseMacros[macro]).forEach(cat => {
          exp += expenseMacros[macro][cat][i].total;
        });
      });
      return {
        income: inc,
        expense: exp,
        balance: inc - exp
      };
    });

    let incReal = 0, incPlan = 0, expReal = 0, expPlan = 0;
    monthlyTotals.forEach((m, idx) => {
      if (idx + 1 <= currentMonthNum) {
        incReal += m.income;
        expReal += m.expense;
      } else {
        incPlan += m.income;
        expPlan += m.expense;
      }
    });

    const currentBalance = incReal - expReal;
    const projectedBalance = (incReal + incPlan) - (expReal + expPlan);

    return {
      year: year,
      currentMonthNum: currentMonthNum,
      monthsMeta: monthsMeta,
      incomeCategories: incomeCategories,
      expenseMacros: expenseMacros,
      monthlyTotals: monthlyTotals,
      summary: {
        incomeRealized: incReal,
        incomePlanned: incPlan,
        expenseRealized: expReal,
        expensePlanned: expPlan,
        currentBalance: currentBalance,
        projectedBalance: projectedBalance
      }
    };
  }

  // ==========================================

</script>
