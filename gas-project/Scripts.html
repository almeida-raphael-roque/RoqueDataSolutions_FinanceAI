<script>

// Helper to parse "YYYY-MM-DD" safely without timezone shifts
  function parseLocalDateString(dateStr) {
    if (!dateStr) return new Date();
    const s = String(dateStr);
    const datePart = s.indexOf('T') !== -1 ? s.split('T')[0] : s;
    const parts = datePart.split('-');
    if (parts.length === 3) {
      return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
    }
    const ptParts = datePart.split('/');
    if (ptParts.length === 3) {
      return new Date(parseInt(ptParts[2], 10), parseInt(ptParts[1], 10) - 1, parseInt(ptParts[0], 10));
    }
    return new Date(dateStr);
  }

<script>
  function deleteCategory(name) {
    if(!confirm("Tem certeza que deseja excluir a categoria '" + name + "'? Esta ação não afetará as transações já importadas, apenas as regras de planejamento e categorização futura.")) return;
    
    // Remove locally from GLOBAL_CATEGORIES
    if (typeof GLOBAL_CATEGORIES !== 'undefined') {
      GLOBAL_CATEGORIES = GLOBAL_CATEGORIES.filter(c => c.name.toLowerCase() !== name.toLowerCase());
      saveCategoriesToStorage();
    }

    // Mostra indicador global de loading
    const oldHtml = $('#planning-tbody').html();
    $('#planning-tbody').html('<tr><td colspan="13" class="text-center py-10"><i class="fa-solid fa-circle-notch fa-spin text-primary text-3xl"></i></td></tr>');
    
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function() {
          invalidateCache();
          if(typeof renderCategoriesList === 'function') renderCategoriesList();
          loadPlanning();
        })
        .withFailureHandler(function(err) {
          alert("Erro ao excluir categoria: " + err.message);
          $('#planning-tbody').html(oldHtml);
        })
        .deleteCategory(name);
    } else {
      setTimeout(() => {
        invalidateCache();
        if(typeof renderCategoriesList === 'function') renderCategoriesList();
        loadPlanning();
      }, 300);
    }
  }

  function editCategoryFromPlanning(name) {
    if(!name) return;
    let cat = (typeof GLOBAL_CATEGORIES !== 'undefined') ? GLOBAL_CATEGORIES.find(c => c.name.toLowerCase() === name.toLowerCase()) : null;
    
    if (!cat) {
      let inferredProfile = 'Despesa Discricionária';
      if (typeof planningDataCache !== 'undefined' && planningDataCache) {
        if (planningDataCache.incomeCategories && planningDataCache.incomeCategories[name]) {
          inferredProfile = 'Receita Fixa';
        } else if (planningDataCache.expenseMacros) {
          if (planningDataCache.expenseMacros['Fixas'] && planningDataCache.expenseMacros['Fixas'][name]) {
            inferredProfile = 'Despesa Fixa';
          } else if (planningDataCache.expenseMacros['Variáveis Essenciais'] && planningDataCache.expenseMacros['Variáveis Essenciais'][name]) {
            inferredProfile = 'Despesa Variável';
          } else if (planningDataCache.expenseMacros['Discricionárias'] && planningDataCache.expenseMacros['Discricionárias'][name]) {
            inferredProfile = 'Despesa Discricionária';
          }
        }
      }
      cat = {
        id: Date.now(),
        name: name,
        profile: inferredProfile
      };
      if (typeof GLOBAL_CATEGORIES !== 'undefined') {
        GLOBAL_CATEGORIES.push(cat);
        saveCategoriesToStorage();
      }
    }
    
    $('#category-modal-id').val(cat.id);
    $('#cat-name').val(cat.name);
    $('#cat-profile').val(cat.profile || 'Despesa Discricionária');
    $('#category-modal-title').html('<i class="fa-solid fa-pen-to-square text-primary text-base"></i><span>Editar Categoria</span>');
    $('#btn-delete-category-modal').removeClass('hidden');
    $('#category-modal').removeClass('hidden');
    setTimeout(() => $('#cat-name').focus(), 100);
  }


  function toggleAllMacros(expand) {
    $('.planning-toggle-row').each(function() {
      const targetClass = $(this).data('target');
      const icon = $(this).find('i.fa-chevron-down');
      
      // Select the child rows (we target by the class)
      const children = $('.' + targetClass);
      
      if (!children.length) return;
      
      const isHidden = children.first().hasClass('hidden');
      
      if (expand && isHidden) {
        children.removeClass('hidden');
        icon.css('transform', 'rotate(-180deg)');
      } else if (!expand && !isHidden) {
        children.addClass('hidden');
        icon.css('transform', 'rotate(0deg)');
      }
    });
  }

  // Intelligent Normalization and Matching Functions
  function normalizeDescription(desc) {
    if (!desc) return "";
    let d = String(desc).toUpperCase();
    // Remove dates and times
    d = d.replace(/\b\d{1,2}[A-Z]{3}\b/g, ''); // 20Abr
    d = d.replace(/\b\d{2}H\d{2}MIN\b/g, ''); // 16h24min
    d = d.replace(/\b\d{2}\/\d{2}\/\d{4}\b/g, ''); // 10/10/2026
    // Remove common transaction prefixes
    d = d.replace(/^PAG\*\s*/, '');
    d = d.replace(/^COMPRA\s*/, '');
    d = d.replace(/^PIX\s*(ENVIADO|RECEBIDO)?\s*/, '');
    d = d.replace(/^DOC\s*/, '');
    d = d.replace(/^TED\s*/, '');
    // Remove common noise
    d = d.replace(/ PIX /g, ' ');
    d = d.replace(/ ENVIADO PARA /g, ' ');
    d = d.replace(/ RECEBIDO DE /g, ' ');
    d = d.replace(/ COMPRA APROVADA /g, ' ');
    d = d.replace(/\bLTDA\b/g, '');
    d = d.replace(/\bS\.A\.\b/g, '');
    d = d.replace(/\bS\/A\b/g, '');
    d = d.replace(/\bSAO PAULO\b/g, '');
    d = d.replace(/\bSP\b/g, ' ');
    d = d.replace(/\bGOIANIA\b/g, '');
    d = d.replace(/\bBRASILIA\b/g, '');
    d = d.replace(/\bBRA\b/g, '');
    // Remove special characters and collapse whitespaces
    d = d.replace(/[^A-Z0-9 ]/g, ' ');
    d = d.replace(/\s+/g, ' ').trim();
    return d;
  }

      { patterns: ['IBIS', 'DECOLAR', '123MILHAS', 'HOTEL', 'BOOKING', 'AIRBNB', 'GOL LINHAS', 'LATAM', 'AZUL LINHAS'], clean: 'Viagem / Passagens', cat: 'Viagem' },
      
      // Renda / Salário
      { patterns: ['SALARIO', 'RECEBIMENTO', 'PAGAMENTO SALARIO', 'HOLERITE', 'FOLHA PAGAMENTO', 'PRO-LABORE', 'DIVIDENDOS', 'RENDIMENTO'], clean: 'Salário / Renda', cat: 'Salário' }
    ];

    for (const rule of systemRules) {
      for (const pattern of rule.patterns) {
        if (text.includes(pattern)) {
          return { cleanDesc: rule.clean, category: rule.cat };
        }
      }
    }
    return null;

    // Helper to download base64
    function downloadBase64File(base64Data, mimeType, fileName) {
      const byteCharacters = atob(base64Data);
      const byteNumbers = new Array(byteCharacters.length);
      for (let i = 0; i < byteCharacters.length; i++) {
        byteNumbers[i] = byteCharacters.charCodeAt(i);
      }
      const byteArray = new Uint8Array(byteNumbers);
      const blob = new Blob([byteArray], {type: mimeType});
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.style.display = 'none';
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      window.URL.revokeObjectURL(url);
      document.body.removeChild(a);
    }

      const match = str.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/i);
      if (match && match[1]) {
        return match[1];
      }
      if (/^[a-zA-Z0-9-_]{20,}$/.test(str)) {
        return str;
      }
      return null;
    }

    function processImportFile(file) {
      $('#import-step-1').addClass('hidden');
      $('#import-step-2').removeClass('hidden');

      const reader = new FileReader();
      reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        let workbook;
        try {
          workbook = XLSX.read(data, {type: 'array'});
        } catch (err) {
          alert('Erro ao ler arquivo: ' + err.message);
          resetImportModal();
          return;
        }

        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        let json = XLSX.utils.sheet_to_json(worksheet, {header: 1, raw: false, dateNF: 'dd/mm/yyyy'});
        
        if(json.length < 2) {
          alert("O arquivo parece estar vazio ou sem dados.");
          resetImportModal();
          return;
        }

        analyzeAndCategorize(json);
      };
      reader.readAsArrayBuffer(file);
    }

    function analyzeAndCategorize(rows) {
      const headerRow = rows[0].map(h => String(h).toUpperCase().trim());
      
      // Detect column indices
      const idxData = headerRow.findIndex(h => h.includes('DATA'));
      const idxValor = headerRow.findIndex(h => h.includes('VALOR') || h.includes('R$'));
      const idxTipo = headerRow.findIndex(h => h.includes('TIPO') || h.includes('ENTRADA') || h.includes('SAÍDA'));
      const idxDesc = headerRow.findIndex(h => h.includes('DESCRI') || h.includes('HISTÓRICO'));
      const idxCat = headerRow.findIndex(h => h.includes('CATEGORIA'));

      if (idxData === -1 || idxValor === -1 || idxDesc === -1) {
        alert("Não foi possível identificar automaticamente as colunas (Data, Valor, Descrição). Certifique-se de que o arquivo contém cabeçalhos.");
        resetImportModal();
        return;
      }

      const parsedTransactions = [];
      
      for(let i=1; i<rows.length; i++) {
        const row = rows[i];
        if(!row || row.length === 0 || !row[idxData]) continue;
        
        let dataStr = String(row[idxData]).trim();
        // simple date normalizer assuming DD/MM/YYYY or DD/MM/YY
        let isoDate = dataStr;
        if(dataStr.includes('/')) {
          let p = dataStr.split('/');
          if(p.length === 3) {
            let year = p[2];
            if(year.length === 2) year = '20' + year; // handle YY
            isoDate = `${year}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;
          }
        } else if (dataStr.includes('-')) {
          let p = dataStr.split('-');
          if(p.length === 3 && p[0].length === 4) {
             isoDate = dataStr; // already YYYY-MM-DD
          } else if (p.length === 3 && p[2].length === 4) {
             isoDate = `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`; // DD-MM-YYYY
          }
        }

        let valStr = String(row[idxValor]).replace('R$', '').replace(/\s/g, '');
        // handle pt-br decimals 1.200,50 -> 1200.50
        if(valStr.includes(',') && valStr.includes('.')) {
          valStr = valStr.replace(/\./g, '').replace(',', '.');
        } else if (valStr.includes(',')) {
          valStr = valStr.replace(',', '.');
        }
        const valor = parseFloat(valStr) || 0;
        
        let rawDesc = row[idxDesc] || '';
        let normDesc = normalizeDescription(rawDesc);
        
        let tipo = idxTipo > -1 ? row[idxTipo] : '';
        tipo = String(tipo).toUpperCase();
        if(tipo.includes('ENTRADA') || tipo.includes('RECEITA') || tipo.includes('CREDITO')) tipo = 'Entrada';
        else if(tipo.includes('SAÍDA') || tipo.includes('DESPESA') || tipo.includes('DEBITO')) tipo = 'Saída';
        else tipo = valor > 0 ? 'Entrada' : 'Saída'; // Guess by positive/negative if no column
        
        let valorFinal = Math.abs(valor); // store positive
        
        let categoria = idxCat > -1 ? row[idxCat] : '';
        if (categoria) categoria = String(categoria).trim();

        let confianca = 'alta';
        let origem = 'Arquivo';
        
        if (!categoria) {
           // 1. Try Custom User Rules
           let ruleMatch = GLOBAL_RULES.find(r => normDesc.includes(r.pattern) || String(rawDesc).toUpperCase().includes(r.pattern));
           if(ruleMatch) {
             const matchedCat = GLOBAL_CATEGORIES.find(c => c.id == ruleMatch.categoryId);
             categoria = matchedCat ? matchedCat.name : 'Outros';
             normDesc = ruleMatch.clean; // update to clean description!
             origem = 'Usuário';
             confianca = 'alta';
           } else {
             // 2. Try System Rules
             let intelligentMatch = getIntelligentSystemMatch(rawDesc, normDesc);
             if (intelligentMatch) {
               categoria = intelligentMatch.category;
               normDesc = intelligentMatch.cleanDesc;
               origem = 'Sistema';
               confianca = 'alta';
               
               const catLower = categoria.toLowerCase();
               let existingCat = GLOBAL_CATEGORIES.find(c => c.name.toLowerCase() === catLower);
               if (!existingCat) {
                   const newProfile = tipo === 'Entrada' ? 'Receita Variável' : 'Despesa Discricionária';
                   existingCat = {
                       id: Date.now() + Math.random(),
                       name: categoria,
                       profile: newProfile
                   };
                   GLOBAL_CATEGORIES.push(existingCat);
                   saveCategoriesToStorage();
                   if(typeof renderCategoriesList === 'function') renderCategoriesList();
                   if(typeof populateRuleCategorySelect === 'function') populateRuleCategorySelect();
               }
               categoria = existingCat.name;
             } else {
               // 3. Fallback / AI Mock
               categoria = 'Revisar';
               origem = 'IA Sugestão';
               confianca = 'baixa';
             }
           }
        } else {
           origem = 'Arquivo';
           const catLower = categoria.toLowerCase();
           let existingCat = GLOBAL_CATEGORIES.find(c => c.name.toLowerCase() === catLower);
           if (!existingCat) {
               const newProfile = tipo === 'Entrada' ? 'Receita Variável' : 'Despesa Discricionária';
               existingCat = {
                   id: Date.now() + Math.random(),
                   name: categoria,
                   profile: newProfile
               };
               GLOBAL_CATEGORIES.push(existingCat);
               
               // Update UI components that rely on the global category list
               if(typeof renderCategoriesList === 'function') renderCategoriesList();
               if(typeof populateRuleCategorySelect === 'function') populateRuleCategorySelect();
           }
           categoria = existingCat.name;
        }

        parsedTransactions.push({
          data: isoDate,
          valor: valorFinal,
          tipo: tipo,
          descricao: rawDesc,
          normDesc: normDesc,
          categoria: categoria,
          origem: origem,
          confianca: confianca
        });
      }

      pendingImport = parsedTransactions;
      renderImportReview();
    }

          const tYear = parts[0];
          const tMonth = parseInt(parts[1], 10).toString();
          const mNum = tMonth.padStart(2, '0');
          
          const matchYear = year === 'all' || year === tYear;
          const matchMonth = month === 'all' || parseInt(month) === parseInt(tMonth);
          
          if (matchYear) {
             const key = `${tYear}-${mNum}`;
             const label = `${mNum}/${tYear}`;
             if (!temporalData[key]) temporalData[key] = { label, sortKey: key, income: 0, expense: 0 };
             if (t.tipo === 'Entrada') temporalData[key].income += t.valor;
             if (t.tipo === 'Saída') temporalData[key].expense += t.valor;
          }

          if (matchYear && matchMonth) {
             if (t.tipo === 'Entrada') {
               income += t.valor;
               if (!incomeCategoryGrouped[t.categoria]) incomeCategoryGrouped[t.categoria] = 0;
               incomeCategoryGrouped[t.categoria] += t.valor;
             }
             if (t.tipo === 'Saída') {
               expense += t.valor;
               const macro = getMacroCategory(t.categoria, t.descricao);
               macroGrouped[macro] += t.valor;
               
               if (!categoryGrouped[t.categoria]) categoryGrouped[t.categoria] = { value: 0, macros: { 'Fixas': 0, 'Variáveis Essenciais': 0, 'Discricionárias': 0 } };
               categoryGrouped[t.categoria].value += t.valor;
               categoryGrouped[t.categoria].macros[macro] += t.valor;
               
               if (!categoryBreakdown[t.categoria]) categoryBreakdown[t.categoria] = {};
               if (!categoryBreakdown[t.categoria][t.descricao]) categoryBreakdown[t.categoria][t.descricao] = { value: 0, macro: macro };
               categoryBreakdown[t.categoria][t.descricao].value += t.valor;
             }
          }
        });

        const mockChartData = Object.values(temporalData).sort((a,b) => a.sortKey.localeCompare(b.sortKey));
        
        const mockCategoryData = Object.keys(categoryGrouped).map(k => {
           const catData = categoryGrouped[k];
           const dominantMacro = Object.keys(catData.macros).reduce((a, b) => catData.macros[a] > catData.macros[b] ? a : b);
           const breakdownObj = categoryBreakdown[k];
           const breakdownArray = Object.keys(breakdownObj).map(desc => ({
             label: desc, value: breakdownObj[desc].value, color: MACRO_COLORS[breakdownObj[desc].macro]
           })).sort((a,b) => b.value - a.value);
           
           return { label: k, value: catData.value, color: MACRO_COLORS[dominantMacro], macro: dominantMacro, breakdown: breakdownArray };
        }).sort((a, b) => b.value - a.value);

        const mockIncomeCategoryData = Object.keys(incomeCategoryGrouped).map(k => ({
          label: k, value: incomeCategoryGrouped[k]
        })).sort((a,b) => b.value - a.value);

        const mockMacroData = Object.keys(macroGrouped).map(k => ({
          label: k, value: macroGrouped[k], color: MACRO_COLORS[k]
        })).filter(d => d.value > 0).sort((a,b) => b.value - a.value);

        let mockRawExpenses = GLOBAL_MOCK_TRANSACTIONS
          .filter(t => t.tipo === "Saída")
          .map(t => {
            const parts = t.data.split('-');
            return {
              date: new Date(parts[0], parseInt(parts[1])-1, parts[2]).getTime(),
              desc: t.descricao,
              value: t.valor
            }
          });

        renderDashboard({ 
          balance: income - expense, 
          income: income, 
          expense: expense, 
          chartData: mockChartData,
          categoryChartData: mockCategoryData,
          incomeCategoryChartData: mockIncomeCategoryData,
          macroChartData: mockMacroData,
          rawExpenses: mockRawExpenses
        });
      }, 500);
    }
  }

  function updateCategoryFilterDropdown() {
    const counts = {};
    let uncategorizedCount = 0;
    currentLoadedTransactions.forEach(t => {
      const c = (t.categoria || '').trim();
      if (!c || c === 'Revisar') {
        uncategorizedCount++;
      } else {
        counts[c] = (counts[c] || 0) + 1;
      }

    const total = currentLoadedTransactions.length;
    let html = `
      <button type="button" class="w-full text-left px-3 py-2 hover:bg-gray-50 dark:hover:!bg-slate-700 transition-colors flex items-center justify-between font-medium btn-set-cat-filter ${activeCategoryFilter === null ? 'text-primary font-bold bg-blue-50/60' : 'text-gray-700 dark:text-slate-300'}" data-cat="__ALL__">

    `;

    const sortedCats = Object.keys(counts).sort((a, b) => a.localeCompare(b, 'pt-BR'));
    sortedCats.forEach(cat => {
      const isSelected = activeCategoryFilter && activeCategoryFilter.toLowerCase() === cat.toLowerCase();
      html += `
        <button type="button" class="w-full text-left px-3 py-2 hover:bg-gray-50 dark:hover:!bg-slate-700 transition-colors flex items-center justify-between btn-set-cat-filter ${isSelected ? 'text-primary font-bold bg-blue-50/60' : 'text-gray-700 dark:text-slate-300'}" data-cat="${cat}">

            <span class="w-2 h-2 rounded-full mr-2 shrink-0 ${isSelected ? 'bg-primary ring-2 ring-blue-300' : 'bg-gray-300'}"></span>
            <span class="truncate">${cat}</span>
          </span>
          <span class="bg-gray-100 text-gray-600 dark:text-slate-400 px-2 py-0.5 rounded-full text-[10px] font-semibold shrink-0">${counts[cat]}</span>

      `;
    });

    if (uncategorizedCount > 0) {
      const isSelected = activeCategoryFilter === '__UNCATEGORIZED__';
      html += `
        <button type="button" class="w-full text-left px-3 py-2 hover:bg-red-50/60 dark:hover:!bg-slate-700 transition-colors flex items-center justify-between text-red-700 btn-set-cat-filter ${isSelected ? 'font-bold bg-red-50' : ''}" data-cat="__UNCATEGORIZED__">

        </button>
      `;
    }

    $('#category-filter-items').html(html);

    if (activeCategoryFilter !== null) {
      $('#btn-cat-filter-toggle').addClass('text-primary bg-blue-50 border-blue-200 dark:border-blue-800');
      $('#icon-cat-dropdown').addClass('text-primary');
    } else {
      $('#btn-cat-filter-toggle').removeClass('text-primary bg-blue-50 border-blue-200 dark:border-blue-800');
      $('#icon-cat-dropdown').removeClass('text-primary');
    }

  function applySortAndFilterTransactions() {
    const tbody = $('#transactions-body');
    tbody.empty();

    let displayRows = [...currentLoadedTransactions];

    // Description search filter
    const searchVal = ($('#tx-search-input').val() || txSearchQuery || '').trim().toLowerCase();
    if (searchVal) {
      displayRows = displayRows.filter(r => {
        const rawDesc = String(r.descricao || '').toLowerCase();
        const normDesc = normalizeDescription(r.descricao || '').toLowerCase();
        return rawDesc.includes(searchVal) || normDesc.includes(searchVal);
      });
    }

    // Category filter application
    if (activeCategoryFilter !== null) {
      if (activeCategoryFilter === '__UNCATEGORIZED__') {
        displayRows = displayRows.filter(r => !r.categoria || r.categoria === '' || r.categoria === 'Revisar');
        $('#active-category-name').text('Sem Categoria / Revisar');
      } else {
        displayRows = displayRows.filter(r => (r.categoria || '').trim().toLowerCase() === activeCategoryFilter.toLowerCase());
        $('#active-category-name').text(activeCategoryFilter);
      }
      $('#active-category-count').text(`${displayRows.length} transações`);
      $('#active-category-filter-bar').removeClass('hidden');
    } else {
      $('#active-category-filter-bar').addClass('hidden');
    }

    // Column sorting: 1st click desc, 2nd click asc
    if (currentSortCol) {
      displayRows.sort((a, b) => {
        let valA = a[currentSortCol];
        let valB = b[currentSortCol];

        let cmp = 0;
        if (currentSortCol === 'valor') {
          cmp = Number(valA || 0) - Number(valB || 0);
        } else if (currentSortCol === 'data') {
          const dA = parseLocalDateString(valA).getTime() || 0;
          const dB = parseLocalDateString(valB).getTime() || 0;
          cmp = dA - dB;
        } else {
          cmp = String(valA || '').localeCompare(String(valB || ''), 'pt-BR', { sensitivity: 'base' });
        }

        return currentSortDir === 'desc' ? -cmp : cmp;
      });
    }

  function openDeepDrilldown(descLabel) {
    $('#deep-drilldown-modal').removeClass('hidden');
    $('#deep-drilldown-title').text('Histórico: ' + descLabel);
    
    // Filter raw data for this sub-category
    const filtered = rawExpensesData.filter(d => d.desc === descLabel).sort((a, b) => a.date - b.date);
    
    // Group by Month/Year
    const temporalData = {};
    filtered.forEach(item => {
      const d = new Date(item.date);
      const mNum = (d.getMonth() + 1).toString().padStart(2, '0');
      const y = d.getFullYear();
      const key = `${y}-${mNum}`;
      const label = `${mNum}/${y}`;
      
      if (!temporalData[key]) temporalData[key] = { label: label, sortKey: key, value: 0 };
      temporalData[key].value += item.value;
    });
    
    const chartData = Object.values(temporalData).sort((a, b) => a.sortKey.localeCompare(b.sortKey));
    
    // Calculate metrics
    let avg = 0;
    let mom = 0;
    let trend = 'Sem dados';
    
    if (chartData.length > 0) {
      const total = chartData.reduce((acc, curr) => acc + curr.value, 0);
      avg = total / chartData.length;
      
      if (chartData.length > 1) {
        const last = chartData[chartData.length - 1].value;
        const prev = chartData[chartData.length - 2].value;
        if (prev > 0) {
          mom = ((last - prev) / prev) * 100;
        } else {
          mom = 100; // if previous was 0 and now has value
        }
      }
      
      if (mom > 0) trend = 'Subindo';
      else if (mom < 0) trend = 'Descendo';
      else trend = 'Estável';
    }
    
    $('#drilldown-avg').text(formatCurrency(avg));
    
    const momEl = $('#drilldown-mom');
    momEl.empty();
    if (chartData.length < 2) {
      momEl.text('-');
    } else {
      const momText = Math.abs(mom).toFixed(1) + '%';
      if (mom > 0) {
        momEl.html(`<i class="fa-solid fa-arrow-trend-up text-danger mr-2"></i><span class="text-danger">+${momText}</span>`);
      } else if (mom < 0) {
        momEl.html(`<i class="fa-solid fa-arrow-trend-down text-success mr-2"></i><span class="text-success">-${momText}</span>`);
      } else {
        momEl.html(`<span class="text-gray-500 dark:text-slate-500">0%</span>`);
      }
    }
    
    $('#drilldown-trend').text(trend);
    
    // Render chart
    const ctx = document.getElementById('deepDrilldownChart');
    if (!ctx) return;
    
    if (deepDrilldownChartInstance) {
      deepDrilldownChartInstance.destroy();
    }
    
    deepDrilldownChartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: chartData.map(d => d.label),
        datasets: [{
          label: 'Gastos',
          data: chartData.map(d => d.value),
          borderColor: '#ef4444',
          backgroundColor: 'rgba(239, 68, 68, 0.1)',
          fill: true,
          tension: 0.4,
          borderWidth: 2,
          pointBackgroundColor: '#ef4444',
          pointBorderColor: '#ffffff',
          pointBorderWidth: 2,
          pointRadius: 4,
          pointHoverRadius: 6
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          datalabels: { display: false },
          tooltip: {
            backgroundColor: 'rgba(17, 24, 39, 0.9)',
            titleFont: { family: 'Inter, sans-serif', size: 13 },
            bodyFont: { family: 'Inter, sans-serif', size: 13 },
            padding: 12,
            cornerRadius: 8,
            callbacks: {
              label: function(context) {
                return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(context.parsed.y);
              }
            }
          }
        },
        scales: {
          x: {
            grid: { display: false },
            ticks: { font: { family: 'Inter, sans-serif' }, color: '#6b7280' }
          },
          y: {
            beginAtZero: true,
            grid: { borderDash: [4, 4], color: '#f3f4f6' },
            ticks: { font: { family: 'Inter, sans-serif' }, color: '#6b7280' }
          }
        }
      }
    });
  }

    if (profile.includes('Variável') && profile.includes('Despesa')) return `<span class="bg-yellow-100 text-yellow-700 text-xs px-2 py-0.5 rounded-full font-medium">Variável</span>`;
    if (profile.includes('Discricionária')) return `<span class="bg-orange-100 text-orange-700 text-xs px-2 py-0.5 rounded-full font-medium">Discricionária</span>`;
    if (profile.includes('Receita Fixa')) return `<span class="bg-emerald-100 text-emerald-700 text-xs px-2 py-0.5 rounded-full font-medium">Receita Fixa</span>`;
    if (profile.includes('Receita Variável')) return `<span class="bg-teal-100 text-teal-700 text-xs px-2 py-0.5 rounded-full font-medium">Receita Variável</span>`;
    return `<span class="bg-gray-100 text-gray-700 dark:text-slate-300 text-xs px-2 py-0.5 rounded-full font-medium">${profile}</span>`;

  function getGroupedCategories() {
    const sortedCats = [...GLOBAL_CATEGORIES].sort((a, b) => a.name.localeCompare(b.name));
    
    const grouped = {};
    sortedCats.forEach(cat => {
      if(!grouped[cat.profile]) grouped[cat.profile] = [];
      grouped[cat.profile].push(cat);
    });
    
    const order = ['Despesa Fixa', 'Despesa Variável', 'Despesa Discricionária', 'Receita Fixa', 'Transferência'];
    const sortedProfiles = Object.keys(grouped).sort((a, b) => {
      let idxA = order.indexOf(a);
      let idxB = order.indexOf(b);
      if(idxA === -1) idxA = 99;
      if(idxB === -1) idxB = 99;
      return idxA - idxB;
    });
    return { grouped, sortedProfiles };
  }

    if (profile.includes('Despesa Fixa')) return { icon: 'fa-solid fa-calendar-minus', color: 'text-red-600', bg: 'bg-red-50' };

    if (profile.includes('Discricionária')) return { icon: 'fa-solid fa-basket-shopping', color: 'text-orange-600', bg: 'bg-orange-50' };
    if (profile.includes('Receita Fixa')) return { icon: 'fa-solid fa-hand-holding-dollar', color: 'text-emerald-600', bg: 'bg-emerald-50' };
    if (profile.includes('Receita Variável')) return { icon: 'fa-solid fa-chart-line', color: 'text-teal-600', bg: 'bg-teal-50' };

    function processSyncTransactions(rows) {
      $('#sync-loading').addClass('hidden');

      if (!rows || rows.length === 0) {
        $('#sync-empty').removeClass('hidden');
        $('#sync-content').addClass('hidden');
        return;
      }

      // Step 1: Ensure any pre-existing category in transactions is in GLOBAL_CATEGORIES
      const knownCatNames = new Set(GLOBAL_CATEGORIES.map(c => c.name.toLowerCase()));
      rows.forEach(r => {
        const cat = (r.categoria || '').trim();
        if (cat && cat !== 'Revisar' && cat !== 'Outros' && !knownCatNames.has(cat.toLowerCase())) {
          knownCatNames.add(cat.toLowerCase());
          GLOBAL_CATEGORIES.push({
            id: Date.now() + Math.floor(Math.random() * 1000),
            name: cat,
            profile: r.tipo === 'Entrada' ? 'Receita Variável' : 'Despesa Discricionária'
          });
        }
      });

      // Step 2: Analyze and classify each transaction
      syncTransactions = rows.map((r, index) => {
        const rawDesc = String(r.descricao || '').trim();
        const normDesc = normalizeDescription(rawDesc);
        let cat = String(r.categoria || '').trim();
        let origem = 'Pendente';
        let confianca = 'baixa';
        let saveRule = false;

        // Check user category overrides first
        const rawUpper = rawDesc.toUpperCase();
        const normUpper = normDesc.toUpperCase();
        if (CATEGORY_OVERRIDES[rawUpper]) {
          cat = CATEGORY_OVERRIDES[rawUpper];
          origem = 'Usuário';
          confianca = 'alta';
        } else if (CATEGORY_OVERRIDES[normUpper]) {
          cat = CATEGORY_OVERRIDES[normUpper];
          origem = 'Usuário';
          confianca = 'alta';
        } else {
          // Check user custom rules
          const userRuleMatch = GLOBAL_RULES.find(rule => {
            const p = (rule.pattern || '').trim().toUpperCase();
            if (!p) return false;
            return normDesc.includes(p) || rawDesc.toUpperCase().includes(p);
          });

          if (userRuleMatch) {
            const matchedCatObj = GLOBAL_CATEGORIES.find(c => c.id == userRuleMatch.categoryId);
            cat = matchedCatObj ? matchedCatObj.name : (userRuleMatch.clean || 'Outros');
            origem = 'Usuário';
            confianca = 'alta';
          } else {
            // Check intelligent system patterns
            const sysMatch = getIntelligentSystemMatch(rawDesc, normDesc);
            if (sysMatch) {
              cat = sysMatch.category;
              origem = 'Sistema';
              confianca = 'alta';

              // Auto-create category in GLOBAL_CATEGORIES if not already present
              if (!knownCatNames.has(cat.toLowerCase())) {
                knownCatNames.add(cat.toLowerCase());
                GLOBAL_CATEGORIES.push({
                  id: Date.now() + Math.floor(Math.random() * 1000),
                  name: cat,
                  profile: (r.tipo === 'Entrada' || cat.toLowerCase().includes('salário') || cat.toLowerCase().includes('receita')) ? 'Receita Fixa' : 'Despesa Variável'
                });
              }
            } else if (cat && cat !== 'Revisar' && cat !== 'Outros' && cat !== '') {
              // Already categorized previously
              origem = 'Existente';
              confianca = 'alta';
            } else {
              // Truly uncategorized
              cat = '';
              origem = 'Pendente';
              confianca = 'baixa';
            }
          }
        }

        const origCat = String(r.categoria || '').trim();
        return {
          rowIndex: r.rowIndex || (index + 1),
          data: r.data || '',
          valor: Number(r.valor) || 0,
          tipo: r.tipo || 'Saída',
          descricao: rawDesc,
          normDesc: normDesc || rawDesc,
          categoria: cat,
          originalCategoria: origCat,
          isUpdated: (cat !== '' && cat !== 'Revisar' && cat !== origCat),
          origem: origem,
          confianca: confianca,
          saveRule: saveRule
        };
      });

      renderCategoriesList();
      populateRuleCategorySelect();

      $('#sync-empty').addClass('hidden');
      $('#sync-content').removeClass('hidden');
      renderSyncTable();
    }

    function renderSyncTable() {
      const total = syncTransactions.length;
      const pendingCount = syncTransactions.filter(t => !t.categoria || t.categoria === '' || t.categoria === 'Revisar' || t.confianca === 'baixa').length;
      const autoCount = total - pendingCount;

      $('#sync-count-total').text(total);
      $('#sync-count-pending').text(pendingCount);
      $('#sync-count-auto').text(autoCount);

      $('#sync-summary-title').text('Resumo da Análise');
      $('#sync-summary-subtitle').text(`${total} transações analisadas (${autoCount} reconhecidas, ${pendingCount} para revisar)`);

      if (pendingCount > 0) {
        $('#sync-footer-status').html(`<span class="text-amber-600 font-semibold"><i class="fa-solid fa-circle-exclamation mr-1.5"></i>${pendingCount} transação(ões) pendente(s) de categoria</span>`);
      } else {
        $('#sync-footer-status').html(`<span class="text-emerald-600 font-semibold"><i class="fa-solid fa-circle-check mr-1.5"></i>Todas as ${total} transações estão categorizadas!</span>`);
      }

      // Filter rows
      let displayRows = syncTransactions.map((t, idx) => ({ ...t, originalIndex: idx }));
      if (syncFilter === 'pending') {
        displayRows = displayRows.filter(t => !t.categoria || t.categoria === '' || t.categoria === 'Revisar' || t.confianca === 'baixa');
      } else if (syncFilter === 'auto') {
        displayRows = displayRows.filter(t => t.categoria && t.categoria !== '' && t.categoria !== 'Revisar' && t.confianca === 'alta');
      }

      if (displayRows.length === 0) {
        $('#sync-review-body').html(`
          <tr>
            <td colspan="6" class="p-8 text-center text-gray-400 dark:text-slate-500">
              <i class="fa-solid fa-filter text-2xl mb-2 text-gray-300"></i>
              <p class="text-xs">Nenhuma transação encontrada para o filtro selecionado.</p>
            </td>
          </tr>
        `);
        return;
      }

      const { grouped, sortedProfiles } = getGroupedCategories();

      let html = '';
      displayRows.forEach(t => {
        const idx = t.originalIndex;
        let dateFormatted = t.data || '';
        if (dateFormatted && dateFormatted.includes('-')) {
          const parts = dateFormatted.split('-');
          if (parts.length === 3) dateFormatted = `${parts[2]}/${parts[1]}/${parts[0]}`;
        }

        // Build category options
        let catOptions = `<option value="" disabled ${!t.categoria ? 'selected' : ''}>-- Selecione a Categoria --</option>`;
        catOptions += `<option value="__NEW__" class="font-bold text-primary bg-blue-50">+ Criar Nova Categoria...</option>`;
        
        sortedProfiles.forEach(prof => {
          catOptions += `<optgroup label="${prof}">`;
          grouped[prof].forEach(c => {
            const isSel = (t.categoria && t.categoria.toLowerCase() === c.name.toLowerCase());
            catOptions += `<option value="${c.name}" ${isSel ? 'selected' : ''}>${c.name}</option>`;
          });
          catOptions += `</optgroup>`;
        });

        // If category is not in list yet, show it
        if (t.categoria && !GLOBAL_CATEGORIES.some(c => c.name.toLowerCase() === t.categoria.toLowerCase())) {
          catOptions += `<optgroup label="Nova"><option value="${t.categoria}" selected>${t.categoria}</option></optgroup>`;
        }

        // Origin badge
        let originBadge = '';
        if (t.origem === 'Sistema') {
          originBadge = `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-emerald-100 text-emerald-800 dark:text-emerald-200"><i class="fa-solid fa-robot mr-1 text-[10px]"></i>Padrão</span>`;
        } else if (t.origem === 'Usuário') {
          originBadge = `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-blue-100 text-blue-800"><i class="fa-solid fa-user-check mr-1 text-[10px]"></i>Regra</span>`;
        } else if (t.origem === 'Existente') {
          originBadge = `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-purple-100 text-purple-800"><i class="fa-solid fa-check-double mr-1 text-[10px]"></i>Existente</span>`;
        } else {
          originBadge = `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-amber-100 text-amber-800 dark:bg-amber-900/30 dark:text-amber-300"><i class="fa-solid fa-triangle-exclamation mr-1 text-[10px]"></i>Pendente</span>`;
        }

        const isUncategorized = (!t.categoria || t.categoria === 'Revisar');
        const selectBorderClass = isUncategorized ? 'border-red-300 dark:border-red-800 bg-red-50/50 text-red-700' : 'border-emerald-300 dark:border-emerald-700 bg-emerald-50/40 text-emerald-800 dark:text-emerald-200 font-medium';
        const rowBgClass = isUncategorized ? 'bg-red-50/15 hover:bg-red-50/30' : (t.origem === 'Usuário' ? 'bg-blue-50/15 hover:bg-blue-50/30' : 'hover:bg-gray-50 dark:hover:!bg-slate-700');

        html += `
          <tr class="${rowBgClass} transition-colors">
            <td class="p-3 text-xs text-gray-500 dark:text-slate-500 whitespace-nowrap">${dateFormatted}</td>
            <td class="p-3">
              <div class="font-semibold text-gray-800 dark:text-white text-xs">${t.normDesc || t.descricao}</div>
              ${t.descricao !== t.normDesc ? `<div class="text-[10px] text-gray-400 dark:text-slate-500 font-mono">${t.descricao}</div>` : ''}
            </td>
            <td class="p-3">
              <select class="sync-cat-select w-full border rounded-lg p-2 text-xs focus:ring-primary focus:border-primary shadow-2xs ${selectBorderClass}" data-index="${idx}">
                ${catOptions}
              </select>
              <div class="flex items-center space-x-1.5 mt-1.5">
                <label class="inline-flex items-center text-[11px] text-gray-500 dark:text-slate-500 hover:text-gray-700 dark:text-slate-300 cursor-pointer select-none">
                  <input type="checkbox" class="sync-rule-check rounded text-primary focus:ring-primary h-3.5 w-3.5 mr-1" data-index="${idx}" ${t.saveRule ? 'checked' : ''}>
                  <span>Lembrar regra para "<strong>${t.normDesc || t.descricao}</strong>"</span>
                </label>
              </div>
            </td>
            <td class="p-3 whitespace-nowrap">${originBadge}</td>
            <td class="p-3 text-right whitespace-nowrap">
              <div class="font-semibold text-xs ${t.tipo === 'Entrada' ? 'text-emerald-600' : 'text-gray-900 dark:text-white'}">
                ${t.tipo === 'Entrada' ? '+ ' : '- '}${formatCurrency(t.valor)}
              </div>
              <div class="text-[10px] text-gray-400 dark:text-slate-500">${t.tipo}</div>
            </td>
            <td class="p-3 text-center whitespace-nowrap">
              <button type="button" class="btn-delete-sync-row text-gray-400 dark:text-slate-500 hover:text-red-600 p-1.5 rounded-lg hover:bg-red-50 transition-colors" data-index="${idx}" title="Excluir esta transação">
                <i class="fa-solid fa-trash-can text-xs"></i>
              </button>
            </td>
          </tr>
        `;
      });

      $('#sync-review-body').html(html);
    }

    $('#btn-sync-categorize').click(function() {

    // Delete single row from sync modal
    $(document).on('click', '.btn-delete-sync-row', function() {
      const idx = $(this).data('index');
      const item = syncTransactions[idx];
      if (!item) return;

      const label = item.normDesc || item.descricao || 'esta transação';
      if (!confirm(`Deseja excluir a transação "${label}"?`)) {
        return;
      }

      if (item.rowIndex) {
        syncDeletedRowIndices.push(item.rowIndex);
        DELETED_OVERRIDES.add(`row_${item.rowIndex}`);
      }
      const rawDesc = String(item.descricao || '').trim().toUpperCase();
      const txKey = `${item.data}_${item.valor}_${rawDesc}`;
      DELETED_OVERRIDES.add(txKey);
      try {
        localStorage.setItem('finance_deleted_transactions', JSON.stringify([...DELETED_OVERRIDES]));
      } catch(e) {}

      // Remove from GLOBAL_MOCK_TRANSACTIONS
      GLOBAL_MOCK_TRANSACTIONS = GLOBAL_MOCK_TRANSACTIONS.filter(t => {
        const tKey = `${t.data}_${t.valor}_${String(t.descricao || '').trim().toUpperCase()}`;
        return tKey !== txKey;
      });

      // Remove from syncTransactions array
      syncTransactions.splice(idx, 1);
      renderSyncTable();
    });

    // Handle user manual category change with AUTOMATIC PROPAGATION TO IDENTICAL DESCRIPTIONS
    $(document).on('change', '.sync-cat-select', function() {
      const index = $(this).data('index');
      let newCat = $(this).val();

      if (newCat === '__NEW__') {
        const promptName = prompt("Digite o nome da nova categoria (ex: Supermercado, Farmácia):");
        if (!promptName || !promptName.trim()) {
          $(this).val(syncTransactions[index].categoria || '');
          return;
        }
        newCat = promptName.trim();
        let exists = GLOBAL_CATEGORIES.find(c => c.name.toLowerCase() === newCat.toLowerCase());
        if (!exists) {
          const isEntrada = syncTransactions[index].tipo === 'Entrada';
          const newCatObj = {
            id: Date.now() + Math.floor(Math.random() * 1000),
            name: newCat,
            profile: isEntrada ? 'Receita Variável' : 'Despesa Variável'
          };
          GLOBAL_CATEGORIES.push(newCatObj);
          renderCategoriesList();
          populateRuleCategorySelect();
        } else {
          newCat = exists.name;
        }
      }

      if (!newCat) return;

      const currentItem = syncTransactions[index];
      const refNorm = normalizeDescription(currentItem.descricao);
      const refRaw = (currentItem.descricao || '').trim().toUpperCase();

      // AUTOMATIC PROPAGATION:
      // When the user categorizes an item like "DONA 216 NORTE", all other identical descriptions
      // are immediately filled with this same category!
      let affectedCount = 0;
      syncTransactions.forEach(t => {
        const tNorm = normalizeDescription(t.descricao);
        const tRaw = (t.descricao || '').trim().toUpperCase();
        if ((refRaw && tRaw === refRaw) || (refNorm && tNorm === refNorm)) {
          t.categoria = newCat;
          t.confianca = 'alta';
          t.origem = 'Usuário';
          t.saveRule = true; // Auto-mark rule to be remembered permanently
          t.isUpdated = true;
          affectedCount++;
        }
      });

      // Register rule in memory
      if (refNorm) {
        let catObj = GLOBAL_CATEGORIES.find(c => c.name.toLowerCase() === newCat.toLowerCase());
        let catId = catObj ? catObj.id : 9;
        let existingRule = GLOBAL_RULES.find(r => r.pattern.toUpperCase() === refNorm.toUpperCase());
        if (!existingRule) {
          GLOBAL_RULES.push({
            id: Date.now(),
            pattern: refNorm,
            clean: refNorm,
            categoryId: catId
          });
          renderRulesList();
        }
      }

      renderSyncTable();
    });

    // Handle "Lembrar regra" checkbox change
    $(document).on('change', '.sync-rule-check', function() {
      const index = $(this).data('index');
      const checked = $(this).is(':checked');
      const currentItem = syncTransactions[index];
      const refRaw = (currentItem.descricao || '').trim().toUpperCase();
      const refNorm = normalizeDescription(currentItem.descricao);

      syncTransactions.forEach(t => {
        const tRaw = (t.descricao || '').trim().toUpperCase();
        const tNorm = normalizeDescription(t.descricao);
        if ((refRaw && tRaw === refRaw) || (refNorm && tNorm === refNorm)) {
          t.saveRule = checked;
        }
      });
    });

    // Handle filter tabs in sync modal
    $(document).on('click', '.sync-filter-btn', function() {
      $('.sync-filter-btn').removeClass('bg-gray-900 text-white border-gray-900')
        .addClass('bg-white dark:bg-slate-800 text-gray-700 dark:text-slate-300 border-gray-200 dark:border-slate-700');
      $(this).removeClass('bg-white dark:bg-slate-800 text-gray-700 dark:text-slate-300 text-red-600 text-amber-600 text-emerald-700 border-gray-200 dark:border-slate-700 border-red-200 border-amber-200 border-emerald-200')
        .addClass('bg-gray-900 text-white border-gray-900');
      syncFilter = $(this).data('filter');
      renderSyncTable();
    });

    // Quick New Category button in modal
    $('#btn-quick-new-cat').click(function() {
      const catName = prompt("Digite o nome da nova categoria:");
      if (catName && catName.trim()) {
        const name = catName.trim();
        let exists = GLOBAL_CATEGORIES.find(c => c.name.toLowerCase() === name.toLowerCase());
        if (!exists) {
          GLOBAL_CATEGORIES.push({
            id: Date.now(),
            name: name,
            profile: 'Despesa Variável'
          });
          saveCategoriesToStorage();
          renderCategoriesList();
          populateRuleCategorySelect();
          renderSyncTable();
        } else {
          alert("Esta categoria já existe!");
        }
      }
    });

    // Save and Apply Categorization to Transactions
    $('#btn-save-sync').click(function() {
      // Save only transactions that were actually updated (assigned/changed category)
      const updated = syncTransactions.filter(t => {
        const cat = String(t.categoria || '').trim();
        if (!cat || cat === 'Revisar') return false;
        return t.isUpdated || (cat !== String(t.originalCategoria || '').trim());
      });

      if (updated.length === 0 && syncDeletedRowIndices.length === 0) {
        alert("Nenhuma transação foi atualizada para salvar. Altere a categoria de pelo menos uma transação antes de salvar.");
        return;
      }

      const btn = $(this);
      const originalHtml = btn.html();
      btn.prop('disabled', true).html('<i class="fa-solid fa-spinner fa-spin mr-2"></i> Salvando...');

      // Save into CATEGORY_OVERRIDES ONLY for actually updated transactions
      updated.forEach(t => {
        const rawUpper = String(t.descricao || '').trim().toUpperCase();
        const normUpper = normalizeDescription(t.descricao || '').toUpperCase();
        if (rawUpper) CATEGORY_OVERRIDES[rawUpper] = t.categoria;
        if (normUpper) CATEGORY_OVERRIDES[normUpper] = t.categoria;
      });
      try {
        localStorage.setItem('finance_category_overrides', JSON.stringify(CATEGORY_OVERRIDES));
      } catch(e) {}

      // Update GLOBAL_MOCK_TRANSACTIONS across all months for updated ones only
      GLOBAL_MOCK_TRANSACTIONS = GLOBAL_MOCK_TRANSACTIONS.filter(t => {
        const raw = String(t.descricao || '').trim().toUpperCase();
        return !DELETED_OVERRIDES.has(`${t.data}_${t.valor}_${raw}`);
      }).map(t => {
        const rawUpper = String(t.descricao || '').trim().toUpperCase();
        const normUpper = normalizeDescription(t.descricao || '').toUpperCase();
        if (CATEGORY_OVERRIDES[rawUpper]) {
          t.categoria = CATEGORY_OVERRIDES[rawUpper];
        } else if (CATEGORY_OVERRIDES[normUpper]) {
          t.categoria = CATEGORY_OVERRIDES[normUpper];
        }
        return t;
      });

      // Send only actually updated transactions in updates
      const updates = updated.map(t => ({
        rowIndex: t.rowIndex,
        categoria: t.categoria,
        descricao: t.descricao
      }));

      const rulesToSave = [];
      const savedPatterns = new Set();
      updated.forEach(t => {
        if (t.saveRule && t.categoria && t.normDesc) {
          const pat = t.normDesc.toUpperCase();
          if (!savedPatterns.has(pat)) {
            savedPatterns.add(pat);
            let catObj = GLOBAL_CATEGORIES.find(c => c.name === t.categoria);
            let catId = catObj ? catObj.id : 9;
            rulesToSave.push({
              pattern: pat,
              clean: t.normDesc,
              categoria: t.categoria,
              categoryId: catId
            });
          }
        }
      });

      const successFeedback = updated.length === 1
        ? `Sucesso! 1 transação foi atualizada e salva com sucesso.`
        : `Sucesso! ${updated.length} transações foram atualizadas e salvas com sucesso.`;

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function() {
            btn.prop('disabled', false).html(originalHtml);
            $('#sync-categorize-modal').addClass('hidden');
            alert(successFeedback);
            renderCategoriesList();
            renderRulesList();
            invalidateCache();
          })
          .withFailureHandler(function(err) {
            btn.prop('disabled', false).html(originalHtml);
            alert("Erro ao salvar: " + (err.message || err));
          })
          .saveCategorizedTransactionsBatch(updates, rulesToSave, syncDeletedRowIndices);
      } else {
        // Standalone Preview Mode
        setTimeout(function() {
          rulesToSave.forEach(r => {
            if (!GLOBAL_RULES.find(rule => rule.pattern.toUpperCase() === r.pattern.toUpperCase())) {
              GLOBAL_RULES.push({
                id: Date.now() + Math.random(),
                pattern: r.pattern,
                clean: r.clean,
                categoryId: r.categoryId
              });
            }
          });

          btn.prop('disabled', false).html(originalHtml);
          $('#sync-categorize-modal').addClass('hidden');
          alert(successFeedback);
          renderCategoriesList();
          renderRulesList();
          invalidateCache();
        }, 400);
      }
    });

  // Dark Mode Logic

    const themeToggleText = $('#theme-toggle-text');
    const themeToggleThumb = $('#theme-toggle-thumb');

    }

</script><script>
// State Variables
let scCurrentDate = new Date();
let scTargets = JSON.parse(localStorage.getItem('finance_sc_targets')) || {};
let scGoals = JSON.parse(localStorage.getItem('finance_sc_goals')) || [];
let scClosedMonths = JSON.parse(localStorage.getItem('finance_sc_closed')) || {};

const scFormatMoney = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);

function scSaveData() {
  localStorage.setItem('finance_sc_targets', JSON.stringify(scTargets));
  localStorage.setItem('finance_sc_goals', JSON.stringify(scGoals));
  localStorage.setItem('finance_sc_closed', JSON.stringify(scClosedMonths));
}

function loadSpendingControl() {
  scRender();
}

function scRender() {
  const monthNames = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const monthVal = $('#filter-month').val();
  const yearVal = $('#filter-year').val();
  const now = new Date();
  const m = monthVal === 'all' ? now.getMonth() : parseInt(monthVal) - 1;
  const y = yearVal === 'all' ? now.getFullYear() : parseInt(yearVal);
  // Also sync scCurrentDate for any residual usage
  scCurrentDate.setMonth(m);
  scCurrentDate.setFullYear(y);
  
  const txs = (typeof GLOBAL_MOCK_TRANSACTIONS !== 'undefined') ? GLOBAL_MOCK_TRANSACTIONS : [];
  const parsedTxs = txs.map(t => {
    const d = parseLocalDateString(t.data);
    return { ...t, parsedDate: d };
  });

  const catStats = {};
  parsedTxs.forEach(t => {
    if(!t.categoria) return;
    if(!catStats[t.categoria]) {
      catStats[t.categoria] = { sum: 0, months: new Set(), tipo: t.tipo };
    }
    catStats[t.categoria].sum += t.valor;
    catStats[t.categoria].months.add(`${t.parsedDate.getFullYear()}-${t.parsedDate.getMonth()}`);
  });
  
  const histAvg = {};
  for(let c in catStats) {
    const numMonths = Math.max(1, catStats[c].months.size);
    histAvg[c] = catStats[c].sum / numMonths;
  }
  
  const currentMonthTxs = parsedTxs.filter(t => t.parsedDate.getMonth() === m && t.parsedDate.getFullYear() === y);
  
  const realized = {};
  let totalIncome = 0;
  let totalExpense = 0;
  
  currentMonthTxs.forEach(t => {
    if(!t.categoria) return;
    if(!realized[t.categoria]) realized[t.categoria] = 0;
    realized[t.categoria] += t.valor;
    
    if(t.tipo === 'Entrada') totalIncome += t.valor;
    else if(t.tipo === 'Saída') totalExpense += t.valor;
  });
  
  const totalEconomy = totalIncome - totalExpense;
  
  $('#sc-summary-incomes').text(scFormatMoney(totalIncome));
  $('#sc-summary-expenses').text(scFormatMoney(totalExpense));
  $('#sc-summary-savings').text(scFormatMoney(totalEconomy));
  
  const allCategories = (typeof GLOBAL_CATEGORIES !== 'undefined') ? GLOBAL_CATEGORIES : [];

  let projectedEconomy = 0;
  allCategories.forEach(cat => {
    const isIncome = cat.profile.toLowerCase().includes('receita') || cat.profile.toLowerCase().includes('salário');
    const avg = histAvg[cat.name] || 0;
    const target = scTargets[cat.name] !== undefined ? scTargets[cat.name] : avg;
    if (isIncome) {
      projectedEconomy += (target - avg);
    } else {
      projectedEconomy += (avg - target);
    }
  });

  const totalMonthlyTarget = scGoals.reduce((acc, g) => acc + (parseFloat(g.monthly)||0), 0);
  $('#sc-summary-goal').text(scFormatMoney(totalMonthlyTarget));
  
  let totalProgress = totalMonthlyTarget > 0 ? (projectedEconomy / totalMonthlyTarget) * 100 : 0;
  if (totalProgress < 0) totalProgress = 0;
  
  $('#sc-tracking-goal-val').text(scFormatMoney(totalMonthlyTarget));
  $('#sc-tracking-saved-val').text(scFormatMoney(projectedEconomy > 0 ? projectedEconomy : 0));
  $('#sc-tracking-progress-text').text(`${totalProgress.toFixed(0)}%`);
  $('#sc-tracking-progress-bar').css('width', `${Math.min(totalProgress, 100)}%`);
  
  let expensesHtml = '';
  let incomesHtml = '';
  
  const today = new Date();
  const isPastMonth = y < today.getFullYear() || (y === today.getFullYear() && m < today.getMonth());
  const isFutureMonth = y > today.getFullYear() || (y === today.getFullYear() && m > today.getMonth());
  
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  let daysPassed = daysInMonth;
  
  if (!isPastMonth && !isFutureMonth) {
    daysPassed = today.getDate();
  } else if (isFutureMonth) {
    daysPassed = 1;
  }

  let statusClass = "text-gray-600 bg-gray-100 dark:bg-slate-800 dark:text-slate-400";
  let statusText = "Em andamento";
  
  if (projectedEconomy >= totalMonthlyTarget) {
    const extra = projectedEconomy - totalMonthlyTarget;
    statusText = `Projetado: Atinge (+${scFormatMoney(extra)})`;
    statusClass = "text-emerald-700 bg-emerald-100 dark:bg-emerald-900/40 dark:text-emerald-400";
  } else {
    const faltou = totalMonthlyTarget - projectedEconomy;
    statusText = `Projetado: Faltam ${scFormatMoney(faltou)}`;
    statusClass = "text-yellow-700 bg-yellow-100 dark:bg-yellow-900/40 dark:text-yellow-400";
  }
  
  $('#sc-summary-status')
    .text(statusText)
    .removeClass()
    .addClass(`text-[11px] font-bold px-2 py-0.5 rounded ${statusClass}`);
  
  const monthKey = `${y}-${m}`;
  if (isPastMonth && !scClosedMonths[monthKey]) {
    if (totalEconomy > 0) {
      const totalTargetGoals = scGoals.reduce((a, b) => a + (parseFloat(b.target)||0), 0);
      scGoals.forEach(g => {
        const weight = totalTargetGoals > 0 ? (parseFloat(g.target)||0) / totalTargetGoals : 0;
        const dist = totalEconomy * weight;
        g.current = (parseFloat(g.current)||0) + dist;
      });
    }
    scClosedMonths[monthKey] = { economy: totalEconomy, distributed: true };
    scSaveData();
  }

  allCategories.forEach(cat => {
    const isIncome = cat.profile.toLowerCase().includes('receita') || cat.profile.toLowerCase().includes('salário');
    const tipo = isIncome ? 'Entrada' : 'Saída';
    
    const avg = histAvg[cat.name] || 0;
    const target = scTargets[cat.name] !== undefined ? scTargets[cat.name] : avg;
    const real = realized[cat.name] || 0;
    
    let proj = 0;
    if (isPastMonth) {
      proj = real;
    } else if (isFutureMonth) {
      proj = 0;
    } else {
      proj = (real / Math.max(1, daysPassed)) * daysInMonth;
    }
    
    let statHtml = '';
    let resultText = 'Em andamento';
    
    if (tipo === 'Saída') {
      if (isPastMonth) {
        if (real <= target) resultText = `<span class="text-emerald-600">Atingida (-${scFormatMoney(target - real)})</span>`;
        else resultText = `<span class="text-red-600">Não atingida (+${scFormatMoney(real - target)})</span>`;
        statHtml = '-';
      } else if (!isFutureMonth) {
        if (proj <= target) statHtml = `<span class="px-2 py-1 bg-emerald-100 text-emerald-800 rounded-lg text-[10px] font-bold">🟢 Dentro</span>`;
        else if (proj <= target * 1.1) statHtml = `<span class="px-2 py-1 bg-yellow-100 text-yellow-800 rounded-lg text-[10px] font-bold">🟡 Atenção</span>`;
        else statHtml = `<span class="px-2 py-1 bg-red-100 text-red-800 rounded-lg text-[10px] font-bold">🔴 Acima</span>`;
        resultText = 'Em andamento';
      } else {
        statHtml = '-';
        resultText = '-';
      }
    } else {
      if (isPastMonth) {
        if (real >= target) resultText = `<span class="text-emerald-600">Atingida (+${scFormatMoney(real - target)})</span>`;
        else resultText = `<span class="text-red-600">Não atingida (-${scFormatMoney(target - real)})</span>`;
        statHtml = '-';
      } else if (!isFutureMonth) {
        if (proj >= target) statHtml = `<span class="px-2 py-1 bg-emerald-100 text-emerald-800 rounded-lg text-[10px] font-bold">🟢 Dentro</span>`;
        else if (proj >= target * 0.9) statHtml = `<span class="px-2 py-1 bg-yellow-100 text-yellow-800 rounded-lg text-[10px] font-bold">🟡 Atenção</span>`;
        else statHtml = `<span class="px-2 py-1 bg-red-100 text-red-800 rounded-lg text-[10px] font-bold">🔴 Abaixo</span>`;
        resultText = 'Em andamento';
      } else {
        statHtml = '-';
        resultText = '-';
      }
    }
    
    const row = `
      <tr class="hover:bg-gray-50/50 transition-colors cursor-pointer" onclick="scOpenTargetModal('${cat.name}', ${avg})">
        <td class="px-5 py-3 text-gray-800 font-medium">${cat.name}</td>
        <td class="px-5 py-3 text-right text-gray-500">${scFormatMoney(avg)}</td>
        <td class="px-5 py-3 text-right font-bold text-gray-900 border-b border-gray-200 border-dashed hover:bg-gray-100">${scFormatMoney(target)}</td>
        <td class="px-5 py-3 text-right text-gray-700">${scFormatMoney(real)}</td>
        <td class="px-5 py-3 text-right text-gray-500 italic">${scFormatMoney(proj)}</td>
        <td class="px-5 py-3 text-center">${statHtml}</td>
        <td class="px-5 py-3 font-medium">${resultText}</td>
      </tr>
    `;
    
    if (tipo === 'Saída') expensesHtml += row;
    else incomesHtml += row;
  });
  
  if (!expensesHtml) expensesHtml = `<tr><td colspan="7" class="px-5 py-4 text-center text-gray-500">Nenhuma despesa encontrada.</td></tr>`;
  if (!incomesHtml) incomesHtml = `<tr><td colspan="7" class="px-5 py-4 text-center text-gray-500">Nenhuma receita encontrada.</td></tr>`;
  
  $('#sc-expenses-tbody').html(expensesHtml);
  $('#sc-incomes-tbody').html(incomesHtml);

  scRenderGoals();
}

function scRenderGoals() {

          </div>
        </div>
      </div>
    `;
  });
  
  if (scGoals.length === 0) {
    gridHtml = `

        <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-3">

  $('#sc-goals-grid').html(gridHtml);

let currentEditingCategory = null;

window.scOpenTargetModal = function(catName, avg) {

  // ==========================================

  let currentPlanningYear = new Date().getFullYear();

          planningDataCache = data;

          $('#planning-matrix-container').removeClass('hidden');

        .withFailureHandler(function(err) {

  function formatCell(valObj) {
    if (!valObj || valObj.total === 0) return '-';
    return valObj.total.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function renderPlanning(data) {
    const months = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

    projBalEl.text(formatCurrency(sum.projectedBalance));
    projBalEl.removeClass('text-gray-900 dark:text-white text-rose-600 dark:text-rose-400 text-purple-600 dark:text-purple-400');
    if (sum.projectedBalance < 0) projBalEl.addClass('text-rose-600 dark:text-rose-400');
    else if (sum.projectedBalance > 0) projBalEl.addClass('text-purple-600 dark:text-purple-400');
    else projBalEl.addClass('text-gray-900 dark:text-white');

    let theadHtml = `<tr><th class="px-4 py-3 sticky left-0 z-10 bg-gray-50 dark:bg-gray-900 border-r border-gray-200 dark:border-gray-700 min-w-[200px]">Categoria</th>`;
    data.monthsMeta.forEach(m => {
      let style = '';
      if (m.status === 'realized') style = 'text-gray-400 dark:text-gray-500 font-normal';
      else if (m.status === 'current') style = 'bg-blue-100 dark:bg-blue-900/30 text-blue-800 dark:text-blue-300 ring-2 ring-inset ring-primary font-bold rounded-t-md';
      else style = 'text-purple-600 dark:text-purple-400 font-medium';
      
      theadHtml += `<th class="px-3 py-3 text-center min-w-[100px] ${style}">${m.name}</th>`;
    });
    theadHtml += `<th class="px-4 py-3 text-right bg-gray-50 dark:bg-gray-900 font-bold border-l border-gray-200 dark:border-gray-700">Total Ano</th></tr>`;
    $('#planning-thead').html(theadHtml);

    let tbodyHtml = '';

    // RECEITAS
    let recMasterHtml = `<tr class="planning-toggle-row cursor-pointer select-none transition-colors bg-emerald-50 dark:bg-emerald-900/20 text-emerald-800 dark:text-emerald-300" data-target="row-receitas">
      <td class="px-4 py-3 sticky left-0 z-10 font-bold flex items-center justify-between bg-emerald-50 dark:bg-emerald-900/20 border-r border-gray-200 dark:border-gray-700">
        <span>Receitas</span>
        <i class="fa-solid fa-chevron-down text-xs transition-transform duration-200"></i>
      </td>`;
    
    let recTotals = Array(12).fill(0);
    let recYearTotal = 0;
    let recChildren = '';
    
    Object.keys(data.incomeCategories).sort().forEach(cat => {
      let catYearTotal = 0;
      let cellsHtml = '';
      data.incomeCategories[cat].forEach((m, idx) => {
        recTotals[idx] += m.total;
        catYearTotal += m.total;
        cellsHtml += `<td class="px-3 py-2 text-center planning-cell-action cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors" data-cat="${cat}" data-month="${idx+1}" data-tipo="Entrada">${formatCell(m)}</td>`;
      });
      recYearTotal += catYearTotal;
      recChildren += `<tr class="row-receitas hidden bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-750 transition-colors group">
        <td class="px-4 py-2 sticky left-0 z-10 bg-white dark:bg-gray-800 group-hover:bg-gray-50 dark:group-hover:bg-gray-750 border-r border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-300 pl-8 flex justify-between items-center">
          <span class="truncate pr-2" title="${cat}">${cat}</span>
          <div class="opacity-0 group-hover:opacity-100 flex items-center space-x-1.5 transition-opacity shrink-0">
            <button type="button" class="btn-edit-planning-cat bg-blue-50 hover:bg-blue-100 text-primary dark:bg-blue-900/40 dark:hover:bg-blue-900/60 dark:text-blue-300 rounded w-5 h-5 flex items-center justify-center transition-all shadow-sm" data-cat="${encodeURIComponent(cat)}" title="Editar / Mover Categoria">
              <i class="fa-solid fa-pen text-[10px]"></i>
            </button>
            <button type="button" class="btn-delete-planning-cat bg-rose-100 hover:bg-rose-200 text-rose-600 dark:bg-rose-900/40 dark:hover:bg-rose-900/60 dark:text-rose-300 rounded w-5 h-5 flex items-center justify-center transition-all shadow-sm" data-cat="${encodeURIComponent(cat)}" title="Excluir Categoria">
              <i class="fa-solid fa-minus text-[10px]"></i>
            </button>
          </div>
        </td>
        ${cellsHtml}
        <td class="px-4 py-2 text-right font-semibold text-emerald-600 dark:text-emerald-400 border-l border-gray-200 dark:border-gray-700 bg-gray-50/50 dark:bg-gray-900/30">${formatCurrency(catYearTotal)}</td>
      </tr>`;
    });

    recTotals.forEach(t => {
      recMasterHtml += `<td class="px-3 py-3 text-center font-bold">${t === 0 ? '-' : t.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>`;
    });
    recMasterHtml += `<td class="px-4 py-3 text-right font-bold border-l border-gray-200 dark:border-gray-700">${formatCurrency(recYearTotal)}</td></tr>`;
    
    tbodyHtml += recMasterHtml + recChildren;

    // DESPESAS
    const renderMacro = (macroName, rowClass, colorClasses, colorClassesTd, textClassTotal) => {
      if (!data.expenseMacros[macroName] || Object.keys(data.expenseMacros[macroName]).length === 0) return;
      
      let masterHtml = `<tr class="planning-toggle-row cursor-pointer select-none transition-colors ${colorClasses}" data-target="${rowClass}">
        <td class="px-4 py-3 sticky left-0 z-10 font-bold flex items-center justify-between ${colorClassesTd} border-r border-gray-200 dark:border-gray-700">
          <span>${macroName}</span>
          <i class="fa-solid fa-chevron-down text-xs transition-transform duration-200"></i>
        </td>`;
      
      let totals = Array(12).fill(0);
      let yearTotal = 0;
      let childrenHtml = '';

      Object.keys(data.expenseMacros[macroName]).sort().forEach(cat => {
        let catYearTotal = 0;
        let cellsHtml = '';
        data.expenseMacros[macroName][cat].forEach((m, idx) => {
          totals[idx] += m.total;
          catYearTotal += m.total;
          cellsHtml += `<td class="px-3 py-2 text-center planning-cell-action cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors" data-cat="${cat}" data-month="${idx+1}" data-tipo="Saída">${formatCell(m)}</td>`;
        });
        yearTotal += catYearTotal;
        childrenHtml += `<tr class="${rowClass} hidden bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-750 transition-colors group">
          <td class="px-4 py-2 sticky left-0 z-10 bg-white dark:bg-gray-800 group-hover:bg-gray-50 dark:group-hover:bg-gray-750 border-r border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-300 pl-8 flex justify-between items-center">
            <span class="truncate pr-2" title="${cat}">${cat}</span>
            <div class="opacity-0 group-hover:opacity-100 flex items-center space-x-1.5 transition-opacity shrink-0">
              <button type="button" class="btn-edit-planning-cat bg-blue-50 hover:bg-blue-100 text-primary dark:bg-blue-900/40 dark:hover:bg-blue-900/60 dark:text-blue-300 rounded w-5 h-5 flex items-center justify-center transition-all shadow-sm" data-cat="${encodeURIComponent(cat)}" title="Editar / Mover Categoria">
                <i class="fa-solid fa-pen text-[10px]"></i>
              </button>
              <button type="button" class="btn-delete-planning-cat bg-rose-100 hover:bg-rose-200 text-rose-600 dark:bg-rose-900/40 dark:hover:bg-rose-900/60 dark:text-rose-300 rounded w-5 h-5 flex items-center justify-center transition-all shadow-sm" data-cat="${encodeURIComponent(cat)}" title="Excluir Categoria">
                <i class="fa-solid fa-minus text-[10px]"></i>
              </button>
            </div>
          </td>
          ${cellsHtml}
          <td class="px-4 py-2 text-right font-semibold ${textClassTotal} border-l border-gray-200 dark:border-gray-700 bg-gray-50/50 dark:bg-gray-900/30">${formatCurrency(catYearTotal)}</td>
        </tr>`;
      });

      totals.forEach(t => {
        masterHtml += `<td class="px-3 py-3 text-center font-bold">${t === 0 ? '-' : t.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>`;
      });
      masterHtml += `<td class="px-4 py-3 text-right font-bold border-l border-gray-200 dark:border-gray-700">${formatCurrency(yearTotal)}</td></tr>`;
      
      tbodyHtml += masterHtml + childrenHtml;
    };

    renderMacro('Fixas', 'row-fixas', 'bg-rose-50 dark:bg-rose-900/20 text-rose-800 dark:text-rose-300', 'bg-rose-50 dark:bg-rose-900/20', 'text-rose-600 dark:text-rose-400');
    renderMacro('Variáveis Essenciais', 'row-essenciais', 'bg-orange-50 dark:bg-orange-900/20 text-orange-800 dark:text-orange-300', 'bg-orange-50 dark:bg-orange-900/20', 'text-orange-600 dark:text-orange-400');
    renderMacro('Discricionárias', 'row-discricionarias', 'bg-amber-50 dark:bg-amber-900/20 text-amber-800 dark:text-amber-300', 'bg-amber-50 dark:bg-amber-900/20', 'text-amber-600 dark:text-amber-400');

    $('#planning-tbody').html(tbodyHtml);

    let tfootHtml = `<tr>
      <td class="px-4 py-3 sticky left-0 z-10 bg-gray-100 dark:bg-gray-900 border-r border-gray-300 dark:border-gray-600">Saldo do Mês</td>`;
    let totalBalanceYear = 0;
    data.monthlyTotals.forEach(m => {
      totalBalanceYear += m.balance;
      let colorClass = m.balance < 0 ? 'text-rose-600 dark:text-rose-400' : 'text-gray-900 dark:text-white';
      tfootHtml += `<td class="px-3 py-3 text-center ${colorClass}">${m.balance === 0 ? '-' : m.balance.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>`;
    });
    let totalColorClass = totalBalanceYear < 0 ? 'text-rose-600 dark:text-rose-400' : 'text-gray-900 dark:text-white';
    tfootHtml += `<td class="px-4 py-3 text-right ${totalColorClass} border-l border-gray-300 dark:border-gray-600">${formatCurrency(totalBalanceYear)}</td></tr>`;
    
    $('#planning-tfoot').html(tfootHtml);
  }

  $(document).on('click', '.planning-toggle-row', function() {
    const targetClass = $(this).data('target');
    const icon = $(this).find('i.fa-chevron-down');
    
    $(`.${targetClass}`).toggleClass('hidden');
    
    if ($(`.${targetClass}`).first().hasClass('hidden')) {
      icon.css('transform', 'rotate(0deg)');
    } else {
      icon.css('transform', 'rotate(-180deg)');
    }
  });

  $(document).on('click', '.planning-cell-action', function() {
    const cat = $(this).data('cat');
    const month = parseInt($(this).data('month'));
    const tipo = $(this).data('tipo');
    const year = currentPlanningYear;

    $('#planning-drawer-title').text(cat);
    $('#planning-drawer-subtitle').text(`Mês ${month}/${year}`);
    
    $('#planning-drawer-tx-list').empty();
    $('#planning-drawer-empty').addClass('hidden');
    $('#planning-drawer-loading').removeClass('hidden');

    $('#modal-planning-drawer').removeClass('hidden');
    
    setTimeout(() => {
      $('#planning-drawer-backdrop').removeClass('opacity-0');
      $('#planning-drawer-panel').removeClass('translate-x-full');
    }, 10);

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(rows) {
          $('#planning-drawer-loading').addClass('hidden');
          renderDrawerTransactions(rows, cat, month, year, tipo);
        })
        .withFailureHandler(function(err) {
          console.error(err);
          $('#planning-drawer-loading').addClass('hidden');
          $('#planning-drawer-empty').removeClass('hidden');
        })
        .getTransactions(year.toString(), month.toString());
    } else {
      setTimeout(() => {
        $('#planning-drawer-loading').addClass('hidden');
        renderDrawerTransactions((typeof GLOBAL_MOCK_TRANSACTIONS !== 'undefined' ? GLOBAL_MOCK_TRANSACTIONS : []), cat, month, year, tipo);
      }, 300);
    }
  });

  function renderDrawerTransactions(rows, cat, month, year, tipo) {
    const list = $('#planning-drawer-tx-list');
    list.empty();
    
    let filtered = rows.filter(r => r.categoria === cat && r.tipo === tipo);

    filtered = filtered.filter(r => {
      const d = parseLocalDateString(r.data);
      return d.getFullYear() === year && (d.getMonth() + 1) === month;
    });

    if (filtered.length === 0) {
      $('#planning-drawer-empty').removeClass('hidden');
    } else {
      $('#planning-drawer-empty').addClass('hidden');
      filtered.forEach(t => {
        const d = parseLocalDateString(t.data);
        const dateStr = `${d.getDate().toString().padStart(2, '0')}/${(d.getMonth()+1).toString().padStart(2, '0')}`;
        const color = t.tipo === 'Entrada' ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400';
        list.append(`
          <li class="py-3 flex justify-between items-center group">
            <div>
              <p class="text-sm font-medium text-gray-900 dark:text-white">${t.descricao}</p>
              <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">${dateStr} &bull; ${t.origem || 'Manual'}</p>
            </div>
            <div class="text-sm font-bold ${color}">
              ${formatCurrency(t.valor)}
            </div>
          </li>
        `);
      });
    }
  }

  $('#btn-close-planning-drawer, #planning-drawer-backdrop').click(function() {
    $('#planning-drawer-backdrop').addClass('opacity-0');
    $('#planning-drawer-panel').addClass('translate-x-full');
    setTimeout(() => {
      $('#modal-planning-drawer').addClass('hidden');
    }, 300);
  });

  function generateMockPlanningData(year) {
    const currentMonthNum = new Date().getMonth() + 1;
    const monthsMeta = Array.from({length: 12}, (_, i) => ({
      month: i + 1,
      status: (i + 1 < currentMonthNum) ? 'realized' : (i + 1 === currentMonthNum) ? 'current' : 'planned',
      name: ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'][i]
    }));

    const incomeCategories = {};
    const expenseMacros = {
      'Fixas': {},
      'Variáveis Essenciais': {},
      'Discricionárias': {}
    };

    // Pre-seed all categories from GLOBAL_CATEGORIES
    const cats = (typeof GLOBAL_CATEGORIES !== 'undefined') ? GLOBAL_CATEGORIES : [];
    cats.forEach(c => {
      const p = (c.profile || '').toLowerCase();
      if (p.includes('transferência') || p.includes('transferencia')) return;

      const emptyMonths = () => Array.from({length: 12}, () => ({ realized: 0, planned: 0, total: 0 }));

      if (p.includes('receita')) {
        incomeCategories[c.name] = emptyMonths();
      } else if (p.includes('fixa')) {
        expenseMacros['Fixas'][c.name] = emptyMonths();
      } else if (p.includes('variável') || p.includes('variavel') || p.includes('essencial')) {
        expenseMacros['Variáveis Essenciais'][c.name] = emptyMonths();
      } else {
        expenseMacros['Discricionárias'][c.name] = emptyMonths();
      }
    });

    // Populate with amounts from GLOBAL_MOCK_TRANSACTIONS
    const txs = (typeof GLOBAL_MOCK_TRANSACTIONS !== 'undefined') ? GLOBAL_MOCK_TRANSACTIONS : [];
    txs.forEach(t => {
      if (!t.categoria || !t.data) return;
      const d = parseLocalDateString(t.data);
      if (d.getFullYear() !== year) return;
      const mIdx = d.getMonth();
      const val = Math.abs(parseFloat(t.valor) || 0);

      if (t.tipo === 'Entrada') {
        if (!incomeCategories[t.categoria]) {
          incomeCategories[t.categoria] = Array.from({length: 12}, () => ({ realized: 0, planned: 0, total: 0 }));
        }
        incomeCategories[t.categoria][mIdx].realized += val;
        incomeCategories[t.categoria][mIdx].total += val;
      } else if (t.tipo === 'Saída') {
        let found = false;
        for (const macro of ['Fixas', 'Variáveis Essenciais', 'Discricionárias']) {
          if (expenseMacros[macro] && expenseMacros[macro][t.categoria]) {
            expenseMacros[macro][t.categoria][mIdx].realized += val;
            expenseMacros[macro][t.categoria][mIdx].total += val;
            found = true;
            break;
          }
        }
        if (!found) {
          if (!expenseMacros['Discricionárias'][t.categoria]) {
            expenseMacros['Discricionárias'][t.categoria] = Array.from({length: 12}, () => ({ realized: 0, planned: 0, total: 0 }));
          }
          expenseMacros['Discricionárias'][t.categoria][mIdx].realized += val;
          expenseMacros['Discricionárias'][t.categoria][mIdx].total += val;
        }
      }
    });

    const monthlyTotals = Array.from({length: 12}, (_, i) => {
      let inc = 0;
      let exp = 0;
      Object.keys(incomeCategories).forEach(cat => {
        inc += incomeCategories[cat][i].total;
      });
      ['Fixas', 'Variáveis Essenciais', 'Discricionárias'].forEach(macro => {
        Object.keys(expenseMacros[macro]).forEach(cat => {
          exp += expenseMacros[macro][cat][i].total;
        });
      });
      return {
        income: inc,
        expense: exp,
        balance: inc - exp
      };
    });

    let incReal = 0, incPlan = 0, expReal = 0, expPlan = 0;
    monthlyTotals.forEach((m, idx) => {
      if (idx + 1 <= currentMonthNum) {
        incReal += m.income;
        expReal += m.expense;
      } else {
        incPlan += m.income;
        expPlan += m.expense;
      }
    });

    const currentBalance = incReal - expReal;
    const projectedBalance = (incReal + incPlan) - (expReal + expPlan);

    return {
      year: year,
      currentMonthNum: currentMonthNum,
      monthsMeta: monthsMeta,
      incomeCategories: incomeCategories,
      expenseMacros: expenseMacros,
      monthlyTotals: monthlyTotals,
      summary: {
        incomeRealized: incReal,
        incomePlanned: incPlan,
        expenseRealized: expReal,
        expensePlanned: expPlan,
        currentBalance: currentBalance,
        projectedBalance: projectedBalance
      }
    };
  }

  // ==========================================

</script>
