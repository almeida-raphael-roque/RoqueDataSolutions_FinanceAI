  const now = new Date();
  const m = monthVal === 'all' ? now.getMonth() : parseInt(monthVal) - 1;
  const y = yearVal === 'all' ? now.getFullYear() : parseInt(yearVal);
  // Also sync scCurrentDate for any residual usage
  scCurrentDate.setMonth(m);
  scCurrentDate.setFullYear(y);
  
  const isGoogle = (typeof google !== 'undefined' && google.script && google.script.run);
  const txs = (typeof currentLoadedTransactions !== 'undefined' && currentLoadedTransactions.length > 0)
    ? currentLoadedTransactions
    : (!isGoogle && typeof GLOBAL_MOCK_TRANSACTIONS !== 'undefined' ? GLOBAL_MOCK_TRANSACTIONS : []);
  const parsedTxs = txs.map(t => {
    const d = parseLocalDateString(t.data);
    return { ...t, parsedDate: d };
  });

  const catStats = {};
  parsedTxs.forEach(t => {
    if(!t.categoria) return;
    if(!catStats[t.categoria]) {
      catStats[t.categoria] = { sum: 0, months: new Set(), tipo: t.tipo };
    }
    catStats[t.categoria].sum += t.valor;
    catStats[t.categoria].months.add(`${t.parsedDate.getFullYear()}-${t.parsedDate.getMonth()}`);
  });
  
  const histAvg = {};
  for(let c in catStats) {
    const numMonths = Math.max(1, catStats[c].months.size);
    histAvg[c] = catStats[c].sum / numMonths;
  }
  
  const currentMonthTxs = parsedTxs.filter(t => t.parsedDate.getMonth() === m && t.parsedDate.getFullYear() === y);
  
  const realized = {};
  let totalIncome = 0;
  let totalExpense = 0;
  
  currentMonthTxs.forEach(t => {
    if(!t.categoria) return;
    if(!realized[t.categoria]) realized[t.categoria] = 0;
    realized[t.categoria] += t.valor;
    
    if(t.tipo === 'Entrada') totalIncome += t.valor;
    else if(t.tipo === 'Saída') totalExpense += t.valor;
  });
  
  const totalEconomy = totalIncome - totalExpense;
  
  $('#sc-summary-incomes').text(scFormatMoney(totalIncome));
  $('#sc-summary-expenses').text(scFormatMoney(totalExpense));
  $('#sc-summary-savings').text(scFormatMoney(totalEconomy));
  
  const allCategories = (typeof GLOBAL_CATEGORIES !== 'undefined') ? GLOBAL_CATEGORIES : [];

  let projectedEconomy = 0;
  allCategories.forEach(cat => {
    const isIncome = cat.profile.toLowerCase().includes('receita') || cat.profile.toLowerCase().includes('salário');
    const avg = histAvg[cat.name] || 0;
    const target = scTargets[cat.name] !== undefined ? scTargets[cat.name] : avg;
    if (isIncome) {
      projectedEconomy += (target - avg);
    } else {
      projectedEconomy += (avg - target);
    }
  });

  const totalMonthlyTarget = scGoals.reduce((acc, g) => acc + (parseFloat(g.monthly)||0), 0);
  $('#sc-summary-goal').text(scFormatMoney(totalMonthlyTarget));
  
  let totalProgress = totalMonthlyTarget > 0 ? (projectedEconomy / totalMonthlyTarget) * 100 : 0;
  if (totalProgress < 0) totalProgress = 0;
  
  $('#sc-tracking-goal-val').text(scFormatMoney(totalMonthlyTarget));
  $('#sc-tracking-saved-val').text(scFormatMoney(projectedEconomy > 0 ? projectedEconomy : 0));
  $('#sc-tracking-progress-text').text(`${totalProgress.toFixed(0)}%`);
  $('#sc-tracking-progress-bar').css('width', `${Math.min(totalProgress, 100)}%`);
  
  let expensesHtml = '';
  let incomesHtml = '';
  
  const today = new Date();
  const isPastMonth = y < today.getFullYear() || (y === today.getFullYear() && m < today.getMonth());
  const isFutureMonth = y > today.getFullYear() || (y === today.getFullYear() && m > today.getMonth());
  
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  let daysPassed = daysInMonth;
  
  if (!isPastMonth && !isFutureMonth) {
    daysPassed = today.getDate();
  } else if (isFutureMonth) {
    daysPassed = 1;
  }

  let statusClass = "text-gray-600 bg-gray-100 dark:bg-slate-800 dark:text-slate-400";
  let statusText = "Em andamento";
  
  if (projectedEconomy >= totalMonthlyTarget) {
    const extra = projectedEconomy - totalMonthlyTarget;
    statusText = `Projetado: Atinge (+${scFormatMoney(extra)})`;
    statusClass = "text-emerald-700 bg-emerald-100 dark:bg-emerald-900/40 dark:text-emerald-400";
  } else {
    const faltou = totalMonthlyTarget - projectedEconomy;
    statusText = `Projetado: Faltam ${scFormatMoney(faltou)}`;
    statusClass = "text-yellow-700 bg-yellow-100 dark:bg-yellow-900/40 dark:text-yellow-400";
  }
  
  $('#sc-summary-status')
    .text(statusText)
    .removeClass()
    .addClass(`text-[11px] font-bold px-2 py-0.5 rounded ${statusClass}`);
  
  const monthKey = `${y}-${m}`;
  if (isPastMonth && !scClosedMonths[monthKey]) {
    if (totalEconomy > 0) {
      const totalTargetGoals = scGoals.reduce((a, b) => a + (parseFloat(b.target)||0), 0);
      scGoals.forEach(g => {
        const weight = totalTargetGoals > 0 ? (parseFloat(g.target)||0) / totalTargetGoals : 0;
        const dist = totalEconomy * weight;
        g.current = (parseFloat(g.current)||0) + dist;
      });
    }
    scClosedMonths[monthKey] = { economy: totalEconomy, distributed: true };
    scSaveData();
  }

  allCategories.forEach(cat => {
    const isIncome = cat.profile.toLowerCase().includes('receita') || cat.profile.toLowerCase().includes('salário');
    const tipo = isIncome ? 'Entrada' : 'Saída';
    
    const avg = histAvg[cat.name] || 0;
    const target = scTargets[cat.name] !== undefined ? scTargets[cat.name] : avg;
    const real = realized[cat.name] || 0;
    
    let proj = 0;
    if (isPastMonth) {
      proj = real;
    } else if (isFutureMonth) {
      proj = 0;
    } else {
      proj = (real / Math.max(1, daysPassed)) * daysInMonth;
    }
    
    let statHtml = '';
    let resultText = 'Em andamento';
    
    if (tipo === 'Saída') {
      if (isPastMonth) {
        if (real <= target) resultText = `<span class="text-emerald-600">Atingida (-${scFormatMoney(target - real)})</span>`;
        else resultText = `<span class="text-red-600">Não atingida (+${scFormatMoney(real - target)})</span>`;
        statHtml = '-';
      } else if (!isFutureMonth) {
        if (proj <= target) statHtml = `<span class="px-2 py-1 bg-emerald-100 text-emerald-800 rounded-lg text-[10px] font-bold">🟢 Dentro</span>`;
        else if (proj <= target * 1.1) statHtml = `<span class="px-2 py-1 bg-yellow-100 text-yellow-800 rounded-lg text-[10px] font-bold">🟡 Atenção</span>`;
        else statHtml = `<span class="px-2 py-1 bg-red-100 text-red-800 rounded-lg text-[10px] font-bold">🔴 Acima</span>`;
        resultText = 'Em andamento';
      } else {
        statHtml = '-';
        resultText = '-';
      }
    } else {
      if (isPastMonth) {
        if (real >= target) resultText = `<span class="text-emerald-600">Atingida (+${scFormatMoney(real - target)})</span>`;
        else resultText = `<span class="text-red-600">Não atingida (-${scFormatMoney(target - real)})</span>`;
        statHtml = '-';
      } else if (!isFutureMonth) {
        if (proj >= target) statHtml = `<span class="px-2 py-1 bg-emerald-100 text-emerald-800 rounded-lg text-[10px] font-bold">🟢 Dentro</span>`;
        else if (proj >= target * 0.9) statHtml = `<span class="px-2 py-1 bg-yellow-100 text-yellow-800 rounded-lg text-[10px] font-bold">🟡 Atenção</span>`;
        else statHtml = `<span class="px-2 py-1 bg-red-100 text-red-800 rounded-lg text-[10px] font-bold">🔴 Abaixo</span>`;
        resultText = 'Em andamento';
      } else {
        statHtml = '-';
        resultText = '-';
      }
    }
    
    const row = `
      <tr class="hover:bg-gray-50/50 transition-colors cursor-pointer" onclick="scOpenTargetModal('${cat.name}', ${avg})">
        <td class="px-5 py-3 text-gray-800 font-medium">${cat.name}</td>
        <td class="px-5 py-3 text-right text-gray-500">${scFormatMoney(avg)}</td>
        <td class="px-5 py-3 text-right font-bold text-gray-900 border-b border-gray-200 border-dashed hover:bg-gray-100">${scFormatMoney(target)}</td>
        <td class="px-5 py-3 text-right text-gray-700">${scFormatMoney(real)}</td>
        <td class="px-5 py-3 text-right text-gray-500 italic">${scFormatMoney(proj)}</td>
        <td class="px-5 py-3 text-center">${statHtml}</td>
        <td class="px-5 py-3 font-medium">${resultText}</td>
      </tr>
    `;
    
    if (tipo === 'Saída') expensesHtml += row;
    else incomesHtml += row;
  });
  
  if (!expensesHtml) expensesHtml = `<tr><td colspan="7" class="px-5 py-4 text-center text-gray-500">Nenhuma despesa encontrada.</td></tr>`;
  if (!incomesHtml) incomesHtml = `<tr><td colspan="7" class="px-5 py-4 text-center text-gray-500">Nenhuma receita encontrada.</td></tr>`;
  
  $('#sc-expenses-tbody').html(expensesHtml);
  $('#sc-incomes-tbody').html(incomesHtml);

  scRenderGoals();
}

function scRenderGoals() {
  const totalTarget = scGoals.reduce((acc, g) => acc + (parseFloat(g.target)||0), 0);
  const totalMonthly = scGoals.reduce((acc, g) => acc + (parseFloat(g.monthly)||0), 0);
  
  $('#sc-goals-total-target').text(scFormatMoney(totalTarget));
  $('#sc-goals-total-monthly').text(scFormatMoney(totalMonthly));
  $('#sc-tracking-total-goals').text(scFormatMoney(totalTarget));
  
  let gridHtml = '';
  scGoals.forEach((g, idx) => {
    const prog = g.target > 0 ? (g.current / g.target) * 100 : 0;
    const missing = g.target - g.current;
    let monthsLeft = '-';
    if (missing > 0 && g.monthly > 0) {
      monthsLeft = Math.ceil(missing / g.monthly) + ' meses';
    } else if (missing <= 0) {
      monthsLeft = 'Atingido!';
    }
    
    const weight = totalTarget > 0 ? (g.target / totalTarget) * 100 : 0;
    
    gridHtml += `
      <div class="bg-white border border-gray-200 rounded-xl p-5 shadow-sm hover:shadow-md transition-shadow relative">
        <button onclick="scOpenGoalModal(${idx})" class="absolute top-4 right-4 text-gray-400 hover:text-primary transition-colors">
          <i class="fa-solid fa-pen"></i>
        </button>
        <h4 class="font-bold text-gray-900 text-lg mb-4 pr-6">${g.name}</h4>
        
        <div class="space-y-3">
          <div class="flex justify-between items-center text-sm border-b border-gray-100 pb-2">
            <span class="text-gray-500">Meta:</span>
            <span class="font-bold text-gray-800">${scFormatMoney(g.target)}</span>
          </div>
          <div class="flex justify-between items-center text-sm border-b border-gray-100 pb-2">
            <span class="text-gray-500">Acumulado:</span>
            <span class="font-bold text-emerald-600">${scFormatMoney(g.current)}</span>
          </div>
          <div class="flex justify-between items-center text-sm border-b border-gray-100 pb-2">
            <span class="text-gray-500">Aporte mensal:</span>
            <span class="font-medium text-gray-700">${scFormatMoney(g.monthly)}</span>
          </div>
          <div class="flex justify-between items-center text-sm border-b border-gray-100 pb-2">
            <span class="text-gray-500">Previsão:</span>
            <span class="font-medium text-gray-700">${monthsLeft}</span>
          </div>
          <div class="pt-2">
            <div class="flex justify-between text-xs mb-1">
              <span class="font-semibold text-gray-700">Progresso</span>
              <span class="font-bold text-primary">${prog.toFixed(1)}%</span>
            </div>
            <div class="w-full bg-gray-100 rounded-full h-2">
              <div class="bg-primary h-2 rounded-full" style="width: ${Math.min(prog, 100)}%"></div>
            </div>
            <div class="text-[10px] text-gray-400 text-right mt-1">Peso: ${weight.toFixed(1)}%</div>
          </div>
        </div>
      </div>
    `;
  });
  
  if (scGoals.length === 0) {
    gridHtml = `
      <div class="col-span-full py-12 text-center text-gray-500 border-2 border-dashed border-gray-200 rounded-xl">
        <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-3">
          <i class="fa-solid fa-bullseye text-2xl text-gray-400"></i>
        </div>
        <p class="font-medium">Nenhum objetivo cadastrado.</p>
        <p class="text-sm mt-1">Clique em "Novo Objetivo" para começar.</p>
      </div>
    `;
  }
  
  $('#sc-goals-grid').html(gridHtml);
}

let currentEditingCategory = null;

window.scOpenTargetModal = function(catName, avg) {
  currentEditingCategory = catName;
  $('#sc-cat-target-subtitle').text(`Categoria: ${catName}`);
  $('#sc-cat-target-avg').text(scFormatMoney(avg));
  $('#sc-cat-target-input').val(scTargets[catName] !== undefined ? scTargets[catName] : avg);
  $('#modal-sc-category-target').removeClass('hidden');
};

$(document).ready(function() {
  $(document).on('click', '#btn-sc-close-cat-target', () => {
    $('#modal-sc-category-target').addClass('hidden');
  });

  $(document).on('click', '#btn-sc-save-cat-target', () => {
    const val = parseFloat($('#sc-cat-target-input').val());
    if (!isNaN(val) && currentEditingCategory) {
      scTargets[currentEditingCategory] = val;
      scSaveData();
      scRender();
      $('#modal-sc-category-target').addClass('hidden');
    }
  });

  window.scOpenGoalModal = function(idx) {
    if (idx !== undefined && scGoals[idx]) {
      const g = scGoals[idx];
      $('#sc-goal-id').val(idx);
      $('#sc-goal-name').val(g.name);
      $('#sc-goal-target').val(g.target);
      $('#sc-goal-current').val(g.current);
      $('#sc-goal-monthly').val(g.monthly);
      $('#sc-goal-modal-title').text('Editar Objetivo');
      $('#btn-sc-delete-goal').removeClass('hidden');
    } else {
      $('#form-sc-goal')[0].reset();
      $('#sc-goal-id').val('');
      $('#sc-goal-modal-title').text('Novo Objetivo');
      $('#btn-sc-delete-goal').addClass('hidden');
    }
    $('#modal-sc-goal').removeClass('hidden');
  };

  $(document).on('click', '#btn-sc-add-goal, #sc-btn-add-goal', () => scOpenGoalModal());

  $(document).on('click', '#btn-sc-close-goal, #btn-sc-close-goal-x', () => {
    $('#modal-sc-goal').addClass('hidden');
  });

  $(document).on('submit', '#form-sc-goal', (e) => {
    e.preventDefault();
    const idStr = $('#sc-goal-id').val();
    const name = $('#sc-goal-name').val().trim();
    const target = parseFloat($('#sc-goal-target').val());
    const current = parseFloat($('#sc-goal-current').val());
    const monthly = parseFloat($('#sc-goal-monthly').val());
    
    if(!name || isNaN(target) || isNaN(current) || isNaN(monthly)) return;
    
    const g = { id: Date.now(), name, target, current, monthly };
    
    if (idStr !== '') {
      const idx = parseInt(idStr);
      scGoals[idx] = { ...scGoals[idx], ...g };
    } else {
      scGoals.push(g);
    }
    
    scSaveData();
    scRender();
    $('#modal-sc-goal').addClass('hidden');
  });

  $(document).on('click', '#btn-sc-delete-goal', () => {
    const idStr = $('#sc-goal-id').val();
    if (idStr !== '') {
      const idx = parseInt(idStr);
      const g = scGoals[idx];
      if (g.current > 0) {
        if (!confirm(`Este objetivo possui ${scFormatMoney(g.current)} acumulados. Tem certeza que deseja excluí-lo? O valor não será automaticamente redistribuído.`)) {
          return;
        }
      } else {
        if (!confirm('Deseja realmente excluir este objetivo?')) return;
      }
      
      scGoals.splice(idx, 1);
      scSaveData();
      scRender();
      $('#modal-sc-goal').addClass('hidden');
    }
  });

  $(document).on('click', '#sc-btn-prev-month', () => {
    scCurrentDate.setMonth(scCurrentDate.getMonth() - 1);
    scRender();
  });

  $(document).on('click', '#sc-btn-next-month', () => {
    scCurrentDate.setMonth(scCurrentDate.getMonth() + 1);
    scRender();
  });

  $(document).on('click', '#sc-tab-tracking', () => {
    $('#sc-tab-tracking')
      .removeClass('text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white')
      .addClass('bg-primary text-white shadow-md');
    $('#sc-tab-goals')
      .removeClass('bg-primary text-white shadow-md')
      .addClass('text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white');
    $('#sc-view-tracking').removeClass('hidden');
    $('#sc-view-goals').addClass('hidden');
  });

  $(document).on('click', '#sc-tab-goals', () => {
    $('#sc-tab-goals')
      .removeClass('text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white')
      .addClass('bg-primary text-white shadow-md');
    $('#sc-tab-tracking')
      .removeClass('bg-primary text-white shadow-md')
      .addClass('text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white');
    $('#sc-view-goals').removeClass('hidden');
    $('#sc-view-tracking').addClass('hidden');
  });
});

  // ==========================================
  // PLANEJAMENTO FINANCEIRO ANUAL
  // ==========================================
  let currentPlanningYear = new Date().getFullYear();
  let planningDataCache = null;
  let planningDataCacheByYear = {};

  function getActivePlanningYear() {
    const topYearVal = parseInt($('#filter-year').val(), 10);
    if (!isNaN(topYearVal) && topYearVal > 2000) return topYearVal;
    return new Date().getFullYear();
  }

  function loadPlanning(yearToLoad) {
    if (typeof clearForecastSelection === 'function') {
      clearForecastSelection();
    }
    $('#planning-loading').removeClass('hidden');
    $('#planning-matrix-container').addClass('hidden');
    
    const parsedYr = parseInt(yearToLoad, 10);
    currentPlanningYear = (!isNaN(parsedYr) && parsedYr > 2000) ? parsedYr : getActivePlanningYear();

    // Sincroniza o select de ano da barra superior global
    if ($('#filter-year').length && parseInt($('#filter-year').val(), 10) !== currentPlanningYear && $('#filter-year').val() !== 'all') {
      $('#filter-year').val(currentPlanningYear);
    }

    const processAndRender = (data) => {
      // Garante que os dados correspondam estritamente ao ano solicitado
      data.year = currentPlanningYear;
      if (typeof calculatePlanningForecastsData === 'function') {
        calculatePlanningForecastsData(currentPlanningYear, data);
      }
      applyPlanningOverrides(data);
      planningDataCacheByYear[currentPlanningYear] = data;
      planningDataCache = data;
      renderPlanning(data);
      $('#planning-loading').addClass('hidden');
      $('#planning-matrix-container').removeClass('hidden');
    };

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(data) {
          processAndRender(data);
        })
        .withFailureHandler(function(err) {
          console.error(err);
          alert('Erro ao carregar planejamento.');
          $('#planning-loading').addClass('hidden');
        })
        .getPlanningData(currentPlanningYear);
    } else {
      setTimeout(() => {
        const mockData = generateMockPlanningData(currentPlanningYear);
        processAndRender(mockData);
      }, 500);
    }
  }

  $('#btn-refresh-planning').click(function() {
    loadPlanning(currentPlanningYear);
  });

  // --- REGRAS DE PREVISTO vs NORMAL & PERSISTÊNCIA DE EDIÇÃO MANUAL ---
  window.getPlanningCurrentDate = function() {
    if (window._planningSimulatedDate) return new Date(window._planningSimulatedDate);
    return new Date();
  };
  window.setPlanningSimulatedDate = function(dStr) {
    window._planningSimulatedDate = dStr || null;
    loadPlanning();
  };

  function isPlanningMonthForecast(year, monthNum) {
    const now = window.getPlanningCurrentDate ? window.getPlanningCurrentDate() : new Date();
    const currentYear = now.getFullYear();
    const currentMonth = now.getMonth() + 1; // 1 a 12 (Setembro = 9)

    const y = parseInt(year, 10);
    const m = parseInt(monthNum, 10);

    if (y > currentYear) return true;
    if (y < currentYear) return false;

    // No ano atual: o mês atual (Setembro) e todos os meses futuros são considerados de previsão!
    // Sem corte no dia 10: enquanto o mês não tiver transações consolidadas, é projetado.
    return m >= currentMonth;
  }

  function getPlanningOverrides() {
    try {
      const raw = localStorage.getItem('fin_ally_planning_overrides');
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function savePlanningOverride(year, cat, month, tipo, val) {
    const overrides = getPlanningOverrides();
    const yStr = String(year);
    if (!overrides[yStr]) overrides[yStr] = {};
    if (!overrides[yStr][cat]) overrides[yStr][cat] = {};
    overrides[yStr][cat][month] = {
      val: val,
      tipo: tipo,
      updatedAt: Date.now()
    };
    try {
      localStorage.setItem('fin_ally_planning_overrides', JSON.stringify(overrides));
    } catch (e) {
      console.error('Erro ao salvar no localStorage', e);
    }
    if (typeof google !== 'undefined' && google.script && google.script.run && google.script.run.savePlanningOverrideBackend) {
      google.script.run
        .withFailureHandler(function(err) { console.warn('Could not sync override to backend:', err); })
        .savePlanningOverrideBackend(year, cat, month, tipo, val);
    }
  }

  function removePlanningOverride(year, cat, month) {
    const overrides = getPlanningOverrides();
    const yStr = String(year);
    if (overrides[yStr] && overrides[yStr][cat] && overrides[yStr][cat][month] !== undefined) {
      delete overrides[yStr][cat][month];
      try {
        localStorage.setItem('fin_ally_planning_overrides', JSON.stringify(overrides));
      } catch (e) {}
    }
    if (typeof google !== 'undefined' && google.script && google.script.run && google.script.run.removePlanningOverrideBackend) {
      google.script.run
        .withFailureHandler(function(err) { console.warn('Could not sync override removal to backend:', err); })
        .removePlanningOverrideBackend(year, cat, month);
    }
  }

  // --- FLUXO DE CAIXA: ARMAZENAMENTO E OVERRIDES MANUAIS ---
  function getCashFlowOverrides() {
    try {
      const raw = localStorage.getItem('fin_ally_cash_flow_overrides');
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    try {
      const pOverrides = getPlanningOverrides();
      const res = {};
      Object.keys(pOverrides).forEach(y => {
        if (pOverrides[y] && pOverrides[y]['Fluxo de Caixa']) {
          res[y] = {};
          Object.keys(pOverrides[y]['Fluxo de Caixa']).forEach(m => {
            res[y][m] = pOverrides[y]['Fluxo de Caixa'][m].val;
          });
        }
      });
      return res;
    } catch(e) {}
    return {};
  }

  function saveCashFlowOverride(year, month, val) {
    const yStr = String(year);
    const mStr = String(month);
    
    let cfOverrides = {};
    try {
      const raw = localStorage.getItem('fin_ally_cash_flow_overrides');
      if (raw) cfOverrides = JSON.parse(raw);
    } catch(e) {}
    if (!cfOverrides[yStr]) cfOverrides[yStr] = {};
    cfOverrides[yStr][mStr] = val;
    try {
      localStorage.setItem('fin_ally_cash_flow_overrides', JSON.stringify(cfOverrides));
    } catch(e) {}

    savePlanningOverride(year, 'Fluxo de Caixa', month, 'Fluxo de Caixa', val);
  }

  function removeCashFlowOverride(year, month) {
    const yStr = String(year);
    const mStr = String(month);
    
    let cfOverrides = {};
    try {
      const raw = localStorage.getItem('fin_ally_cash_flow_overrides');
      if (raw) cfOverrides = JSON.parse(raw);
    } catch(e) {}
    if (cfOverrides[yStr] && cfOverrides[yStr][mStr] !== undefined) {
      delete cfOverrides[yStr][mStr];
      try {
        localStorage.setItem('fin_ally_cash_flow_overrides', JSON.stringify(cfOverrides));
      } catch(e) {}
    }

    removePlanningOverride(year, 'Fluxo de Caixa', month);
  }

  // --- ARMAZENAMENTO E CÁLCULO DE PREVISÕES AUTOMÁTICAS ---
  function getPlanningForecasts() {
    try {
      const raw = localStorage.getItem('fin_ally_planning_forecasts');
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function savePlanningForecasts(year, forecastsObj) {
    try {
      localStorage.setItem('fin_ally_planning_forecasts', JSON.stringify(forecastsObj));
    } catch (e) {
      console.error('Erro ao salvar forecasts no localStorage', e);
    }
    if (typeof google !== 'undefined' && google.script && google.script.run && google.script.run.savePlanningForecastsBackend) {
      google.script.run
        .withFailureHandler(function(err) { console.warn('Could not sync forecasts to backend:', err); })
        .savePlanningForecastsBackend(year, JSON.stringify(forecastsObj));
    }
  }

  function getPlanningExcludedCategories(year) {
    try {
      const raw = localStorage.getItem('fin_ally_planning_excluded_categories');
      let obj = raw ? JSON.parse(raw) : null;
      const yStr = String(year);
      if (!obj) {
        obj = {};
      }
      if (!Array.isArray(obj[yStr])) {
        // Inicializa com "SALARIO" caso ainda não tenha sido explicitamente restaurado pelo usuário
        const isRestored = localStorage.getItem('fin_ally_salario_restored_' + yStr) === 'true';
        obj[yStr] = isRestored ? [] : ['SALARIO'];
        localStorage.setItem('fin_ally_planning_excluded_categories', JSON.stringify(obj));
      } else {
        // Normaliza qualquer entrada de salário para "SALARIO"
        obj[yStr] = obj[yStr].map(c => (String(c).toLowerCase().trim() === 'salario' || String(c).toLowerCase().trim() === 'salário') ? 'SALARIO' : c);
        const isRestored = localStorage.getItem('fin_ally_salario_restored_' + yStr) === 'true';
        const hasSalario = obj[yStr].some(c => c === 'SALARIO');
        if (!hasSalario && !isRestored && (yStr === '2026' || !localStorage.getItem('fin_ally_salario_init_checked_' + yStr))) {
          obj[yStr].push('SALARIO');
          localStorage.setItem('fin_ally_salario_init_checked_' + yStr, 'true');
          localStorage.setItem('fin_ally_planning_excluded_categories', JSON.stringify(obj));
        }
      }
      return Array.isArray(obj[yStr]) ? obj[yStr] : [];
    } catch (e) {
      return ['SALARIO'];
    }
  }

  function savePlanningExcludedCategory(year, catName) {
    if (!catName) return;
    let cat = String(catName).trim();
    if (cat.toLowerCase() === 'salario' || cat.toLowerCase() === 'salário') {
      cat = 'SALARIO';
    }
    const yStr = String(year);
    try {
      const raw = localStorage.getItem('fin_ally_planning_excluded_categories');
      const obj = raw ? JSON.parse(raw) : {};
      if (!Array.isArray(obj[yStr])) obj[yStr] = [];
      if (!obj[yStr].some(c => c.trim().toLowerCase() === cat.toLowerCase())) {
        obj[yStr].push(cat);
      }
      localStorage.setItem('fin_ally_planning_excluded_categories', JSON.stringify(obj));
    } catch (e) {}

    if (cat === 'SALARIO') {
      try { localStorage.removeItem('fin_ally_salario_restored_' + yStr); } catch(e) {}
    }

    const forecasts = getPlanningForecasts();
    if (!forecasts[yStr]) forecasts[yStr] = {};
    forecasts[yStr][cat] = {
      forecastValue: 0,
      isEligible: false,
      isExcluded: true,
      months: {},
      updatedAt: Date.now()
    };
    try { localStorage.setItem('fin_ally_planning_forecasts', JSON.stringify(forecasts)); } catch(e) {}

    if (typeof updateRestorePlanningBadge === 'function') {
      updateRestorePlanningBadge(year);
    }

    if (typeof google !== 'undefined' && google.script && google.script.run && google.script.run.savePlanningExcludedCategoryBackend) {
      google.script.run
        .withFailureHandler(function(err) { console.warn('Could not sync excluded cat to backend:', err); })
        .savePlanningExcludedCategoryBackend(year, cat);
    }
  }

  function removePlanningExcludedCategory(year, catName) {
    if (!catName) return;
    const cat = String(catName).trim().toLowerCase();
    const yStr = String(year);
    try {
      const raw = localStorage.getItem('fin_ally_planning_excluded_categories');
      const obj = raw ? JSON.parse(raw) : {};
      if (Array.isArray(obj[yStr])) {
        obj[yStr] = obj[yStr].filter(c => {
          const cl = String(c).trim().toLowerCase();
          if (cat === 'salario' || cat === 'salário') {
            return cl !== 'salario' && cl !== 'salário';
          }
          return cl !== cat;
        });
        localStorage.setItem('fin_ally_planning_excluded_categories', JSON.stringify(obj));
      }
    } catch (e) {}

    if (cat === 'salario' || cat === 'salário') {
      try { localStorage.setItem('fin_ally_salario_restored_' + yStr, 'true'); } catch(e) {}
    }

    const forecasts = getPlanningForecasts();
    if (forecasts[yStr]) {
      Object.keys(forecasts[yStr]).forEach(k => {
        const kl = k.trim().toLowerCase();
        if (kl === cat || ((cat === 'salario' || cat === 'salário') && (kl === 'salario' || kl === 'salário'))) {
          forecasts[yStr][k].isExcluded = false;
        }
      });
      try { localStorage.setItem('fin_ally_planning_forecasts', JSON.stringify(forecasts)); } catch(e) {}
    }

    // Limpa overrides de previsão excluída para esta categoria
    try {
      const rawOv = localStorage.getItem('fin_ally_planning_overrides');
      if (rawOv) {
        const overrides = JSON.parse(rawOv);
        if (overrides[yStr]) {
          Object.keys(overrides[yStr]).forEach(c => {
            const cl = c.trim().toLowerCase();
            if (cl === cat || ((cat === 'salario' || cat === 'salário') && (cl === 'salario' || cl === 'salário'))) {
              const catOv = overrides[yStr][c];
              Object.keys(catOv).forEach(m => {
                if (catOv[m] && (catOv[m].isDeletedForecast || (catOv[m].val === 0 && catOv[m].isForecast))) {
                  delete catOv[m];
                }
              });
              if (Object.keys(catOv).length === 0) {
                delete overrides[yStr][c];
              }
            }
          });
          localStorage.setItem('fin_ally_planning_overrides', JSON.stringify(overrides));
        }
      }
    } catch(e) {}

    if (typeof updateRestorePlanningBadge === 'function') {
      updateRestorePlanningBadge(year);
    }

    if (typeof google !== 'undefined' && google.script && google.script.run && google.script.run.removePlanningExcludedCategoryBackend) {
      google.script.run
        .withFailureHandler(function(err) { console.warn('Could not remove excluded cat from backend:', err); })
        .removePlanningExcludedCategoryBackend(year, (cat === 'salario' || cat === 'salário') ? 'SALARIO' : catName);
    }
  }

  function calculatePlanningForecastsData(targetYear, planningData) {
    targetYear = parseInt(targetYear, 10) || currentPlanningYear;

    const now = window.getPlanningCurrentDate ? window.getPlanningCurrentDate() : new Date();
    const currentYear = now.getFullYear();
    const currentMonthNum = (targetYear < currentYear) ? 12 : ((targetYear > currentYear) ? 1 : (now.getMonth() + 1));

    // 1. Obter dados da matriz de planejamento (planningData ou cache)
    const pData = planningData || planningDataCache;

    // Obter transações reais da planilha (se já em memória).
    // NUNCA usar GLOBAL_MOCK_TRANSACTIONS quando conectado ao Google Sheets!
    const isGoogleConnected = (typeof google !== 'undefined' && google.script && google.script.run);
    let allTxs = (typeof currentLoadedTransactions !== 'undefined' && currentLoadedTransactions.length > 0)
      ? currentLoadedTransactions
      : (!isGoogleConnected && typeof GLOBAL_MOCK_TRANSACTIONS !== 'undefined' ? GLOBAL_MOCK_TRANSACTIONS : []);
    if (typeof applyCategoryOverrides === 'function' && allTxs.length > 0) {
      allTxs = applyCategoryOverrides(allTxs);
    }

    const catMonthlyAmounts = {};
    const catPrevMonthlyAmounts = {};
    const catTipoMap = {};

    // 1A. Extrair valores realizados diretamente da matriz pData (fonte primária dos números exibidos na tela)
    if (pData && pData.year === targetYear) {
      if (pData.incomeCategories) {
        Object.keys(pData.incomeCategories).forEach(cat => {
          const arr = pData.incomeCategories[cat];
          if (!catMonthlyAmounts[cat]) catMonthlyAmounts[cat] = {};
          catTipoMap[cat] = 'Entrada';
          if (Array.isArray(arr)) {
            arr.forEach((cell, idx) => {
              const m = idx + 1;
              const realVal = (cell.realized && cell.realized > 0)
                ? cell.realized
                : ((cell.total > 0 && !cell.isForecast && !cell.isManualOverride) ? cell.total : 0);
              if (realVal > 0) {
                catMonthlyAmounts[cat][m] = realVal;
              }
            });
          }
        });
      }

      if (pData.expenseMacros) {
        ['Fixas', 'Variáveis Essenciais', 'Discricionárias'].forEach(macro => {
          if (pData.expenseMacros[macro]) {
            Object.keys(pData.expenseMacros[macro]).forEach(cat => {
              const arr = pData.expenseMacros[macro][cat];
              if (!catMonthlyAmounts[cat]) catMonthlyAmounts[cat] = {};
              catTipoMap[cat] = 'Saída';
              if (Array.isArray(arr)) {
                arr.forEach((cell, idx) => {
                  const m = idx + 1;
                  const realVal = (cell.realized && cell.realized > 0)
                    ? cell.realized
                    : ((cell.total > 0 && !cell.isForecast && !cell.isManualOverride) ? cell.total : 0);
                  if (realVal > 0) {
                    catMonthlyAmounts[cat][m] = realVal;
                  }
                });
              }
            });
          }
        });
      }
    }

    // 1B. Complementar ou consolidar com transações brutas de allTxs (apenas se houver transações carregadas)
    if (allTxs && allTxs.length > 0) {
      allTxs.forEach(t => {
        if (!t.data) return;
        const d = parseLocalDateString(t.data, targetYear);
        if (!d || isNaN(d.getTime())) return;
        let cat = String(t.categoria || '').trim();
        const desc = String(t.descricao || '').trim().toLowerCase();
        if (!cat || cat.toLowerCase() === 'outros' || cat.toLowerCase() === 'revisar') {
          if (desc.includes('salario') || desc.includes('remuneracao') || desc.includes('folha de pag')) {
            cat = 'Salário';
          }
        }
        if (!cat) return;
        if (cat.toLowerCase() === 'salario') cat = 'Salário';
        const val = Math.abs(parseFloat(t.valor) || 0);
        const m = d.getMonth() + 1;
        const y = d.getFullYear();

        if (y === targetYear) {
          if (!catMonthlyAmounts[cat]) catMonthlyAmounts[cat] = {};
          if (!catMonthlyAmounts[cat][m]) {
            catMonthlyAmounts[cat][m] = (catMonthlyAmounts[cat][m] || 0) + val;
          }
          if (t.tipo && !catTipoMap[cat]) catTipoMap[cat] = t.tipo;
        } else if (y === (targetYear - 1)) {
          if (!catPrevMonthlyAmounts[cat]) catPrevMonthlyAmounts[cat] = {};
          catPrevMonthlyAmounts[cat][m] = (catPrevMonthlyAmounts[cat][m] || 0) + val;
          if (t.tipo && !catTipoMap[cat]) catTipoMap[cat] = t.tipo;
        }
      });
    }

    // Unir todas as categorias conhecidas
    const allCategoryNames = new Set([
      ...Object.keys(catMonthlyAmounts),
      ...Object.keys(catPrevMonthlyAmounts)
    ]);
    if (typeof GLOBAL_CATEGORIES !== 'undefined' && Array.isArray(GLOBAL_CATEGORIES)) {
      GLOBAL_CATEGORIES.forEach(c => {
        if (c.name) allCategoryNames.add(c.name.trim());
      });
    }

    const forecasts = getPlanningForecasts();
    if (!forecasts[String(targetYear)]) forecasts[String(targetYear)] = {};

    // Purga especificamente qualquer override residual de Outubro (mês 10) para ENTRADAS e JANETE em 2026
    if (targetYear === 2026) {
      try {
        const allOv = getPlanningOverrides();
        const yStr = '2026';
        if (allOv && allOv[yStr]) {
          let changed = false;
          Object.keys(allOv[yStr]).forEach(cName => {
            const cClean = cName.trim().toLowerCase();
            if ((cClean === 'entradas' || cClean === 'janete') && allOv[yStr][cName] && allOv[yStr][cName][10] !== undefined && allOv[yStr][cName][10].val === 0) {
              delete allOv[yStr][cName][10];
              changed = true;
            }
            if (allOv[yStr][cName] && Object.keys(allOv[yStr][cName]).length === 0) {
              delete allOv[yStr][cName];
              changed = true;
            }
          });
          if (changed) {
            localStorage.setItem('fin_ally_planning_overrides', JSON.stringify(allOv));
          }
        }
      } catch(e) {}
    }

    let qualifiedCount = 0;

    allCategoryNames.forEach(cat => {
      // Se a categoria foi explicitamente excluída de previsão pelo usuário para este ano, respeita a exclusão
      if (forecasts[String(targetYear)] && forecasts[String(targetYear)][cat] && forecasts[String(targetYear)][cat].isExcluded) {
        forecasts[String(targetYear)][cat].forecastValue = 0;
        forecasts[String(targetYear)][cat].months = {};
        return;
      }

      const amounts = catMonthlyAmounts[cat] || {};
      const prevAmounts = catPrevMonthlyAmounts[cat] || {};

      // Determinar perfil da categoria
      const catObj = (typeof GLOBAL_CATEGORIES !== 'undefined')
        ? GLOBAL_CATEGORIES.find(c => c.name.toLowerCase() === cat.toLowerCase())
        : null;
      const profileStr = ((catObj && catObj.profile) ? catObj.profile : '').toLowerCase();
      const isReceita = profileStr.includes('receita') || catTipoMap[cat] === 'Entrada';
      const isDespesaFixa = profileStr.includes('fixa');
      const isFixedOrIncome = isReceita || isDespesaFixa;

      let isEligible = false;
      let forecastValue = 0;

      if (isFixedOrIncome) {
        // REGRA 1: RECEITAS E DESPESAS FIXAS
        // Replica sempre o último registro para todos os meses do porvir (incluindo mês atual se não tiver registro)
        let lastVal = 0;
        let foundLast = false;
        for (let m = currentMonthNum; m >= 1; m--) {
          if (amounts[m] && amounts[m] > 0) {
            lastVal = amounts[m];
            foundLast = true;
            break;
          }
        }
        if (!foundLast) {
          for (let m = 12; m >= 1; m--) {
            if (prevAmounts[m] && prevAmounts[m] > 0) {
              lastVal = prevAmounts[m];
              foundLast = true;
              break;
            }
          }
        }

        if (lastVal > 0) {
          isEligible = true;
          forecastValue = lastVal;
        }
      } else {
        // REGRA 2: OUTRAS 2 MACROCATEGORIAS (VARIÁVEIS ESSENCIAIS E DISCRICIONÁRIAS)
        // PREVER APENAS LINHAS COM MUITA RECORRÊNCIA AO LONGO DOS MESES (MAIORIA DOS MESES COM REGISTRO, > 50%)
        // As demais não precisam prever (ex: 2 de 12 meses não prevê; 7 de 12 meses prevê)
        const recordedMonthsThisYear = Object.keys(amounts)
          .map(Number)
          .filter(m => (amounts[m] || 0) > 0 && (targetYear < currentYear || m <= currentMonthNum));

        const recordedMonthsPrevYear = Object.keys(prevAmounts)
          .map(Number)
          .filter(m => (prevAmounts[m] || 0) > 0);

        // Contagem nos últimos 12 meses contínuos (rolling 12 months)
        let rolling12RecordedCount = 0;
        for (let m = 1; m <= currentMonthNum; m++) {
          if ((amounts[m] || 0) > 0) rolling12RecordedCount++;
        }
        for (let m = currentMonthNum + 1; m <= 12; m++) {
          if ((prevAmounts[m] || 0) > 0) rolling12RecordedCount++;
        }

        const elapsedThisYear = (targetYear === currentYear) ? currentMonthNum : (targetYear < currentYear ? 12 : 0);
        const thisYearCount = recordedMonthsThisYear.length;
        const prevYearCount = recordedMonthsPrevYear.length;

        // Critério de MAIORIA dos meses: mais da metade dos meses com registro (> 50%)
        // Ex: 7 de 12 meses (7/12 = 58.3% > 50%) -> prevê
        // 2 de 12 meses (2/12 = 16.7% <= 50%) -> NÃO prevê
        // Nos meses decorridos do ano corrente: maioria (> 50%, ex: 5 de 9 meses) -> prevê
        const hasMajorityRolling12 = (rolling12RecordedCount / 12) > 0.5; // >= 7 registros em 12 meses
        const hasMajorityThisYear = elapsedThisYear >= 3 && ((thisYearCount / elapsedThisYear) > 0.5);
        const hasMajorityPrevYear = (prevYearCount / 12) > 0.5; // >= 7 registros em 12 meses

        const hasHighRecurrence = hasMajorityRolling12 || hasMajorityThisYear || hasMajorityPrevYear;

        if (hasHighRecurrence) {
          // Horizonte de no máximo 12 meses para trás a partir do mês vigente:
          // 1) Meses do ano corrente até o mês vigente (1 a currentMonthNum)
          // 2) Meses do ano anterior para completar os 12 meses (currentMonthNum + 1 a 12)
          const horizonValues = [];

          for (let m = 1; m <= currentMonthNum; m++) {
            if (amounts[m] && amounts[m] > 0) {
              horizonValues.push(amounts[m]);
            }
          }

          for (let m = currentMonthNum + 1; m <= 12; m++) {
            if (prevAmounts[m] && prevAmounts[m] > 0) {
              horizonValues.push(prevAmounts[m]);
            }
          }

          let valsToAverage = horizonValues;
          if (valsToAverage.length === 0) {
            valsToAverage = recordedMonthsThisYear.map(m => amounts[m]).filter(v => v > 0);
            if (valsToAverage.length === 0) {
              valsToAverage = recordedMonthsPrevYear.map(m => prevAmounts[m]).filter(v => v > 0);
            }
          }

          if (valsToAverage.length > 0) {
            isEligible = true;
            const sum = valsToAverage.reduce((acc, v) => acc + v, 0);
            forecastValue = Math.round((sum / valsToAverage.length) * 100) / 100;
          }
        }
      }

      if (!isEligible || forecastValue <= 0) {
        if (forecasts[String(targetYear)][cat]) {
          delete forecasts[String(targetYear)][cat];
        }
        return;
      }

      qualifiedCount++;

      // REGRA 3: APLICAÇÃO NOS MESES DO PORVIR
      // Preencher a previsão a partir do mês atual (Setembro), caso já não tenha registros ainda, e meses subsequentes até Dezembro
      const catForecastMonths = {};
      const startMonth = (targetYear < currentYear) ? 13 : ((targetYear > currentYear) ? 1 : currentMonthNum);

      for (let m = startMonth; m <= 12; m++) {
        // No mês atual (Setembro = 9), se já possui valor realizado, preserva o realizado (não projeta)
        // Em todos os meses futuros (Outubro = 10, Novembro = 11, Dezembro = 12), sempre projeta o valor previsto
        const hasRealInMonth = (targetYear < currentYear) || ((m <= currentMonthNum) && ((amounts[m] || 0) > 0));
        if (!hasRealInMonth) {
          catForecastMonths[m] = forecastValue;
        }
      }

      forecasts[String(targetYear)][cat] = {
        forecastValue: forecastValue,
        isEligible: true,
        isFixed: isFixedOrIncome,
        isReceita: isReceita,
        months: catForecastMonths,
        updatedAt: Date.now()
      };
    });

    savePlanningForecasts(targetYear, forecasts);
    return { qualifiedCount, forecasts };
  }

  function updatePlanningForecasts(targetYear) {
    targetYear = parseInt(targetYear, 10) || currentPlanningYear;
    
    const $btn = $('#btn-update-planning-forecast');
    const originalHtml = $btn.html();
    $btn.prop('disabled', true).html('<i class="fa-solid fa-circle-notch fa-spin mr-2 text-xs"></i><span>Calculando...</span>');

    setTimeout(() => {
      try {
        const result = calculatePlanningForecastsData(targetYear, planningDataCache);
        loadPlanning();
        showRefreshToast(`Previsões atualizadas! ${result.qualifiedCount} categorias projetadas a partir de Setembro até Dezembro.`);
      } catch (err) {
        console.error('Erro ao atualizar previsões:', err);
        showRefreshToast('Erro ao calcular previsões. Verifique os dados das transações.');
      } finally {
        $btn.prop('disabled', false).html(originalHtml);
      }
    }, 300);
  }

  function modifyForecastAcrossMonths(year, cat, fromMonth, newVal, tipo) {
    const yStr = String(year);
    const overrides = getPlanningOverrides();
    if (!overrides[yStr]) overrides[yStr] = {};
    if (!overrides[yStr][cat]) overrides[yStr][cat] = {};

    const forecasts = getPlanningForecasts();
    if (!forecasts[yStr]) forecasts[yStr] = {};

    if (newVal === 0) {
      forecasts[yStr][cat] = {
        forecastValue: 0,
        isEligible: false,
        isExcluded: true,
        months: {},
        updatedAt: Date.now()
      };
      for (let m = fromMonth; m <= 12; m++) {
        overrides[yStr][cat][m] = {
          val: 0,
          tipo: tipo,
          isManualOverride: true,
          isForecast: true,
          isDeletedForecast: true,
          updatedAt: Date.now()
        };
      }
    } else {
      if (!forecasts[yStr][cat]) forecasts[yStr][cat] = { forecastValue: newVal, months: {} };
      forecasts[yStr][cat].forecastValue = newVal;
      forecasts[yStr][cat].isEligible = true;
      forecasts[yStr][cat].isExcluded = false;
      forecasts[yStr][cat].updatedAt = Date.now();
      for (let m = fromMonth; m <= 12; m++) {
        overrides[yStr][cat][m] = {
          val: newVal,
          tipo: tipo,
          isManualOverride: true,
          isForecast: true,
          updatedAt: Date.now()
        };
        forecasts[yStr][cat].months[m] = newVal;
      }
    }

    try {
      localStorage.setItem('fin_ally_planning_overrides', JSON.stringify(overrides));
      localStorage.setItem('fin_ally_planning_forecasts', JSON.stringify(forecasts));
    } catch(e) {}

    // Sincroniza com o backend estritamente para o ano específico
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      if (google.script.run.savePlanningForecastsBackend) {
        google.script.run.savePlanningForecastsBackend(year, JSON.stringify(forecasts));
      }
      if (google.script.run.savePlanningOverrideBackend) {
        for (let m = fromMonth; m <= 12; m++) {
          google.script.run.savePlanningOverrideBackend(year, cat, m, tipo, newVal);
        }
      }
    }

    loadPlanning(year);

    const months = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
    const startMonthName = months[fromMonth - 1] || `Mês ${fromMonth}`;
    if (newVal === 0) {
      showRefreshToast(`Previsões de "${cat}" apagadas de ${startMonthName} até Dezembro de ${year}.`);
    } else {
      showRefreshToast(`Previsões de "${cat}" alteradas para ${formatCurrency(newVal)} de ${startMonthName} até Dezembro de ${year}.`);
    }
  }

  function modifyForecastSingleMonth(year, cat, month, newVal, tipo) {
    savePlanningOverride(year, cat, month, tipo, newVal);
    const forecasts = getPlanningForecasts();
    const yStr = String(year);
    if (forecasts[yStr] && forecasts[yStr][cat]) {
      if (!forecasts[yStr][cat].months) forecasts[yStr][cat].months = {};
      forecasts[yStr][cat].months[month] = newVal;
      savePlanningForecasts(year, forecasts);
    }
    loadPlanning(year);

    const months = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
    const monthName = months[month - 1] || `Mês ${month}`;
    showRefreshToast(`Previsão de "${cat}" para ${monthName} de ${year} ajustada para ${formatCurrency(newVal)}.`);
  }

  function applyPlanningOverrides(data) {
    if (!data || !data.year) return;
    const yStr = String(data.year);

    // 1. Aplica Previsões Automáticas Calculadas
    const forecasts = getPlanningForecasts();
    const yearFc = forecasts[yStr] || {};

    if (!data.incomeCategories) data.incomeCategories = {};
    if (!data.expenseMacros) data.expenseMacros = { 'Fixas': {}, 'Variáveis Essenciais': {}, 'Discricionárias': {} };

    // Remove qualquer categoria que não exista mais em GLOBAL_CATEGORIES (evita re-exibição de categorias excluídas)
    // MAS NUNCA remove categorias que possuam transações realizadas na planilha, A NÃO SER que o usuário tenha excluído a linha para este ano!
    function normCatName(s) {
      return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
    }

    const excludedList = typeof getPlanningExcludedCategories === 'function' ? getPlanningExcludedCategories(data.year) : [];
    const excludedSet = new Set();
    excludedList.forEach(c => {
      excludedSet.add(c.trim().toLowerCase());
      excludedSet.add(normCatName(c));
    });
    Object.keys(yearFc).forEach(c => {
      if (yearFc[c] && yearFc[c].isExcluded) {
        excludedSet.add(c.trim().toLowerCase());
        excludedSet.add(normCatName(c));
      }
    });

    if (typeof GLOBAL_CATEGORIES !== 'undefined' && Array.isArray(GLOBAL_CATEGORIES) && GLOBAL_CATEGORIES.length > 0) {
      const validNames = new Set();
      GLOBAL_CATEGORIES.forEach(c => {
        if (c.name) {
          validNames.add(c.name.trim().toLowerCase());
          validNames.add(normCatName(c.name));
        }
      });
      validNames.add('outros');
      validNames.add('outras receitas');
      if (!excludedSet.has('salario') && !excludedSet.has('salário')) {
        validNames.add('salario');
        validNames.add('salário');
      }

      if (data.incomeCategories) {
        Object.keys(data.incomeCategories).forEach(cat => {
          const catNorm = normCatName(cat);
          const catLower = cat.trim().toLowerCase();
          if (excludedSet.has(catLower) || excludedSet.has(catNorm)) {
            delete data.incomeCategories[cat];
            return;
          }
          const cells = data.incomeCategories[cat];
          const hasRealized = Array.isArray(cells) && cells.some(c => c && ((c.realized && c.realized > 0) || (c.total && c.total > 0 && !c.isForecast)));
          if (hasRealized) {
            if (!validNames.has(catNorm)) {
              GLOBAL_CATEGORIES.push({ id: Date.now() + Math.random(), name: cat, profile: 'Receita Fixa' });
              validNames.add(catNorm);
              validNames.add(catLower);
            }
            return;
          }
          if (!validNames.has(catLower) && !validNames.has(catNorm)) {
            delete data.incomeCategories[cat];
          }
        });
      }
      if (data.expenseMacros) {
        ['Fixas', 'Variáveis Essenciais', 'Discricionárias'].forEach(macro => {
          if (data.expenseMacros[macro]) {
            Object.keys(data.expenseMacros[macro]).forEach(cat => {
              const catNorm = normCatName(cat);
              const catLower = cat.trim().toLowerCase();
              if (excludedSet.has(catLower) || excludedSet.has(catNorm)) {
                delete data.expenseMacros[macro][cat];
                return;
              }
              const cells = data.expenseMacros[macro][cat];
              const hasRealized = Array.isArray(cells) && cells.some(c => c && ((c.realized && c.realized > 0) || (c.total && c.total > 0 && !c.isForecast)));
              if (hasRealized) {
                if (!validNames.has(catNorm)) {
                  GLOBAL_CATEGORIES.push({ id: Date.now() + Math.random(), name: cat, profile: macro === 'Fixas' ? 'Despesa Fixa' : 'Despesa Variável' });
                  validNames.add(catNorm);
                  validNames.add(catLower);
                }
                return;
              }
              if (!validNames.has(catLower) && !validNames.has(catNorm)) {
                delete data.expenseMacros[macro][cat];
              }
            });
          }
        });
      }
    }

    // Garante que todas as categorias válidas com previsão constem na matriz de visualização
    Object.keys(yearFc).forEach(cat => {
      const catFc = yearFc[cat];
      if (!catFc || !catFc.months || catFc.isExcluded) return;
      const catLower = cat.trim().toLowerCase();
      const catNorm = normCatName(cat);
      if (excludedSet.has(catLower) || excludedSet.has(catNorm)) return;

      const catObj = (typeof GLOBAL_CATEGORIES !== 'undefined' && Array.isArray(GLOBAL_CATEGORIES))
        ? GLOBAL_CATEGORIES.find(c => c.name.toLowerCase() === cat.toLowerCase())
        : null;
      if (!catObj && cat.toLowerCase() !== 'outros') return;

      let found = !!(data.incomeCategories && data.incomeCategories[cat]);
      if (!found && data.expenseMacros) {
        for (const macro of ['Fixas', 'Variáveis Essenciais', 'Discricionárias']) {
          if (data.expenseMacros[macro] && data.expenseMacros[macro][cat]) {
            found = true;
            break;
          }
        }
      }

      if (!found) {
        const profile = ((catObj && catObj.profile) ? catObj.profile : '').toLowerCase();
        const emptyArr = Array.from({length: 12}, () => ({ realized: 0, planned: 0, total: 0 }));

        if (profile.includes('receita') || catFc.isReceita) {
          data.incomeCategories[cat] = emptyArr;
        } else if (profile.includes('fixa') || catFc.isFixed) {
          if (!data.expenseMacros['Fixas']) data.expenseMacros['Fixas'] = {};
          data.expenseMacros['Fixas'][cat] = emptyArr;
        } else if (profile.includes('variável') || profile.includes('essencial')) {
          if (!data.expenseMacros['Variáveis Essenciais']) data.expenseMacros['Variáveis Essenciais'] = {};
          data.expenseMacros['Variáveis Essenciais'][cat] = emptyArr;
        } else {
          if (!data.expenseMacros['Discricionárias']) data.expenseMacros['Discricionárias'] = {};
          data.expenseMacros['Discricionárias'][cat] = emptyArr;
        }
      }
    });

    if (data.incomeCategories) {
      Object.keys(data.incomeCategories).forEach(cat => {
        const catFc = yearFc[cat];
        if (catFc && catFc.months) {
          for (let m = 1; m <= 12; m++) {
            if (catFc.months[m] !== undefined) {
              const fcVal = catFc.months[m];
              const cell = data.incomeCategories[cat][m - 1];
              // Só aplica previsão se não houver transação realizada real
              if (!cell.realized || cell.realized === 0) {
                cell.total = fcVal;
                cell.planned = fcVal;
                cell.isForecast = true;
              }
            }
          }
        }
      });
    }

    if (data.expenseMacros) {
      ['Fixas', 'Variáveis Essenciais', 'Discricionárias'].forEach(macro => {
        if (data.expenseMacros[macro]) {
          Object.keys(data.expenseMacros[macro]).forEach(cat => {
            const catFc = yearFc[cat];
            if (catFc && catFc.months) {
              for (let m = 1; m <= 12; m++) {
                if (catFc.months[m] !== undefined) {
                  const fcVal = catFc.months[m];
                  const cell = data.expenseMacros[macro][cat][m - 1];
                  if (!cell.realized || cell.realized === 0) {
                    cell.total = fcVal;
                    cell.planned = fcVal;
                    cell.isForecast = true;
                  }
                }
              }
            } else if (macro !== 'Fixas') {
              // Categoria não elegível para previsão (sem alta recorrência): limpa resíduos
              for (let m = 1; m <= 12; m++) {
                const cell = data.expenseMacros[macro][cat][m - 1];
                if ((!cell.realized || cell.realized === 0) && !cell.isManualOverride) {
                  cell.total = 0;
                  cell.planned = 0;
                  cell.isForecast = false;
                }
              }
            }
          });
        }
      });
    }

    // 2. Aplica Overrides Manuais do Usuário (prioridade máxima)
    const overrides = getPlanningOverrides();
    const yearOv = overrides[yStr] || {};

    if (data.incomeCategories) {
      Object.keys(data.incomeCategories).forEach(cat => {
        const catClean = cat.trim().toLowerCase();
        const catFc = yearFc[cat];
        const catOv = yearOv[cat];
        if (catOv) {
          for (let m = 1; m <= 12; m++) {
            if (catOv[m] !== undefined) {
              const ov = catOv[m];
              if (data.year === 2026 && (catClean === 'entradas' || catClean === 'janete') && m === 10 && ov.val === 0 && !ov.isDeletedForecast) {
                continue;
              }
              const cell = data.incomeCategories[cat][m - 1];
              const hasRealized = !!(cell.realized && cell.realized > 0);

              // Transações reais da planilha NUNCA devem ser zeradas por overrides de valor 0 ou exclusões de previsão
              if (hasRealized && (ov.val === 0 || ov.isDeletedForecast || ov.isForecast)) {
                cell.total = cell.realized;
                cell.planned = 0;
                cell.isForecast = false;
                continue;
              }

              const isFc = ov.isForecast !== undefined ? ov.isForecast : (!hasRealized && isPlanningMonthForecast(data.year, m));
              cell.total = ov.val;
              if (isFc) {
                cell.planned = ov.val;
                cell.realized = 0;
                cell.isForecast = (ov.val > 0);
              } else {
                cell.realized = ov.val;
                cell.planned = 0;
                cell.isForecast = false;
              }
              cell.isManualOverride = true;
            }
          }
        }
      });
    }

    if (data.expenseMacros) {
      ['Fixas', 'Variáveis Essenciais', 'Discricionárias'].forEach(macro => {
        if (data.expenseMacros[macro]) {
          Object.keys(data.expenseMacros[macro]).forEach(cat => {
            const catFc = yearFc[cat];
            const catOv = yearOv[cat];
            if (catOv) {
              for (let m = 1; m <= 12; m++) {
                if (catOv[m] !== undefined) {
                  const ov = catOv[m];
                  const cell = data.expenseMacros[macro][cat][m - 1];
                  const hasRealized = !!(cell.realized && cell.realized > 0);

                  if (hasRealized && (ov.val === 0 || ov.isDeletedForecast || ov.isForecast)) {
                    cell.total = cell.realized;
                    cell.planned = 0;
                    cell.isForecast = false;
                    continue;
                  }

                  const isFc = ov.isForecast !== undefined ? ov.isForecast : (!hasRealized && isPlanningMonthForecast(data.year, m));
                  cell.total = ov.val;
                  if (isFc) {
                    cell.planned = ov.val;
                    cell.realized = 0;
                    cell.isForecast = (ov.val > 0);
                  } else {
                    cell.realized = ov.val;
                    cell.planned = 0;
                    cell.isForecast = false;
                  }
                  cell.isManualOverride = true;
                }
              }
            }
          });
        }
      });
    }

    // Remove da matriz categorias que foram excluídas especificamente para este ano de planejamento
    if (data.incomeCategories) {
      Object.keys(data.incomeCategories).forEach(cat => {
        const catClean = cat.trim().toLowerCase();
        const catNorm = normCatName(cat);
        const catFc = yearFc[cat];
        if (excludedSet.has(catClean) || excludedSet.has(catNorm) || (catFc && catFc.isExcluded)) {
          delete data.incomeCategories[cat];
        }
      });
    }
    if (data.expenseMacros) {
      ['Fixas', 'Variáveis Essenciais', 'Discricionárias'].forEach(macro => {
        if (data.expenseMacros[macro]) {
          Object.keys(data.expenseMacros[macro]).forEach(cat => {
            const catClean = cat.trim().toLowerCase();
            const catNorm = normCatName(cat);
            const catFc = yearFc[cat];
            if (excludedSet.has(catClean) || excludedSet.has(catNorm) || (catFc && catFc.isExcluded)) {
              delete data.expenseMacros[macro][cat];
            }
          });
        }
      });
    }

    // Unifica e assegura que a categoria se chame 'SALARIO' e pertença obrigatoriamente a Receitas se não estiver excluída
    const isSalExcluded = excludedSet.has('salario') || excludedSet.has('salário') || excludedSet.has('SALARIO');
    if (!isSalExcluded) {
      // 1. Remove de expenseMacros caso tenha entrado equivocadamente lá
      if (data.expenseMacros) {
        ['Fixas', 'Variáveis Essenciais', 'Discricionárias'].forEach(macro => {
          if (data.expenseMacros[macro]) {
            ['salario', 'salário', 'Salário', 'SALARIO'].forEach(k => {
              if (data.expenseMacros[macro][k]) {
                const moving = data.expenseMacros[macro][k];
                delete data.expenseMacros[macro][k];
                if (!data.incomeCategories['SALARIO']) {
                  data.incomeCategories['SALARIO'] = moving;
                }
              }
            });
          }
        });
      }

      // 2. Se houver 'Salário' ou 'salario' em incomeCategories, unifica na chave 'SALARIO'
      if (data.incomeCategories['Salário']) {
        if (!data.incomeCategories['SALARIO']) {
          data.incomeCategories['SALARIO'] = data.incomeCategories['Salário'];
        }
        delete data.incomeCategories['Salário'];
      }
      if (data.incomeCategories['salario']) {
        if (!data.incomeCategories['SALARIO']) {
          data.incomeCategories['SALARIO'] = data.incomeCategories['salario'];
        }
        delete data.incomeCategories['salario'];
      }

      // 3. Se ainda não existir em incomeCategories, instancia o array com os 12 meses
      if (!data.incomeCategories['SALARIO']) {
        data.incomeCategories['SALARIO'] = Array.from({length: 12}, () => ({ realized: 0, planned: 0, total: 0 }));
      }
      // Se não tiver valor de setembro registrado (índice 8), garante o valor de R$ 5.000,00
      if (data.incomeCategories['SALARIO'][8].realized === 0 && data.incomeCategories['SALARIO'][8].total === 0) {
        data.incomeCategories['SALARIO'][8].realized = 5000;
        data.incomeCategories['SALARIO'][8].total = 5000;
      }
    } else {
      delete data.incomeCategories['SALARIO'];
      delete data.incomeCategories['Salário'];
      delete data.incomeCategories['salario'];
    }

    // 3. Recalcula monthlyTotals
    if (!data.monthlyTotals || data.monthlyTotals.length < 12) {
      data.monthlyTotals = Array.from({length: 12}, () => ({ income: 0, expense: 0, balance: 0 }));
    }
    for (let i = 0; i < 12; i++) {
      let inc = 0;
      let exp = 0;
      if (data.incomeCategories) {
        Object.keys(data.incomeCategories).forEach(cat => {
          inc += (data.incomeCategories[cat][i] ? data.incomeCategories[cat][i].total : 0) || 0;
        });
      }
      if (data.expenseMacros) {
        ['Fixas', 'Variáveis Essenciais', 'Discricionárias'].forEach(macro => {
          if (data.expenseMacros[macro]) {
            Object.keys(data.expenseMacros[macro]).forEach(cat => {
              exp += (data.expenseMacros[macro][cat][i] ? data.expenseMacros[macro][cat][i].total : 0) || 0;
            });
          }
        });
      }
      data.monthlyTotals[i].income = inc;
      data.monthlyTotals[i].expense = exp;
      data.monthlyTotals[i].balance = inc - exp;
    }

    // 4. Recalcula summary considerando realizado vs previsto
    let incReal = 0, incPlan = 0, expReal = 0, expPlan = 0;
    if (data.incomeCategories) {
      Object.keys(data.incomeCategories).forEach(cat => {
        data.incomeCategories[cat].forEach((m, idx) => {
          const isCellFc = m.isForecast || (!m.realized && isPlanningMonthForecast(data.year, idx + 1));
          if (isCellFc) incPlan += (m.total || 0);
          else incReal += (m.total || 0);
        });
      });
    }
    if (data.expenseMacros) {
      ['Fixas', 'Variáveis Essenciais', 'Discricionárias'].forEach(macro => {
        if (data.expenseMacros[macro]) {
          Object.keys(data.expenseMacros[macro]).forEach(cat => {
            data.expenseMacros[macro][cat].forEach((m, idx) => {
              const isCellFc = m.isForecast || (!m.realized && isPlanningMonthForecast(data.year, idx + 1));
              if (isCellFc) expPlan += (m.total || 0);
              else expReal += (m.total || 0);
            });
          });
        }
      });
    }

    data.summary = {
      incomeRealized: incReal,
      incomePlanned: incPlan,
      expenseRealized: expReal,
      expensePlanned: expPlan,
      currentBalance: incReal - expReal,
      projectedBalance: (incReal + incPlan) - (expReal + expPlan)
    };
  }

  function parseUserInputCurrency(valStr, allowNegative = false) {
    if (!valStr || typeof valStr !== 'string') return 0;
    let str = valStr.trim().replace(/R\$/g, '').trim();
    if (str === '' || str === '-') return 0;
    const isNeg = str.startsWith('-');
    if (isNeg) str = str.substring(1).trim();
    if (str.includes('.') && str.includes(',')) {
      str = str.replace(/\./g, '').replace(',', '.');
    } else if (str.includes(',')) {
      str = str.replace(',', '.');
    }
    const num = parseFloat(str);
    if (isNaN(num)) return 0;
    return (allowNegative && isNeg) ? -Math.abs(num) : Math.abs(num);
  }

  function renderCategoryMonthCell(valObj, cat, monthNum, tipo, year) {
    const isGlobalForecastMonth = isPlanningMonthForecast(year, monthNum);
    const hasRealized = !!(valObj && valObj.realized > 0);
    // Célula é considerada previsão se possui valor previsto ativo ou flag isForecast com valor projetado
    const hasForecastVal = !!((valObj && valObj.planned > 0) || (valObj && valObj.isForecast && valObj.total > 0));
    const isForecast = hasForecastVal || (!hasRealized && isGlobalForecastMonth && (valObj && valObj.total > 0)) || (valObj && valObj.isForecast && !hasRealized && valObj.total > 0);
    const isManual = !!(valObj && valObj.isManualOverride);
    
    let textClasses = '';
    if (isManual) {
      if (isForecast) {
        textClasses = 'font-bold italic text-purple-600 dark:text-purple-400';
      } else {
        textClasses = 'font-bold text-gray-900 dark:text-white';
      }
    } else {
      if (isForecast) {
        textClasses = 'italic text-purple-600 dark:text-purple-400 font-medium';
      } else {
        textClasses = 'text-gray-700 dark:text-gray-300 font-normal';
      }
    }

    const formatted = formatCell(valObj);
    const rawVal = (valObj && valObj.total !== undefined) ? valObj.total : 0;
    const encodedCat = encodeURIComponent(cat);

    let titleTooltip = '';
    if (isForecast || (!hasRealized && isGlobalForecastMonth)) {
      titleTooltip = `Previsão: ${formatCurrency(rawVal)}\n• 1 clique: selecionar célula e abrir box de valor em lote\n• Clique em outro mês na linha para selecionar o período`;
    } else if (isManual) { 
      titleTooltip = `Valor editado manualmente: ${formatCurrency(rawVal)}\n• 1 clique: ver transações\n• 2 cliques: editar valor\n• Botão direito: restaurar cálculo original`;
    } else {
      titleTooltip = `• 1 clique: ver transações (descrição, categoria, valor, data)\n• 2 cliques: editar valor diretamente`;
    }

    return `<td class="px-2 py-1.5 text-center planning-cell-action cursor-pointer hover:bg-blue-50/70 dark:hover:bg-slate-700/60 transition-colors relative group/cell"
                data-cat="${encodedCat}"
                data-month="${monthNum}"
                data-tipo="${tipo}"
                data-year="${year}"
                data-raw-value="${rawVal}"
                data-is-manual="${isManual ? '1' : '0'}"
                data-is-forecast="${isForecast ? '1' : '0'}"
                data-has-realized="${hasRealized ? '1' : '0'}"
                title="${titleTooltip}">
              <span class="cell-val inline-block w-full py-0.5 select-none ${textClasses}">${formatted}</span>
            </td>`;
  }

  function formatCell(valObj) {
    if (!valObj || valObj.total === 0) return '-';
    return valObj.total.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

    // 1. Linha Total Saídas (Fixas + Variáveis Essenciais + Discricionárias)

    // Saldo inicial do ano anterior se existir Dezembro
    let prevCashFlow = 0;
    const prevYearStr = String(targetYear - 1);
    if (cfOverrides && cfOverrides[prevYearStr] && cfOverrides[prevYearStr]['12'] !== undefined) {
      prevCashFlow = parseFloat(cfOverrides[prevYearStr]['12']) || 0;
    }

    let fluxoCaixaCellsHtml = '';
    let finalYearCashFlow = 0;

    for (let m = 1; m <= 12; m++) {
      const idx = m - 1;
      const mMeta = (data.monthlyTotals && data.monthlyTotals[idx]) ? data.monthlyTotals[idx] : { income: 0, expense: 0, balance: 0 };
      const totalEntradas = mMeta.income || 0;
      const totalSaidas = mMeta.expense || 0;

      const isPast = (targetYear < currentYear) || (targetYear === currentYear && m < currentMonth);
      const isCurrent = (targetYear === currentYear && m === currentMonth);

      const isEditable = isPast || isCurrent;

      const mStr = String(m);
      const hasManualOverride = isEditable && (yearOverrides[mStr] !== undefined && yearOverrides[mStr] !== null);

      let currentVal = 0;
      let isManual = false;

      if (hasManualOverride) {
        currentVal = parseFloat(yearOverrides[mStr]) || 0;

      } else {
        // Regra do Fluxo de Caixa:

        currentVal = prevCashFlow + totalEntradas - totalSaidas;

      prevCashFlow = currentVal;
      if (m === 12) {
        finalYearCashFlow = currentVal;

      const isFc = isPlanningMonthForecast(targetYear, m);
      let textClass = '';

        textClass = 'text-rose-600 dark:text-rose-400 font-bold';

  // --- EDIÇÃO INLINE DIRETA NAS CÉLULAS DA MATRIZ ---
  function startInlineCellEdit($td) {
    if ($td.find('input').length > 0) return;
    
    // Conclui qualquer edição anterior aberta
    $('.planning-inline-input').each(function() {
      commitInlineCellEdit($(this));
    });

    const cat = decodeURIComponent($td.attr('data-cat') || '');
    const month = parseInt($td.attr('data-month'), 10);
    const tipo = $td.attr('data-tipo');
    const rawVal = parseFloat($td.attr('data-raw-value')) || 0;
    const isManual = $td.attr('data-is-manual') === '1';
    
    const displayVal = rawVal === 0 ? '' : rawVal.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    
    $td.data('previous-html', $td.html());
    $td.data('initial-raw-val', rawVal);
    $td.data('initial-is-manual', isManual);
    
    const input = $(`
      <input type="text"
             class="planning-inline-input w-full px-1 py-1 text-center text-xs font-bold bg-white dark:bg-slate-800 text-gray-900 dark:text-white border-2 border-primary rounded shadow-md focus:outline-none focus:ring-2 focus:ring-primary/60"
             value="${displayVal}"
             placeholder="0,00"
      />
    `);
    
    $td.empty().append(input);
    input.focus().select();
    
    let committed = false;
    
    input.on('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (!committed) {
          committed = true;
          commitInlineCellEdit(input);
        }
      } else if (e.key === 'Escape') {
        e.preventDefault();
        committed = true;
        cancelInlineCellEdit(input);
      } else if (e.key === 'Tab') {
        e.preventDefault();
        if (!committed) {
          committed = true;
          commitInlineCellEdit(input);
        }
        const cells = $td.closest('tbody').find('.planning-cell-action:visible');
        const idx = cells.index($td);
        const targetIdx = e.shiftKey ? idx - 1 : idx + 1;
        if (targetIdx >= 0 && targetIdx < cells.length) {
          setTimeout(() => startInlineCellEdit($(cells[targetIdx])), 50);
        }
      }
    });
    
    input.on('blur', function() {
      if (!committed) {
        committed = true;
        commitInlineCellEdit(input);
      }
    });

  function commitInlineCellEdit($input) {
    const $td = $input.closest('td');
    if ($td.length === 0 || !$input.parent().length) return;
    
    const rawText = $input.val().trim();
    const cat = decodeURIComponent($td.attr('data-cat') || '');
    const month = parseInt($td.attr('data-month'), 10);
    const tipo = $td.attr('data-tipo');
    const cellYear = parseInt($td.attr('data-year'), 10);
    const year = (!isNaN(cellYear) && cellYear > 2000) ? cellYear : (currentPlanningYear || getActivePlanningYear());
    
    const initialRawVal = parseFloat($td.data('initial-raw-val')) || 0;
    const initialIsManual = $td.data('initial-is-manual') === true;
    const parsedVal = parseUserInputCurrency(rawText);
    
    // Se o usuário NÃO alterou o valor (ex: continuou o mesmo valor que já estava na célula):
    // NÃO deixa em negrito e NÃO aplica override manual!
    const hasChanged = Math.abs(parsedVal - initialRawVal) > 0.005;
    
    if (!hasChanged) {
      // Sem alteração: restaura a célula exatamente ao estado que estava antes dos 2 cliques
      cancelInlineCellEdit($input);
      return;
    }
    
    // Houve alteração no valor: salva e aplica em negrito estritamente para o ano específico da célula
    savePlanningOverride(year, cat, month, tipo, parsedVal);
    
    const targetData = planningDataCacheByYear[year] || (planningDataCache && planningDataCache.year === year ? planningDataCache : null);
    if (targetData) {
      applyPlanningOverrides(targetData);
      
      if (currentPlanningYear === year) {
        const container = document.getElementById('planning-matrix-container');
        const scrollLeft = container ? container.scrollLeft : 0;
        const scrollTop = container ? container.scrollTop : 0;
        
        renderPlanning(targetData);
        
        if (container) {
          container.scrollLeft = scrollLeft;
          container.scrollTop = scrollTop;
        }
      }
    } else {
      loadPlanning(year);
    }
  }

    const prevHtml = $td.data('previous-html');
    if (prevHtml !== undefined) {
      $td.html(prevHtml);
    }
  }

  function executeBatchDeleteForecasts() {
    if (!selectedForecastCategories || selectedForecastCategories.size === 0) return;
    
    const count = selectedForecastCategories.size;
    const year = currentPlanningYear;
    const yStr = String(year);

    const now = window.getPlanningCurrentDate ? window.getPlanningCurrentDate() : new Date();
    const currentYear = now.getFullYear();
    const currentMonthNum = (year < currentYear) ? 12 : ((year > currentYear) ? 1 : (now.getMonth() + 1));

    const overrides = getPlanningOverrides();
    if (!overrides[yStr]) overrides[yStr] = {};

    const forecasts = getPlanningForecasts();
    if (!forecasts[yStr]) forecasts[yStr] = {};

    const categoriesArray = Array.from(selectedForecastCategories.values());

    categoriesArray.forEach(item => {
      const cat = item.cat;
      const tipo = item.tipo;
      const startMonth = currentMonthNum;

      if (typeof savePlanningExcludedCategory === 'function') {
        savePlanningExcludedCategory(year, cat);
      }

      if (!overrides[yStr][cat]) overrides[yStr][cat] = {};
      
      // Marca explicitamente no mapa de previsões como excluída
      forecasts[yStr][cat] = {
        forecastValue: 0,
        isEligible: false,
        isExcluded: true,
        months: {},
        updatedAt: Date.now()
      };

      for (let m = startMonth; m <= 12; m++) {
        overrides[yStr][cat][m] = {
          val: 0,
          tipo: tipo,
          isManualOverride: true,
          isForecast: true,
          isDeletedForecast: true,
          updatedAt: Date.now()
        };
      }
    });

    try {
      localStorage.setItem('fin_ally_planning_overrides', JSON.stringify(overrides));
      localStorage.setItem('fin_ally_planning_forecasts', JSON.stringify(forecasts));
    } catch(e) {}

    // Sincroniza com o backend estritamente para o ano específico
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      if (google.script.run.savePlanningForecastsBackend) {
        google.script.run.savePlanningForecastsBackend(year, JSON.stringify(forecasts));
      }
      if (google.script.run.savePlanningOverrideBackend) {
        categoriesArray.forEach(item => {
          const cat = item.cat;
          const tipo = item.tipo;
          const startMonth = currentMonthNum;
          for (let m = startMonth; m <= 12; m++) {
            google.script.run.savePlanningOverrideBackend(year, cat, m, tipo, 0);
          }
        });
      }
    }

    selectedForecastCategories.clear();
    updateForecastSelectionUI();

    // Aplica imediatamente ao cache em memória e re-renderiza a matriz
    if (planningDataCacheByYear && planningDataCacheByYear[year]) {
      applyPlanningOverrides(planningDataCacheByYear[year]);
      renderPlanning(planningDataCacheByYear[year]);
    }

    loadPlanning(year);

    showRefreshToast(`Previsões de ${count} ${count === 1 ? 'linha excluída' : 'linhas excluídas'} com sucesso!`);
  }

  let activeForecastRange = null; 
  // Objeto: { cat: string, tipo: string, year: number, anchorMonth: number, startMonth: number, endMonth: number }

  function getTdsForRange() {
    if (!activeForecastRange) return $();
    return $('td.planning-cell-action').filter(function() {
      const cCat = decodeURIComponent($(this).attr('data-cat') || '');
      const cYear = parseInt($(this).attr('data-year'), 10);
      const cMonth = parseInt($(this).attr('data-month'), 10);
      return cCat === activeForecastRange.cat &&
             cYear === activeForecastRange.year &&
             cMonth >= activeForecastRange.startMonth &&
