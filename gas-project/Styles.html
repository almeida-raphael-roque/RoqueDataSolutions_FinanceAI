<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  
  :root {
    --color-surface: 255 255 255;      /* #ffffff */
    --color-background: 248 250 252;   /* #f8fafc */
  }
  
  html.dark {
    --color-surface: 30 41 59;         /* #1e293b (slate-800) */
    --color-background: 15 23 42;      /* #0f172a (slate-900) */
  }

  body {
    font-family: 'Inter', sans-serif;
  }
  
  /* Custom scrollbar */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 3px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
  }
  
  .hidden-page {
    display: none !important;
  }
  
  .glass-card {
    background: rgba(var(--color-surface), 0.95);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }


  /* Dark mode global overrides to avoid editing thousands of HTML classes */
  html.dark body {
    background-color: rgb(var(--color-background)) !important;
    color: #f1f5f9 !important; /* slate-100 */
  }
  html.dark .bg-white {
    background-color: rgb(var(--color-surface)) !important;
  }
  html.dark .bg-gray-50 {
    background-color: rgb(var(--color-background)) !important;
  }
  html.dark .bg-gray-100 {
    background-color: rgb(var(--color-surface)) !important;
  }
  html.dark .bg-gray-200 {
    background-color: #334155 !important;
  }
  html.dark .text-gray-900, html.dark .text-gray-800, html.dark .text-slate-900, html.dark .text-slate-800 {
    color: #f8fafc !important;
  }
  html.dark .text-gray-700 {
    color: #e2e8f0 !important;
  }
  html.dark .text-gray-600 {
    color: #cbd5e1 !important;
  }
  html.dark .text-gray-500 {
    color: #94a3b8 !important;
  }
  html.dark .border-gray-100, html.dark .border-gray-200, html.dark .border-gray-300, html.dark .border-white {
    border-color: #334155 !important;
  }
  html.dark .shadow-sm, html.dark .shadow, html.dark .shadow-md {
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2) !important;
  }
  
  /* Make sure sidebar doesn't get messed up */
  html.dark aside, html.dark aside .bg-gray-800 {
    background-color: #020617 !important; /* slate-950 */
  }
  html.dark aside .text-gray-400 {
    color: #94a3b8 !important;
  }
  
  /* Inputs in dark mode */
  html.dark input, html.dark select, html.dark textarea {
    background-color: rgb(var(--color-surface)) !important;
    color: #f1f5f9 !important;
    border-color: #334155 !important;
  }
</style>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'sans-serif'],
        },
        colors: {
          primary: '#0ea5e9',
          secondary: '#334155',
          success: '#10b981',
          danger: '#ef4444',
          warning: '#f59e0b',
          surface: 'rgb(var(--color-surface) / <alpha-value>)',
          background: 'rgb(var(--color-background) / <alpha-value>)'
        }
      }
    }
  }
</script>
