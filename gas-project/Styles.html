<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  
  :root {
    --color-surface: 255 255 255;      /* #ffffff */
    --color-background: 248 250 252;   /* #f8fafc */
  }
  
  html.dark {
    --color-surface: 30 41 59;         /* #1e293b (slate-800) */
    --color-background: 15 23 42;      /* #0f172a (slate-900) */
  }

  body {
    font-family: 'Inter', sans-serif;
  }
  
  /* Custom scrollbar */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 3px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
  }
  
  .hidden-page {
    display: none !important;
  }
  
  .glass-card {
    background: rgba(var(--color-surface), 0.95);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }


  /* Dark mode global overrides to avoid editing thousands of HTML classes */
  html.dark body {
    background-color: rgb(var(--color-background)) !important;
    color: #f1f5f9 !important; /* slate-100 */
  }
  html.dark .bg-white {
    background-color: rgb(var(--color-surface)) !important;
  }
  html.dark .bg-gray-50 {
    background-color: rgb(var(--color-background)) !important;
  }
  html.dark .bg-gray-100 {
    background-color: rgb(var(--color-surface)) !important;
  }
  html.dark .bg-gray-200 {
    background-color: #334155 !important;
  }
  html.dark .text-gray-900, html.dark .text-gray-800, html.dark .text-slate-900, html.dark .text-slate-800 {
    color: #f8fafc !important;
  }
  html.dark .text-gray-700 {
    color: #e2e8f0 !important;
  }
  html.dark .text-gray-600 {
    color: #cbd5e1 !important;
  }
  html.dark .text-gray-500 {
    color: #94a3b8 !important;
  }
  html.dark .border-gray-100, html.dark .border-gray-200, html.dark .border-gray-300, html.dark .border-white {
    border-color: #334155 !important;
  }
  html.dark .shadow-sm, html.dark .shadow, html.dark .shadow-md {
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2) !important;
  }
  
  /* Make sure sidebar doesn't get messed up */
  html.dark aside, html.dark aside .bg-gray-800 {
    background-color: #020617 !important; /* slate-950 */
  }
  html.dark aside .text-gray-400 {
    color: #94a3b8 !important;
  }
  
  /* Inputs in dark mode */
  html.dark input, html.dark select, html.dark textarea {
    background-color: rgb(var(--color-surface)) !important;
    color: #f1f5f9 !important;
    border-color: #334155 !important;
  }

  /* Planning Matrix Sticky Columns Fix */
  .planning-sticky-col {
    position: sticky !important;
    left: 0 !important;
    min-width: 250px !important;
    width: 250px !important;
    max-width: 250px !important;
    box-shadow: 2px 0 6px -2px rgba(0, 0, 0, 0.25) !important;
    border-right-width: 1px !important;
  }
  html.dark .planning-sticky-col {
    box-shadow: 4px 0 10px -2px rgba(0, 0, 0, 0.75) !important;
  }
  .planning-sticky-header {
    position: sticky !important;
    left: 0 !important;
    top: 0 !important;
    z-index: 35 !important;
  }
  .planning-sticky-footer {
    position: sticky !important;
    left: 0 !important;
    z-index: 25 !important;
  }
  .planning-sticky-body {
    z-index: 25 !important;
  }
  .planning-th-cat {
    background-color: #f1f5f9 !important;
    color: #1e293b !important;
  }
  html.dark .planning-th-cat {
    background-color: #0f172a !important;
    color: #f8fafc !important;
  }
  .planning-tf-total-saidas {
    background-color: #fff1f2 !important;
    color: #9f1239 !important;
  }
  html.dark .planning-tf-total-saidas {
    background-color: #3b0716 !important;
    color: #fecdd3 !important;
  }
  .planning-tf-saldo {
    background-color: #f1f5f9 !important;
    color: #0f172a !important;
  }
  html.dark .planning-tf-saldo {
    background-color: #0f172a !important;
    color: #f8fafc !important;
  }
  .planning-tf-fluxo-caixa {
    background-color: #eff6ff !important;
    color: #1e3a8a !important;
  }
  html.dark .planning-tf-fluxo-caixa {
    background-color: #0f172a !important;
    color: #93c5fd !important;
  }
  .planning-rec-master {
    background-color: #ecfdf5 !important;
    color: #065f46 !important;
  }
  html.dark .planning-rec-master {
    background-color: #064e3b !important;
    color: #a7f3d0 !important;
  }
  .planning-fixas-master {
    background-color: #fff1f2 !important;
    color: #9f1239 !important;
  }
  html.dark .planning-fixas-master {
    background-color: #4c0519 !important;
    color: #fecdd3 !important;
  }
  .planning-essenciais-master {
    background-color: #fff7ed !important;
    color: #9a3412 !important;
  }
  html.dark .planning-essenciais-master {
    background-color: #431407 !important;
    color: #fed7aa !important;
  }
  .planning-disc-master {
    background-color: #fffbeb !important;
    color: #92400e !important;
  }
  html.dark .planning-disc-master {
    background-color: #451a03 !important;
    color: #fde68a !important;
  }
  .planning-child-cat {
    background-color: #ffffff !important;
    color: #334155 !important;
  }
  tr:hover .planning-child-cat {
    background-color: #f8fafc !important;
  }
  html.dark .planning-child-cat {
    background-color: #1e293b !important;
    color: #e2e8f0 !important;
  }
  html.dark tr:hover .planning-child-cat {
    background-color: #334155 !important;
  }
  .planning-inline-input {
    min-width: 75px;
    outline: none;
    box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.4);
  }

  /* Sidebar Collapsed State */
  #app-sidebar {
    transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #app-sidebar.sidebar-collapsed {
    width: 4.5rem !important; /* 72px */
  }
  #app-sidebar.sidebar-collapsed #sidebar-header {
    padding-left: 0.5rem !important;
    padding-right: 0.5rem !important;
    padding-top: 1rem !important;
    padding-bottom: 1rem !important;
    flex-direction: column !important;
    gap: 0.75rem !important;
    justify-content: center !important;
  }
  #app-sidebar.sidebar-collapsed .sidebar-label,
  #app-sidebar.sidebar-collapsed #sidebar-section-title,
  #app-sidebar.sidebar-collapsed #theme-toggle-text,
  #app-sidebar.sidebar-collapsed #theme-toggle-track {
    display: none !important;
  }
  #app-sidebar.sidebar-collapsed .nav-item {
    padding-left: 0 !important;
    padding-right: 0 !important;
    justify-content: center !important;
    gap: 0 !important;
  }
  #app-sidebar.sidebar-collapsed .nav-item i {
    margin: 0 !important;
    width: auto !important;
    font-size: 1.1rem !important;
  }
  #app-sidebar.sidebar-collapsed #sidebar-footer {
    padding-left: 0.5rem !important;
    padding-right: 0.5rem !important;
    padding-top: 0.75rem !important;
    padding-bottom: 0.75rem !important;
  }
  #app-sidebar.sidebar-collapsed #theme-toggle {
    justify-content: center !important;
    padding-left: 0 !important;
    padding-right: 0 !important;
  }
  #app-sidebar.sidebar-collapsed #theme-toggle .flex {
    justify-content: center !important;
    margin: 0 !important;
    gap: 0 !important;
  }
  #app-sidebar.sidebar-collapsed #theme-toggle-icon {
    font-size: 1.1rem !important;
    margin: 0 !important;
  }
</style>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'sans-serif'],
        },
        colors: {
          primary: '#0ea5e9',
          secondary: '#334155',
          success: '#10b981',
          danger: '#ef4444',
          warning: '#f59e0b',
          surface: 'rgb(var(--color-surface) / <alpha-value>)',
          background: 'rgb(var(--color-background) / <alpha-value>)'
        }
      }
    }
  }
</script>
